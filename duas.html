<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="دعا و اعمال — دعاها، زیارات، سخنرانی‌ها و مطالب مهدوی">
<title>دعا و اعمال | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<style>
:root{
  --bg:#fbf8ff;--bg2:#f5ecfb;
  --card:rgba(255,255,255,.84);--card-solid:#fff;
  --text:#25152d;--muted:#776b80;
  --line:rgba(112,55,140,.12);
  --primary:#a832d6;--pink:#ec4899;--rose:#e11d48;
  --brand:linear-gradient(110deg,#e11d48 0%,#db2777 43%,#a855f7 100%);
  --soft:rgba(168,50,214,.09);
  --shadow2:0 8px 25px rgba(88,37,111,.10);
  --nav-h:78px;
}
html[data-theme="dark"],
body.dark{
  --bg:#000;--bg2:#000;
  --card:rgba(28,28,30,.72);--card-solid:#1c1c1e;
  --text:#f9effd;--muted:#8e8e93;
  --line:rgba(192,132,252,.16);
  --soft:rgba(192,132,252,.12);
  --shadow2:0 10px 30px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 100% 0%,rgba(236,72,153,.08),transparent 30%),
    radial-gradient(circle at 0% 30%,rgba(139,92,246,.08),transparent 28%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  transition:background .25s,color .25s;
}
html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}
body.lang-ltr { direction: ltr; }
body.lang-ltr #backBtn svg { transform: none; }
body.lang-ltr .article:before { right: auto; left: 0; }
body.lang-ltr .article-main { padding-left: 0; padding-right: 4px; }
body.lang-ltr .back-cat-btn svg { transform: none; }
body.lang-ltr .open-btn svg { transform: none; }
body.lang-ltr .search-box svg { right: auto; left: 14px; }
body.lang-ltr .search-box input { padding: 0 14px 0 42px; }
body.lang-ltr .instruction-list { padding: 0 0 0 17px; }
body.lang-ltr .virtue-box { border-right: 0; border-left: 3px solid var(--pink); }

button,input{font:inherit}
button{border:0;cursor:pointer;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:21px;height:21px;display:block}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:60;min-height:64px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex;align-items:center;gap:8px;
  background:rgba(251,248,255,.76);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:rgba(0,0,0,.78)}
.top-side{
  width:40px;height:40px;flex:0 0 40px;
  border-radius:13px;display:grid;place-items:center;
  color:var(--text);background:var(--card);border:1px solid var(--line);
  transition:transform .15s;
}
.top-side:active{transform:scale(.93)}
.top-side svg{width:19px;height:19px}
.brand-title{flex:1;min-width:0;text-align:center}
.brand-title strong{display:block;font-size:15px;font-weight:900}
.brand-title span{display:block;margin-top:1px;font-size:10px;color:var(--muted)}

main{
  width:min(720px,100%);margin:auto;
  padding:14px 12px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));
}

.hero{
  position:relative;overflow:hidden;min-height:150px;padding:18px;
  border-radius:24px;color:#fff;background:var(--brand);
  box-shadow:0 14px 32px rgba(178,43,130,.22);
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:150px;height:150px;left:-60px;bottom:-80px;background:rgba(255,255,255,.12)}
.hero:after{width:200px;height:200px;right:-100px;top:-110px;border:1px solid rgba(255,255,255,.15);box-shadow:0 0 0 25px rgba(255,255,255,.035),0 0 0 50px rgba(255,255,255,.025)}
.hero-content{position:relative;z-index:2}
.hero-badge{
  width:max-content;display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:100px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);
  font-size:10px;font-weight:800;
}
.hero-badge svg{width:14px;height:14px}
.hero h1{margin:11px 0 5px;font-size:20px;line-height:1.3;font-weight:950}
.hero p{margin:0;max-width:400px;font-size:11px;line-height:1.9;opacity:.92}

.daily{
  margin-top:12px;padding:11px 13px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow2);
  display:flex;align-items:center;gap:11px;cursor:pointer;
}
.daily:active{transform:scale(.99)}
.daily-icon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--brand)}
.daily-icon svg{width:20px;height:20px}
.daily-text{min-width:0;flex:1}
.daily-text small{color:var(--primary);font-weight:900;font-size:9.5px}
.daily-text strong{display:block;margin-top:3px;font-size:12.5px}
.daily-text span{display:block;margin-top:2px;color:var(--muted);font-size:10.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.search-box{position:relative;margin-top:12px}
.search-box svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:18px;height:18px}
.search-box input{
  width:100%;height:46px;padding:0 42px 0 14px;
  border:1px solid var(--line);border-radius:15px;outline:0;
  color:var(--text);background:var(--card);
  box-shadow:var(--shadow2);transition:.2s;font-size:13px;
}
.search-box input:focus{border-color:rgba(168,50,214,.4);box-shadow:0 0 0 4px rgba(168,50,214,.08)}
.search-box input::placeholder{color:var(--muted)}

.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.cat-card{
  position:relative;overflow:hidden;padding:14px;
  border-radius:20px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow2);
  text-align:right;transition:transform .18s;cursor:pointer;
}
.cat-card:active{transform:scale(.97)}
.cat-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--brand);box-shadow:0 6px 16px rgba(185,40,130,.22);margin-bottom:10px}
.cat-icon svg{width:22px;height:22px}
.cat-title{font-size:14px;font-weight:900;line-height:1.4}
.cat-count{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700}

.list-header{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px;gap:8px}
.list-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900}
.list-title svg{width:20px;height:20px;color:var(--primary)}
.back-cat-btn{
  height:34px;padding:0 12px;display:flex;align-items:center;gap:5px;
  border-radius:11px;color:var(--primary);background:var(--soft);
  font-size:11px;font-weight:800;
}
.back-cat-btn svg{width:14px;height:14px;transform:scaleX(-1)}
.list-meta{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;gap:8px}
.result-count{color:var(--muted);font-size:11px;font-weight:700}
.bookmark-filter{
  height:32px;padding:0 11px;display:flex;align-items:center;gap:5px;
  border-radius:11px;color:var(--muted);background:var(--card);
  border:1px solid var(--line);font-size:10.5px;font-weight:800;
}
.bookmark-filter.active{color:var(--primary);background:var(--soft);border-color:rgba(168,50,214,.22)}
.bookmark-filter svg{width:13px;height:13px}

.list{display:grid;gap:9px}
.article{
  position:relative;overflow:hidden;padding:12px;
  border-radius:18px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow2);
  transition:transform .18s;cursor:pointer;
}
.article:before{content:"";position:absolute;top:0;right:0;width:3.5px;height:100%;background:var(--brand);opacity:.85}
.article:active{transform:scale(.988)}
.article-top{display:flex;align-items:flex-start;gap:10px}
.article-icon{
  width:42px;height:42px;flex:0 0 42px;
  display:grid;place-items:center;border-radius:13px;
  color:var(--primary);background:var(--soft);border:1px solid rgba(168,50,214,.08);
}
.article-icon svg{width:20px;height:20px}
.article-main{min-width:0;flex:1;padding-left:4px}
.article-title{margin:0 0 3px;font-size:13.5px;font-weight:950;line-height:1.6}
.article-excerpt{
  margin:0;color:var(--muted);font-size:10.5px;line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.article-bookmark{
  width:34px;height:34px;flex:0 0 34px;
  display:grid;place-items:center;border-radius:11px;
  color:var(--muted);background:transparent;
}
.article-bookmark svg{width:17px;height:17px}
.article-bookmark.active{color:#e39a19;background:rgba(227,154,25,.1)}
.article-bookmark.active svg{fill:currentColor}
.article-meta{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.meta{
  display:inline-flex;align-items:center;gap:4px;
  min-height:24px;padding:0 7px;border-radius:8px;
  color:var(--muted);background:rgba(120,80,140,.055);
  font-size:9.5px;font-weight:700;
}
.meta svg{width:12px;height:12px}
.article-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.open-btn{
  height:32px;padding:0 12px;display:flex;align-items:center;gap:5px;
  border-radius:10px;color:#fff;background:var(--brand);
  font-size:10.5px;font-weight:900;
}
.open-btn svg{width:13px;height:13px;transform:scaleX(-1)}
.has-audio{display:flex;align-items:center;gap:4px;color:var(--primary);font-size:9.5px;font-weight:800}
.has-audio svg{width:12px;height:12px}

.state{padding:36px 16px;text-align:center;color:var(--muted);font-size:12px}
.loader{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(168,50,214,.15);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-icon{width:52px;height:52px;margin:0 auto 10px;display:grid;place-items:center;border-radius:17px;color:var(--muted);background:var(--soft)}
.empty-icon svg{width:24px;height:24px}

.modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(16,6,20,.58);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .25s,visibility .25s;
}
.modal.show{opacity:1;visibility:visible;pointer-events:auto}
.sheet{
  width:min(760px,100%);max-height:94vh;overflow:hidden;
  border-radius:26px 26px 0 0;background:var(--card-solid);
  box-shadow:0 -20px 70px rgba(0,0,0,.28);
  transform:translateY(35px);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.modal.show .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;flex:0 0 4px;margin:8px auto 4px;border-radius:20px;background:rgba(120,100,130,.25)}
.sheet-head{
  min-height:60px;padding:8px 13px 9px;display:flex;align-items:center;gap:9px;
  background:var(--card-solid);border-bottom:1px solid var(--line);
}
.sheet-close{
  width:38px;height:38px;flex:0 0 38px;
  display:grid;place-items:center;border-radius:12px;
  color:var(--text);background:var(--soft);
}
.sheet-close svg{width:18px;height:18px}
.sheet-close.active{color:#e39a19;background:rgba(227,154,25,.1)}
.sheet-close.active svg{fill:currentColor}
.sheet-title{flex:1;min-width:0}
.sheet-title strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.sheet-title span{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.sheet-scroll{
  overflow-y:auto;overscroll-behavior:contain;
  padding:13px 13px 26px;-webkit-overflow-scrolling:touch;
}

.player{
  position:relative;overflow:hidden;padding:13px;
  border-radius:22px;
  background:radial-gradient(circle at 0 100%,rgba(236,72,153,.15),transparent 35%),
             linear-gradient(145deg,#24112d,#160d1d 58%,#28102d);
  color:#fff;box-shadow:0 14px 34px rgba(60,16,70,.24);
  margin-bottom:12px;
}
.player:after{content:"";position:absolute;width:160px;height:160px;right:-85px;top:-100px;border-radius:50%;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 22px rgba(255,255,255,.025)}
.player-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px}
.cover{position:relative;width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;border-radius:17px;background:var(--brand);overflow:hidden}
.cover:before{content:"";position:absolute;inset:5px;border-radius:13px;border:1px solid rgba(255,255,255,.2)}
.cover svg{position:relative;z-index:2;width:24px;height:24px}
.player-info{min-width:0;flex:1}
.player-label{display:flex;align-items:center;gap:6px;color:#d9b8e5;font-size:9px;font-weight:800}
.player-label i{width:5px;height:5px;border-radius:50%;background:#f472b6;box-shadow:0 0 0 4px rgba(244,114,182,.1)}
.player-title{margin-top:4px;font-size:13px;font-weight:900;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-speaker{margin-top:2px;color:#bba6c2;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.equalizer{width:34px;height:24px;display:flex;align-items:flex-end;justify-content:center;gap:3px;opacity:.75;flex:0 0 auto}
.equalizer span{width:3px;height:7px;border-radius:5px;background:#f472b6;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.equalizer span:nth-child(2){height:14px;animation-delay:-.2s}
.equalizer span:nth-child(3){height:20px;animation-delay:-.4s}
.equalizer span:nth-child(4){height:11px;animation-delay:-.6s}
.equalizer span:nth-child(5){height:16px;animation-delay:-.8s}
.player.playing .equalizer span{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.progress-area{position:relative;z-index:2;margin-top:15px;direction:ltr}
.progress-track{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.progress-line{position:relative;width:100%;height:5px;border-radius:20px;background:rgba(255,255,255,.14)}
.progress-fill{position:absolute;top:0;left:0;height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,#f472b6,#c084fc)}
.progress-thumb{position:absolute;top:50%;left:0;width:12px;height:12px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.25)}
.time-row{display:flex;justify-content:space-between;direction:ltr;margin-top:5px;color:#aa94b2;font-size:9px;font-variant-numeric:tabular-nums}
.player-controls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.ctrl{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
.ctrl svg{width:16px;height:16px}
.play-btn{width:54px;height:54px;color:#34112e;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.play-btn svg{width:21px;height:21px}
.player-tools{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.tool{min-height:33px;padding:0 7px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;color:#cbb9d0;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);font-size:9.5px;font-weight:800}
.tool svg{width:13px;height:13px}
.tool.active{color:#fff;background:rgba(236,72,153,.18);border-color:rgba(236,72,153,.25)}
.volume-row{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin-top:9px;color:#aa94b2}
.volume-row svg{width:14px;height:14px;flex:0 0 14px}
.volume-slider{width:100%;height:4px;accent-color:#f472b6;background:transparent}
.audio-message{position:relative;z-index:2;margin-top:9px;padding:7px 9px;border-radius:9px;color:#ffb4c9;background:rgba(225,29,72,.1);font-size:9.5px;display:none}
.audio-message.show{display:block}

.video-box{
  overflow:hidden;margin-bottom:12px;border-radius:18px;
  background:#08070a;box-shadow:var(--shadow2);position:relative;
}
.video-box iframe,.video-box video{
  display:block;width:100%;aspect-ratio:16/9;border:0;background:#000;
}
.video-fullscreen-btn{
  position:absolute;bottom:52px;left:12px;z-index:4;
  width:36px;height:36px;border-radius:10px;
  background:rgba(0,0,0,.65);color:#fff;
  display:grid;place-items:center;
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.15);
  transition:transform .15s;
}
.video-fullscreen-btn:active{transform:scale(.9)}
.video-fullscreen-btn svg{width:17px;height:17px}
.video-caption{padding:9px 11px;color:#b9adbd;font-size:10px;background:#100d12}

.tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 1px 7px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:34px;padding:0 12px;border-radius:11px;color:var(--muted);background:var(--soft);font-size:10.5px;font-weight:850}
.tab.active{color:#fff;background:var(--brand);box-shadow:0 5px 13px rgba(185,40,130,.17)}
.content-panel{
  padding:14px 13px;border-radius:16px;
  background:var(--soft);border:1px solid var(--line);
  line-height:2.1;
}
.arabic-text{
  font-family:"Noto Naskh Arabic","Amiri",serif;
  font-size:16.5px;line-height:2.2;
  text-align:right;direction:rtl;margin:6px 0;
}
.translation-text,.normal-text{font-size:12.5px;line-height:2.05}
.instruction-list{margin:0;padding:0 17px 0 0}
.instruction-list li{margin:0 0 8px;line-height:1.9;font-size:12.5px}
.virtue-box{
  padding:12px;border-radius:13px;background:rgba(236,72,153,.07);
  border-right:3px solid var(--pink);line-height:2;font-size:12.5px;
}
.source-box{margin-top:11px;color:var(--muted);font-size:10px;line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.tag{padding:4px 8px;border-radius:7px;color:var(--primary);background:var(--soft);font-size:9.5px;font-weight:700}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}
.action{min-height:40px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);font-size:10px;font-weight:800}
.action svg{width:15px;height:15px}
.action.active{color:#e39a19;background:rgba(227,154,25,.08)}
.action.active svg{fill:currentColor}

.toast{
  position:fixed;z-index:300;right:50%;
  bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(50%,20px);max-width:calc(100% - 30px);
  padding:10px 14px;border-radius:12px;
  color:#fff;background:#24162a;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  font-size:11px;font-weight:800;
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(50%,0)}

.bottom-nav{
  position:fixed;z-index:70;right:0;bottom:0;left:0;
  min-height:var(--nav-h);
  padding:6px max(10px,env(safe-area-inset-left))
          calc(6px + env(safe-area-inset-bottom))
          max(10px,env(safe-area-inset-right));
  display:grid;grid-template-columns:1fr 1fr 68px 1fr 1fr;
  align-items:end;gap:2px;

<script>
"use strict";

const BASE_PATH = "data/duas/";
const CACHE_VERSION = "v11";
const DUA_FILES = [
  { id:"dua",       title:"دعا",       icon:"prayer", file:"duas.json" },
  { id:"ziyarat",   title:"زیارت",     icon:"star",   file:"ziyarat.json" },
  { id:"lecture",   title:"سخنرانی",   icon:"chat",   file:"lectures.json" },
  { id:"mahdaviat", title:"مهدویت",    icon:"heart",  file:"mahdaviat.json" }
];
const CATEGORIES = [
  { id:"dua",       title:"دعا",       icon:"prayer" },
  { id:"ziyarat",   title:"زیارت",     icon:"star" },
  { id:"lecture",   title:"سخنرانی",   icon:"chat" },
  { id:"mahdaviat", title:"مهدویت",    icon:"heart" },
  { id:"videos",    title:"ویدیوها",   icon:"video" }
];
const BM_KEY="bn_duas_bm_v1", POSITION_KEY="bn_audio_positions_v1",
      SPEED_KEY="bn_audio_speed", LOOP_KEY="bn_audio_loop",
      VOLUME_KEY="bn_audio_volume_v1", THEME_KEY="bn_theme";

let allArticles=[], filteredArticles=[], currentCategory=null, currentView="categories";
let showBookmarks=false, currentArticle=null, currentTab="main";
let audioEl=null, audioCleanup=null;
let bookmarks=loadObject(BM_KEY), positions=loadObject(POSITION_KEY);
let playbackSpeed=clampNumber(localStorage.getItem(SPEED_KEY),.5,2,1);
let volumeValue=clampNumber(localStorage.getItem(VOLUME_KEY),0,1,1);
let loopEnabled=localStorage.getItem(LOOP_KEY)==="1";
let toastTimer=null, speechActive=false, lastFocusedElement=null;

const $=id=>document.getElementById(id);
const articleList=$("articleList");
const searchInput=$("searchInput");
const resultCount=$("resultCount");
const catGrid=$("catGrid");
const categoriesView=$("categoriesView");
const listView=$("listView");
const listTitle=$("listTitle");
const pageTitle=$("pageTitle");
const modal=$("modal"), modalTitle=$("modalTitle"), modalSubtitle=$("modalSubtitle");
const modalBookmark=$("modalBookmark"), modalScroll=$("modalScroll");
const mediaArea=$("mediaArea"), tabsArea=$("tabsArea"), contentArea=$("contentArea");
const toastEl=$("toast");

/* THEME */
function getSystemTheme(){
  try{return window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
  catch(e){return"light"}
}
function getSavedTheme(){
  try{const t=localStorage.getItem(THEME_KEY);if(t==="dark"||t==="light")return t}catch(e){}
  return getSystemTheme();
}
function applyTheme(){
  const t=getSavedTheme();
  document.documentElement.setAttribute("data-theme",t);
  document.body.classList.toggle("dark",t==="dark");
  const m=$("themeMeta"); if(m) m.setAttribute("content",t==="dark"?"#000000":"#db2777");
}
applyTheme();

/* HELPERS */
function loadObject(k){try{const v=JSON.parse(localStorage.getItem(k)||"{}");return v&&typeof v==="object"?v:{}}catch(e){return{}}}
function saveObject(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function clampNumber(v,min,max,fb){const n=Number(v);if(!isFinite(n))return fb;return Math.min(max,Math.max(min,n))}
function escapeHTML(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function normalizeSearch(v){
  return String(v||"").toLowerCase()
    .replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک")
    .replace(/ۀ/g,"ه").replace(/ة/g,"ه").replace(/ؤ/g,"و")
    .replace(/إ/g,"ا").replace(/أ/g,"ا").replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"").replace(/\s+/g," ").trim();
}
function iconUse(name){
  const valid=["prayer","star","chat","heart","book","sparkle","music","video"];
  if(valid.indexOf(name)===-1) name="book";
  return '<svg aria-hidden="true"><use href="#i-'+name+'"></use></svg>';
}
function showToast(msg){
  clearTimeout(toastTimer);
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2200);
}
function formatTime(s){
  if(!isFinite(s)||s<0) return "00:00";
  s=Math.floor(s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return h>0 ? String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0")
             : String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
function getArticleId(a){return String(a.id||a.title||"unknown")}
function getYouTubeId(url){
  try{
    const m=String(url||"").match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m?m[1]:null;
  }catch(e){return null}
}

/* NORMALIZE */
function normalizeArticle(a,category){
  if(!a||typeof a!=="object") return null;
  const found=DUA_FILES.find(x=>x.id===category);
  const art={
    id:a.id||a.slug||a.key||a.title||a.name,
    title:a.title||a.name||"بدون عنوان",
    excerpt:a.excerpt||a.short||a.summary||"",
    contentAr:a.content_ar||a.contentAr||a.arabic||"",
    translationFa:a.translation_fa||a.translationFa||a.translation||a.farsi||"",
    instructions:a.instructions||a.instruction||a.howTo||a.method||"",
    virtue:a.virtue||a.fazilat||a.benefit||"",
    content:a.content||a.text||a.body||"",
    tags:Array.isArray(a.tags)?a.tags:(a.tags?[a.tags]:[]),
    source:a.source||a.reference||a.ref||"",
    icon:a.icon||(found&&found.icon)||"book",
    speaker:a.speaker||a.reciter||a.author||"",
    type:a.type||category,
    audioUrl:a.audioUrl||a.audio_url||(typeof a.audio==="string"?a.audio:"")||(a.audio&&a.audio.url?a.audio.url:""),
    videoUrl:a.videoUrl||a.video_url||(typeof a.video==="string"?a.video:"")||(a.video&&a.video.url?a.video.url:""),
    duration:a.duration||a.audioDuration||"",
    category,
    categoryTitle:(found&&found.title)||category
  };
  art.id=String(art.id||(category+"_"+art.title));
  return art;
}
function extractArticles(data,category){
  const result=[];
  if(Array.isArray(data)){
    data.forEach(item=>{const a=normalizeArticle(item,category);if(a)result.push(a)});
    return result;
  }
  if(!data||typeof data!=="object") return result;
  const keys=["articles","items","duas","ziyarat","lectures","mahdaviat","data","results"];
  for(const k of keys){
    if(Array.isArray(data[k])){
      data[k].forEach(item=>{const a=normalizeArticle(item,category);if(a)result.push(a)});
      if(result.length) return result;
    }
  }
  const a=normalizeArticle(data,category);
  if(a) result.push(a);
  return result;
}

/* LOAD */
async function loadAllData(){
  catGrid.innerHTML='<div class="state" style="grid-column:span 2"><div class="loader"></div>در حال بارگذاری...</div>';
  const loaded=[];
  for(const item of DUA_FILES){
    try{
      const r=await fetch(BASE_PATH+item.file+"?v="+CACHE_VERSION,{cache:"no-cache"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const data=await r.json();
      loaded.push(...extractArticles(data,item.id));
    }catch(err){ console.warn("Load failed:",item.file,err); }
  }
  allArticles=loaded;
  renderCategories();
  renderDaily();
}

/* DAILY */
function renderDaily(){
  if(!allArticles.length) return;
  const day=Math.floor(Date.now()/86400000);
  const idx=Math.abs(day)%allArticles.length;
  const a=allArticles[idx];
  $("dailyTitle").textContent = a.category==="lecture"&&a.speaker ? "سخنرانی "+a.speaker : a.title;
  $("dailyExcerpt").textContent = a.excerpt || a.categoryTitle;
}

/* CATEGORIES */
function renderCategories(){
  const counts={};
  allArticles.forEach(a=>counts[a.category]=(counts[a.category]||0)+1);
  const videosCount = allArticles.filter(a=>a.videoUrl).length;
  catGrid.innerHTML = CATEGORIES.map(c=>{
    const count = c.id==="videos" ? videosCount : (counts[c.id]||0);
    return `
      <button class="cat-card" data-cat="${c.id}" type="button">
        <div class="cat-icon">${iconUse(c.icon)}</div>
        <div class="cat-title">${c.title}</div>
        <span class="cat-count">${count} مورد</span>

  }).join("");
}

/* VIEW */
function openCategory(catId){
  currentCategory=catId; currentView="list";
  categoriesView.classList.add("hidden");
  listView.classList.remove("hidden");
  const cat=CATEGORIES.find(c=>c.id===catId);
  const title=cat?cat.title:"";
  pageTitle.textContent=title;
  listTitle.innerHTML='<svg><use href="#i-'+(cat?cat.icon:"book")+'"></use></svg><span>'+title+'</span>';
  applyFilters();

}
function backToCategories(){
  currentCategory=null; currentView="categories";
  listView.classList.add("hidden");
  categoriesView.classList.remove("hidden");
  pageTitle.textContent="دعا و اعمال";
  searchInput.value="";
  showBookmarks=false;
  $("bookmarkFilter").classList.remove("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

/* FILTER */
function applyFilters(){
  const q=normalizeSearch(searchInput.value);
  filteredArticles=allArticles.filter(a=>{
    if(currentCategory==="videos"){ if(!a.videoUrl) return false; }
    else if(currentCategory && a.category!==currentCategory) return false;
    if(showBookmarks && !bookmarks[getArticleId(a)]) return false;
    if(!q) return true;
    const hay=normalizeSearch([a.title,a.excerpt,a.content,a.contentAr,
      a.translationFa,a.instructions,a.virtue,a.source,a.speaker,
      (a.tags||[]).join(" "),a.categoryTitle].join(" "));
    return hay.includes(q);
  });
  renderArticles();
}
function renderArticles(){
  if(!filteredArticles.length){
    articleList.innerHTML=
      '<div class="state">'+
        '<div class="empty-icon"><svg><use href="#i-search"></use></svg></div>'+
        '<strong>موردی پیدا نشد</strong>'+
      '</div>';
    resultCount.textContent="۰ مطلب";
    return;
  }
  resultCount.textContent=filteredArticles.length+" مطلب";
  articleList.innerHTML=filteredArticles.map(renderArticleCard).join("");
}
function renderArticleCard(a){
  const id=getArticleId(a);
  const bm=!!bookmarks[id];
  const isLecture = a.category==="lecture";
  const displayTitle = isLecture && a.speaker ? "سخنرانی "+a.speaker : a.title;
  const showExcerpt = !isLecture;
  const metaBits=[];
  if(!isLecture) metaBits.push('<span class="meta">'+iconUse(a.icon)+escapeHTML(a.categoryTitle)+'</span>');
  if(a.audioUrl) metaBits.push('<span class="meta"><svg><use href="#i-music"></use></svg>صوتی</span>');
  if(a.videoUrl) metaBits.push('<span class="meta"><svg><use href="#i-video"></use></svg>ویدیو</span>');
  if(a.speaker && !isLecture) metaBits.push('<span class="meta"><svg><use href="#i-chat"></use></svg>'+escapeHTML(a.speaker)+'</span>');
  return `
    <article class="article" data-open="${escapeHTML(id)}" role="button" tabindex="0">
      <div class="article-top">
        <div class="article-icon">${iconUse(a.icon)}</div>
        <div class="article-main">
          <h2 class="article-title">${escapeHTML(displayTitle)}</h2>
          ${showExcerpt ? '<p class="article-excerpt">'+escapeHTML(a.excerpt||a.translationFa||a.content||a.categoryTitle)+'</p>' : ''}
        </div>
        <button class="article-bookmark ${bm?"active":""}" data-bookmark="${escapeHTML(id)}" type="button">
          <svg><use href="#i-bookmark"></use></svg>
        </button>
      </div>
      <div class="article-meta">${metaBits.join("")}</div>
      <div class="article-footer">
        ${a.audioUrl?'<span class="has-audio"><svg><use href="#i-music"></use></svg>پخش صوتی</span>':'<span></span>'}
        <span class="open-btn">مشاهده<svg><use href="#i-arrow-right"></use></svg></span>
      </div>
    </article>`;
}

/* OPEN */
function findArticle(id){ return allArticles.find(a=>getArticleId(a)===String(id)); }

function openArticle(a){
  if(!a) return;
  stopAudio();
  currentArticle=a;
  currentTab=getInitialTab(a);
  const displayTitle = a.category==="lecture"&&a.speaker ? "سخنرانی "+a.speaker : a.title;

  updateModalBookmark();
  renderMedia(a); renderTabs(a); renderContent(a);
  lastFocusedElement=document.activeElement;
  modal.classList.add("show");
  document.body.style.overflow="hidden";
  modalScroll.scrollTop=0;
  setTimeout(()=>{const c=$("closeModal");if(c)c.focus()},200);

function getInitialTab(a){
  if(a.contentAr) return "main";
  if(a.translationFa) return "translation";
  if(a.instructions) return "instructions";
  if(a.virtue) return "virtue";

/* MEDIA */
function renderMedia(a){
  mediaArea.innerHTML="";
  if(a.audioUrl) mediaArea.appendChild(buildAudioPlayer(a));
  if(a.videoUrl) mediaArea.appendChild(buildVideoPlayer(a));
}
function buildVideoPlayer(a){
  const box=document.createElement("div");
  box.className="video-box";
  const ytId=getYouTubeId(a.videoUrl);
  if(ytId){
    const f=document.createElement("iframe");
    f.src="https://www.youtube.com/embed/"+encodeURIComponent(ytId)+"?rel=0&modestbranding=1&playsinline=1";
    f.title=a.title;
    f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    f.allowFullscreen=true; f.loading="lazy";
    box.appendChild(f);
  }else{
    const v=document.createElement("video");
    v.controls=true; v.preload="metadata"; v.playsInline=true;
    v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline",""); v.setAttribute("x5-playsinline","");
    v.src=a.videoUrl;
    box.appendChild(v);
    const fsBtn=document.createElement("button");
    fsBtn.className="video-fullscreen-btn"; fsBtn.type="button";
    fsBtn.setAttribute("aria-label","نمایش تمام صفحه");
    fsBtn.innerHTML='<svg><use href="#i-fullscreen"></use></svg>';
    fsBtn.addEventListener("click",function(e){
      e.stopPropagation();
      try{
        const req = v.requestFullscreen || v.webkitRequestFullscreen || v.webkitEnterFullscreen;
        if(req){
          const p = req.call(v);
          if(p && p.then){
            p.then(()=>{try{screen.orientation?.lock?.("landscape")?.catch?.(()=>{})}catch(x){}}).catch(()=>{});
          }
        }else showToast("تمام‌صفحه پشتیبانی نمی‌شود");
      }catch(x){ showToast("تمام‌صفحه پشتیبانی نمی‌شود"); }
    });
    box.appendChild(fsBtn);
  }
  if(a.speaker){
    const c=document.createElement("div");
    c.className="video-caption";
    c.textContent=a.speaker;
    box.appendChild(c);
  }
  return box;
}

/* AUDIO PLAYER */
function buildAudioPlayer(a){
  const w=document.createElement("section");
  w.className="player";
  w.innerHTML=`
    <div class="player-top">
      <div class="cover"><svg><use href="#i-music"></use></svg></div>
      <div class="player-info">
        <div class="player-label"><i></i><span class="status-text">آماده پخش</span></div>
        <div class="player-title">${escapeHTML(a.category==="lecture"&&a.speaker?"سخنرانی "+a.speaker:a.title)}</div>
        <div class="player-speaker">${escapeHTML(a.speaker||"پخش صوتی بانوان نور")}</div>
      </div>
      <div class="equalizer"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="progress-area">
      <div class="progress-track">
        <div class="progress-line">
          <div class="progress-fill"></div>
          <div class="progress-thumb"></div>
        </div>
      </div>
      <div class="time-row"><span class="current-time">00:00</span><span class="total-time">00:00</span></div>
    </div>
    <div class="player-controls">
      <button class="ctrl skip-back" type="button" aria-label="۱۵ ثانیه عقب"><svg><use href="#i-back15"></use></svg></button>
      <button class="ctrl play-btn" type="button" aria-label="پخش"><svg><use href="#i-play"></use></svg></button>
      <button class="ctrl skip-forward" type="button" aria-label="۱۵ ثانیه جلو"><svg><use href="#i-forward15"></use></svg></button>
    </div>
    <div class="player-tools">
      <button class="tool speed-btn" type="button"><svg><use href="#i-speed"></use></svg><span>سرعت ${playbackSpeed}×</span></button>
      <button class="tool loop-btn" type="button"><svg><use href="#i-repeat"></use></svg><span>تکرار</span></button>
      <button class="tool mute-btn" type="button"><svg><use href="#i-volume"></use></svg><span>صدا</span></button>
    </div>
    <div class="volume-row">
      <svg class="volume-icon"><use href="#i-volume"></use></svg>
      <input class="volume-slider" type="range" min="0" max="1" step="0.01" value="${volumeValue}">
    </div>
    <div class="audio-message"></div>
  `;
  const audio=new Audio();
  audio.preload="metadata"; audio.src=a.audioUrl;
  audio.volume=volumeValue; audio.playbackRate=playbackSpeed; audio.loop=loopEnabled;
  audioEl=audio;

  const playBtn=w.querySelector(".play-btn");
  const track=w.querySelector(".progress-track");
  const fill=w.querySelector(".progress-fill");
  const thumb=w.querySelector(".progress-thumb");
  const cur=w.querySelector(".current-time");
  const tot=w.querySelector(".total-time");
  const status=w.querySelector(".status-text");
  const speedBtn=w.querySelector(".speed-btn");
  const loopBtn=w.querySelector(".loop-btn");
  const muteBtn=w.querySelector(".mute-btn");
  const slider=w.querySelector(".volume-slider");
  const vIcon=w.querySelector(".volume-icon");
  const msgEl=w.querySelector(".audio-message");
  let restored=false;
  let isBusy=false;

  const updProg=()=>{
    if(!isFinite(audio.duration)||audio.duration<=0)return;
    const p=Math.min(100,Math.max(0,(audio.currentTime/audio.duration)*100));
    fill.style.width=p+"%"; thumb.style.left=p+"%";
    cur.textContent=formatTime(audio.currentTime);
    tot.textContent=formatTime(audio.duration);
  };
  const updPlay=()=>{
    playBtn.innerHTML=audio.paused?'<svg><use href="#i-play"></use></svg>':'<svg><use href="#i-pause"></use></svg>';
    w.classList.toggle("playing",!audio.paused);
    status.textContent=audio.paused?"متوقف":"در حال پخش";
  };
  const updLoop=()=>{
    loopBtn.classList.toggle("active",loopEnabled);
    loopBtn.querySelector("span").textContent=loopEnabled?"تکرار روشن":"تکرار";
    audio.loop=loopEnabled;
  };
  const updMute=()=>{
    const m=audio.muted||audio.volume===0;
    muteBtn.classList.toggle("active",m);
    muteBtn.innerHTML=m?'<svg><use href="#i-volume-off"></use></svg><span>بی‌صدا</span>':'<svg><use href="#i-volume"></use></svg><span>صدا</span>';
    vIcon.innerHTML=m?'<use href="#i-volume-off"></use>':'<use href="#i-volume"></use>';
  };
  const showErr=m=>{msgEl.textContent=m||"پخش ممکن نشد.";msgEl.classList.add("show")};
  const restore=()=>{
    if(restored) return; restored=true;
    const id=getArticleId(a); const s=Number(positions[id]||0);
    if(s>5&&isFinite(audio.duration)&&s<audio.duration-2){ audio.currentTime=s; showToast("ادامه از "+formatTime(s)); }
    updProg();
  };
  const savePos=()=>{
    const id=getArticleId(a);
    if(isFinite(audio.currentTime)&&audio.currentTime>0){ positions[id]=Math.floor(audio.currentTime); saveObject(POSITION_KEY,positions); }
  };

  /* ═══════════════════════════════════════════════════════
     ✅ دکمه پخش اصلاح‌شده با مدیریت کامل cancel و خطا
     ═══════════════════════════════════════════════════════ */
  playBtn.addEventListener("click", async () => {
    // اگر در حال پخش است، متوقف کن
    if (!audio.paused) {
      audio.pause();
      return;
    }

    // اگر قبلاً تأیید شده و در کش است، مستقیم پخش کن
    if (audio._bnReady) {
      try { await audio.play(); } catch(e) { showErr("خطا در پخش"); }
      return;
    }

    // اگر Media Player موجود نیست، مستقیم پخش کن (fallback)
    if (!window.bnMedia || typeof window.bnMedia.play !== "function") {
      try { await audio.play(); } catch(e) { showErr("فایل صوتی در دسترس نیست"); }
      return;
    }

    // جلوگیری از کلیک تکراری
    if (isBusy) return;
    isBusy = true;
    status.textContent = "در حال آماده‌سازی...";
    let blobUrl = null;

    try {
      // فراخوانی Media Player
      const result = await window.bnMedia.play(a.audioUrl, {
        onPlay: (res) => {
          // اگر فایل تازه دانلود شده و blob داریم، از blob استفاده کن
          if (res && res.blob) {
            try {
              blobUrl = URL.createObjectURL(res.blob);
              audio.src = blobUrl;
              audio.load();
            } catch(e) { console.warn("Blob error:", e); }
          }
          audio._bnReady = true;
          status.textContent = res && res.offline ? "آماده (آفلاین)" : "آماده";
        },
        onError: (err) => {
          const msg = (err && err.message) ? err.message : "فایل در دسترس نیست";
          showErr("خطا: " + msg);
          status.textContent = "خطا";
        }
      });

      // ✅ مدیریت نتیجه: لغو شده توسط کاربر
      if (result && result.cancelled) {
        status.textContent = "لغو شد";
        setTimeout(() => { status.textContent = "آماده پخش"; }, 2000);
        return;
      }

      // ✅ اگر خطا داشتیم، onError خودش نمایش داده
      if (result && result.error) {
        return;
      }

      // ✅ حالا پخش کن
      try {
        await audio.play();
      } catch(e) {
        // اگر blob url خراب بود، به url اصلی برگرد
        if (blobUrl) {
          try {
            audio.src = a.audioUrl;
            audio.load();
            await audio.play();
          } catch(e2) {
            showErr("خطا در پخش فایل");
            status.textContent = "خطا";
          }
        } else {
          showErr("خطا در پخش فایل");
          status.textContent = "خطا";
        }
      }
    } catch(e) {
      showErr("خطا: " + (e.message || "عملیات ناموفق"));
      status.textContent = "خطا";
    } finally {
      isBusy = false;
    }
  });

  w.querySelector(".skip-back").addEventListener("click",()=>{audio.currentTime=Math.max(0,audio.currentTime-15);updProg()});
  w.querySelector(".skip-forward").addEventListener("click",()=>{
    audio.currentTime=isFinite(audio.duration)?Math.min(audio.duration,audio.currentTime+15):audio.currentTime+15;
    updProg();
  });
  speedBtn.addEventListener("click",()=>{
    const sp=[.5,.75,1,1.25,1.5,1.75,2];
    let i=sp.indexOf(playbackSpeed); i=(i+1)%sp.length;
    playbackSpeed=sp[i]; audio.playbackRate=playbackSpeed;
    localStorage.setItem(SPEED_KEY,String(playbackSpeed));
    speedBtn.querySelector("span").textContent="سرعت "+playbackSpeed+"×";
    showToast("سرعت: "+playbackSpeed+"×");
  });
  loopBtn.addEventListener("click",()=>{
    loopEnabled=!loopEnabled;
    localStorage.setItem(LOOP_KEY,loopEnabled?"1":"0");
    updLoop();
  });
  muteBtn.addEventListener("click",()=>{
    if(audio.muted||audio.volume===0){
      audio.muted=false; if(volumeValue===0) volumeValue=.7;
      audio.volume=volumeValue; slider.value=volumeValue;
    }else audio.muted=true;
    updMute();
  });
  slider.addEventListener("input",function(){
    volumeValue=Math.min(1,Math.max(0,Number(this.value)));
    audio.volume=volumeValue; audio.muted=false;
    localStorage.setItem(VOLUME_KEY,String(volumeValue));
    updMute();
  });

  let seeking=false;
  const seek=e=>{
    const r=track.getBoundingClientRect();
    let ratio=(e.clientX-r.left)/r.width;
    ratio=Math.max(0,Math.min(1,ratio));
    if(isFinite(audio.duration)){audio.currentTime=ratio*audio.duration;updProg()}
  };
  track.addEventListener("pointerdown",e=>{e.preventDefault();seeking=true;try{track.setPointerCapture(e.pointerId)}catch(x){};seek(e)});
  track.addEventListener("pointermove",e=>{if(seeking)seek(e)});
  track.addEventListener("pointerup",()=>seeking=false);
  track.addEventListener("pointercancel",()=>seeking=false);

  audio.addEventListener("loadedmetadata",()=>{restore();updProg()});
  audio.addEventListener("durationchange",updProg);
  audio.addEventListener("timeupdate",()=>{
    updProg();
    const s=Math.floor(audio.currentTime);
    if(s%5===0&&s!==audio._last){audio._last=s;savePos()}
  });
  audio.addEventListener("play",updPlay);
  audio.addEventListener("playing",()=>{msgEl.classList.remove("show");updPlay()});
  audio.addEventListener("pause",()=>{savePos();updPlay()});
  audio.addEventListener("ended",()=>{savePos();updPlay();updProg()});
  audio.addEventListener("waiting",()=>{status.textContent="در حال بارگذاری..."});
  audio.addEventListener("canplay",()=>{msgEl.classList.remove("show");if(!restored)restore()});
  audio.addEventListener("error",()=>{showErr("فایل صوتی پیدا نشد یا قابل پخش نیست");status.textContent="خطا"});

  updLoop(); updMute(); updPlay();

  audioCleanup=()=>{
    try{savePos()}catch(e){}
    try{audio.pause();audio.removeAttribute("src");audio.load()}catch(e){}
  };
  return w;
}
function stopAudio(){ if(audioCleanup){try{audioCleanup()}catch(e){}} audioCleanup=null; audioEl=null; }

/* TABS */
function renderTabs(a){
  const tabs=[];
  if(a.contentAr||a.content) tabs.push({id:"main",title:"متن اصلی"});
  if(a.translationFa) tabs.push({id:"translation",title:"ترجمه"});
  if(a.instructions) tabs.push({id:"instructions",title:"دستور"});
  if(a.virtue) tabs.push({id:"virtue",title:"فضیلت"});
  if(!tabs.length){tabsArea.innerHTML="";return}
  if(!tabs.some(t=>t.id===currentTab)) currentTab=tabs[0].id;
  tabsArea.innerHTML='<div class="tabs">'+tabs.map(t=>
    '<button class="tab '+(t.id===currentTab?"active":"")+'" data-tab="'+t.id+'" type="button">'+t.title+'</button>'
  ).join("")+'</div>';
}
function renderContent(a){
  let html="";
  if(currentTab==="main") html='<div class="content-panel">'+formatMainText(a.contentAr||a.content,!!a.contentAr)+'</div>';
  else if(currentTab==="translation") html='<div class="content-panel"><div class="translation-text">'+formatPlainText(a.translationFa)+'</div></div>';
  else if(currentTab==="instructions") html='<div class="content-panel">'+formatInstructions(a.instructions)+'</div>';
  else if(currentTab==="virtue") html='<div class="content-panel"><div class="virtue-box">'+formatPlainText(a.virtue)+'</div></div>';
  if(a.source) html+='<div class="source-box"><strong>منبع:</strong> '+escapeHTML(a.source)+'</div>';
  if(a.tags&&a.tags.length) html+='<div class="tags">'+a.tags.map(t=>'<span class="tag">'+escapeHTML(t)+'</span>').join("")+'</div>';
  contentArea.innerHTML=html;
}
function formatPlainText(t){
  return escapeHTML(t||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").replace(/\n{3,}/g,"\n\n").replace(/\n/g,"<br>");
}
function formatMainText(text,isAr){
  if(!text) return '<div class="normal-text">متنی برای نمایش وجود ندارد.</div>';
  const esc=escapeHTML(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const lines=esc.split("\n");
  if(!isAr) return '<div class="normal-text">'+esc.replace(/\n/g,"<br>")+'</div>';
  let out="";
  lines.forEach(l=>{
    const t=l.trim();
    if(!t){out+="<br>";return}
    if(/^\[(.+)\]$/.test(t)){out+='<div style="font-weight:900;color:var(--primary);margin:10px 0 4px">'+t.replace(/^\[|\]$/g,"")+'</div>';return}
    if(/^(بسم الله|بِسْمِ اللَّه|اللهم|السلام عليكم)/.test(t)){out+='<div style="font-weight:900;color:var(--primary);margin-bottom:6px">'+t+'</div>';return}
    out+='<div class="arabic-text">'+t+'</div>';
  });
  return out;
}
function formatInstructions(v){
  if(Array.isArray(v)) return '<ol class="instruction-list">'+v.map(i=>'<li>'+formatPlainText(i)+'</li>').join("")+'</ol>';
  const parts=String(v||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1) return '<ol class="instruction-list">'+parts.map(i=>'<li>'+formatPlainText(i)+'</li>').join("")+'</ol>';
  return '<div class="normal-text">'+formatPlainText(v)+'</div>';
}

/* BOOKMARK */
function isBookmarked(a){return !!bookmarks[getArticleId(a)]}
function toggleBookmark(a){
  if(!a) return;
  const id=getArticleId(a);
  if(bookmarks[id]){delete bookmarks[id];showToast("از نشان‌شده‌ها حذف شد")}
  else{bookmarks[id]=true;showToast("به نشان‌شده‌ها اضافه شد")}
  saveObject(BM_KEY,bookmarks);
  updateModalBookmark();
  renderArticles();
  if (window.bnAnalytics) window.bnAnalytics.track("duas_bookmark", { id: id });
}
function updateModalBookmark(){
  if(!currentArticle) return;
  const active=isBookmarked(currentArticle);
  modalBookmark.classList.toggle("active",active);
  $("actionBookmark").classList.toggle("active",active);
}

/* COPY / SHARE / SPEAK */
function getCopyText(a){return [a.title,a.contentAr,a.translationFa,a.content,a.instructions,a.virtue,a.source].filter(Boolean).join("\n\n")}
async function copyArticle(){
  if(!currentArticle) return;
  const text=getCopyText(currentArticle);
  try{await navigator.clipboard.writeText(text);showToast("متن کپی شد")}
  catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");showToast("متن کپی شد")}catch(x){showToast("کپی نشد")}
    ta.remove();
  }
}
async function shareArticle(){
  if(!currentArticle) return;
  const text=getCopyText(currentArticle);
  try{
    if(navigator.share) await navigator.share({title:currentArticle.title,text});
    else{await navigator.clipboard.writeText(text);showToast("متن کپی شد")}
  }catch(e){}
}
function speakArticle(){
  if(!currentArticle) return;
  if(!("speechSynthesis" in window)){showToast("پشتیبانی نمی‌شود");return}
  const btn=$("speakBtn");
  if(speechActive){speechSynthesis.cancel();speechActive=false;btn.innerHTML='<svg><use href="#i-speak"></use></svg>خواندن';showToast("متوقف شد");return}
  const text=currentArticle.translationFa||currentArticle.content||currentArticle.contentAr||"";
  if(!text){showToast("متنی وجود ندارد");return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang="fa-IR"; u.rate=.9; u.pitch=1;
  u.onstart=()=>{speechActive=true;btn.innerHTML='<svg><use href="#i-pause"></use></svg>توقف'};
  u.onend=u.onerror=()=>{speechActive=false;btn.innerHTML='<svg><use href="#i-speak"></use></svg>خواندن'};
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* CLOSE MODAL */
function closeModal(){
  stopAudio();
  if("speechSynthesis" in window) speechSynthesis.cancel();
  speechActive=false;
  $("speakBtn").innerHTML='<svg><use href="#i-speak"></use></svg>خواندن';
  modal.classList.remove("show");
  document.body.style.overflow="";
  currentArticle=null;
  mediaArea.innerHTML=""; tabsArea.innerHTML=""; contentArea.innerHTML="";
  if(lastFocusedElement&&lastFocusedElement.focus){try{lastFocusedElement.focus()}catch(e){}}
}

/* EVENTS */
catGrid.addEventListener("click",e=>{
  const c=e.target.closest("[data-cat]");
  if(c) openCategory(c.dataset.cat);
});
articleList.addEventListener("click",e=>{
  const bm=e.target.closest("[data-bookmark]");
  if(bm){e.stopPropagation();toggleBookmark(findArticle(bm.dataset.bookmark));return}
  const card=e.target.closest("[data-open]");
  if(card) openArticle(findArticle(card.dataset.open));
});
articleList.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const card=e.target.closest("[data-open]");
  if(card){e.preventDefault();openArticle(findArticle(card.dataset.open))}
});
$("backCatBtn").addEventListener("click",backToCategories);
$("backBtn").addEventListener("click",()=>{
  if(modal.classList.contains("show")){ closeModal(); return; }
  if(currentView==="list"){ backToCategories(); return; }
  if(document.referrer && document.referrer.indexOf(location.origin)===0){
    history.back();
  } else { location.href="home.html"; }
});
$("bookmarkFilter").addEventListener("click",function(){
  showBookmarks=!showBookmarks;
  this.classList.toggle("active",showBookmarks);
  applyFilters();
});
searchInput.addEventListener("input",()=>{
  if(searchInput.value.trim()&&currentView==="categories"){
    currentView="list"; currentCategory=null;
    categoriesView.classList.add("hidden");
    listView.classList.remove("hidden");
    pageTitle.textContent="نتایج جستجو";
    listTitle.innerHTML='<svg><use href="#i-search"></use></svg><span>نتایج جستجو</span>';
  }else if(!searchInput.value.trim()&&currentView==="list"&&!currentCategory){
    backToCategories(); return;
  }
  applyFilters();
});
$("topSearchBtn").addEventListener("click",()=>{searchInput.focus();window.scrollTo({top:0,behavior:"smooth"})});
$("navSearch").addEventListener("click",()=>{searchInput.focus();window.scrollTo({top:0,behavior:"smooth"})});
$("navHome").addEventListener("click",()=>{location.href="home.html"});
$("navHamraz").addEventListener("click",()=>{location.href="hamraz.html"});
$("navAhkam").addEventListener("click",()=>{location.href="ahkam.html"});
$("navMore").addEventListener("click",()=>{location.href="settings.html"});
$("dailyCard").addEventListener("click",()=>{
  if(allArticles.length){
    const day=Math.floor(Date.now()/86400000);
    const idx=Math.abs(day)%allArticles.length;
    openArticle(allArticles[idx]);
  }
});
$("closeModal").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
modalBookmark.addEventListener("click",()=>toggleBookmark(currentArticle));
$("actionBookmark").addEventListener("click",()=>toggleBookmark(currentArticle));
$("copyBtn").addEventListener("click",copyArticle);
$("shareBtn").addEventListener("click",shareArticle);
$("speakBtn").addEventListener("click",speakArticle);
tabsArea.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(!tab||!currentArticle) return;
  currentTab=tab.dataset.tab;
  renderTabs(currentArticle);renderContent(currentArticle);
  modalScroll.scrollTo({top:0,behavior:"smooth"});
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modal.classList.contains("show")) closeModal();
});
modal.addEventListener("keydown",e=>{
  if(e.key!=="Tab") return;
  const f=modal.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
window.addEventListener("storage",e=>{
  if(e.key===THEME_KEY) applyTheme();
  if(e.key==="bn_lang") location.reload();
});
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",loadAllData);
else loadAllData();
