<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="جستجو در بانوان نور — احکام، سلامت، دعاها و آموزش‌ها">
<title>جستجو | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">

<script>
(function(){
  try{
    var t = localStorage.getItem('bn_theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#fdf5ff;
  --bg-soft:#f6e9ff;
  --surface:rgba(255,255,255,.80);
  --surface-solid:#ffffff;
  --text:#2a1740;
  --text-soft:#5f4a77;
  --text-muted:#9686a8;

  --primary:#a832d6;
  --primary-2:#c026d3;
  --pink:#ec4899;

  --border:rgba(168,50,214,.14);
  --shadow-sm:0 6px 20px rgba(168,50,214,.08);
  --shadow-md:0 14px 34px rgba(168,50,214,.15);
  --shadow-fab:0 14px 36px rgba(219,39,119,.50);

  --nav-bg:rgba(255,255,255,.68);

  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.13),rgba(168,85,247,.10));

  --ig-grad:var(--brand-grad);
  --ig-grad-anim:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --gradient-soft:var(--brand-grad-soft);

  --highlight-bg:rgba(251,191,36,.35);
  --highlight-text:#7c2d12;
}

html[data-theme="dark"],
body.dark{
  --bg:#000000;
  --bg-soft:#000000;
  --surface:rgba(28,28,30,.70);
  --surface-solid:#1c1c1e;
  --text:#ffffff;
  --text-soft:#e4e6eb;
  --text-muted:#8e8e93;
  --primary:#c084fc;
  --primary-2:#d8b4fe;
  --pink:#ec4899;
  --border:rgba(192,132,252,.16);
  --shadow-sm:0 6px 20px rgba(0,0,0,.45);
  --shadow-md:0 14px 34px rgba(0,0,0,.55);
  --shadow-fab:0 14px 36px rgba(219,39,119,.55);
  --nav-bg:rgba(15,10,22,.68);

  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.18),rgba(168,85,247,.14));
  --ig-grad:var(--brand-grad);
  --ig-grad-anim:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --gradient-soft:var(--brand-grad-soft);

  --highlight-bg:rgba(219,39,119,.35);
  --highlight-text:#ffffff;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}

body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;
  direction:rtl;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 0%,rgba(236,72,153,.15),transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(168,85,247,.17),transparent 32%),
    linear-gradient(160deg,var(--bg),var(--bg-soft));
  min-height:100vh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}

html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}

/* ✅ پشتیبانی از LTR */
body.lang-ltr { direction: ltr; }
body.lang-ltr .back-btn svg { transform: none; }
body.lang-ltr .search-input { padding: 15px 52px 15px 48px; }
body.lang-ltr .search-icon { left: auto; right: 16px; }
body.lang-ltr .clear-btn { right: auto; left: 14px; }
body.lang-ltr .result-card::before { right: auto; left: 0; border-radius: 18px 0 0 18px; }

.app{
  width:100%;max-width:640px;margin:0 auto;
  padding:0 16px;position:relative;z-index:2;
}

/* HEADER */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:18px 0 14px;
  position:sticky;top:0;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
  z-index:50;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{
  background:linear-gradient(to bottom,#000 70%,transparent);
}

.back-btn{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;flex:0 0 42px;
  transition:transform .2s;
}
.back-btn:active{transform:scale(.9)}
.back-btn svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);
}

.page-title{
  flex:1;font-size:1.05rem;font-weight:900;
  color:var(--text);
}

.count-badge{
  font-size:.62rem;
  color:var(--primary);
  font-weight:800;
  padding:5px 10px;
  border-radius:20px;
  background:var(--gradient-soft);
  border:1px solid var(--border);
  white-space:nowrap;
}

/* SEARCH BAR */
.search-wrap{
  position:relative;margin-bottom:14px;
}
.search-input{
  width:100%;
  padding:15px 48px 15px 52px;
  border-radius:18px;
  border:1.5px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:inherit;
  font-size:.92rem;
  font-weight:650;
  outline:none;
  transition:border-color .25s,box-shadow .25s;
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.search-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px var(--gradient-soft);
}
.search-input::placeholder{color:var(--text-muted);font-weight:600}

.search-icon{
  position:absolute;
  left:16px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  fill:none;stroke:var(--text-muted);
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none;
  transition:stroke .25s;
}
.search-input:focus + .search-icon{stroke:var(--primary)}

.clear-btn{
  position:absolute;
  right:14px;top:50%;
  transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-muted);
  display:none;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
  transition:transform .2s;
}
.clear-btn.show{display:flex}
.clear-btn:active{transform:translateY(-50%) scale(.85)}
.clear-btn svg{
  width:14px;height:14px;fill:none;stroke:currentColor;
  stroke-width:2.6;stroke-linecap:round;
}

/* FILTERS */
.filters{
  display:flex;gap:7px;
  overflow-x:auto;
  padding-bottom:14px;
  margin-bottom:8px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.filters::-webkit-scrollbar{display:none}

.filter-chip{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-soft);
  font-family:inherit;
  font-size:.72rem;
  font-weight:800;
  cursor:pointer;
  transition:all .25s;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.filter-chip svg{
  width:14px;height:14px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.filter-chip:active{transform:scale(.94)}
.filter-chip.active{
  background:var(--ig-grad);
  color:#fff;
  border-color:transparent;
  box-shadow:0 6px 18px rgba(219,39,119,.35);
}
.filter-chip.active svg{stroke:#fff}

/* RESULT STATS */
.result-stats{
  font-size:.72rem;
  color:var(--text-muted);
  font-weight:800;
  padding:6px 4px 14px;
  display:none;
}
.result-stats.show{display:block}
.result-stats b{color:var(--primary);font-weight:900}

/* RESULTS */
.results{
  display:flex;flex-direction:column;gap:10px;
}

.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px 14px 13px;
  cursor:pointer;
  transition:transform .2s,border-color .2s;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.result-card::before{
  content:"";
  position:absolute;
  top:0;right:0;
  width:4px;height:100%;
  background:var(--result-color,#8b5cf6);
  border-radius:0 18px 18px 0;
  opacity:.7;
}
.result-card:active{transform:scale(.985)}
.result-card:hover{border-color:var(--primary)}

.result-head{
  display:flex;align-items:center;gap:9px;
  margin-bottom:8px;
}
.result-icon{
  width:34px;height:34px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 34px;
}
.result-icon svg{
  width:17px;height:17px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.result-cat{
  font-size:.62rem;
  color:var(--text-muted);
  font-weight:800;
  padding:3px 9px;
  border-radius:20px;
  background:var(--gradient-soft);
  border:1px solid var(--border);
}
.result-title{
  font-size:.86rem;
  font-weight:850;
  color:var(--text);
  line-height:1.65;
  margin-bottom:5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.result-snippet{
  font-size:.72rem;
  color:var(--text-soft);
  line-height:1.85;
  font-weight:600;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.result-snippet mark{
  background:var(--highlight-bg);
  color:var(--highlight-text);
  padding:0 3px;
  border-radius:3px;
  font-weight:800;
}
.result-title mark{
  background:var(--highlight-bg);
  color:var(--highlight-text);
  padding:1px 3px;
  border-radius:3px;
  font-weight:900;
}

/* EMPTY / LOADING */
.empty-state{
  text-align:center;
  padding:50px 20px;
  display:none;
}
.empty-state.show{display:block}
.empty-state svg{
  width:80px;height:80px;
  fill:none;stroke:var(--text-muted);
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  margin-bottom:18px;
  opacity:.4;
}
.empty-title{
  font-size:1rem;
  font-weight:900;
  color:var(--text);
  margin-bottom:8px;
}
.empty-text{
  font-size:.78rem;
  color:var(--text-muted);
  line-height:1.9;
  font-weight:650;
  max-width:300px;
  margin:0 auto;
}

.loading-state{
  text-align:center;
  padding:50px 20px;
  display:none;
}
.loading-state.show{display:block}

.spinner{
  width:44px;height:44px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  margin:0 auto 18px;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-text{
  font-size:.82rem;
  color:var(--text-muted);
  font-weight:700;
}

/* SUGGESTIONS */
.suggestions{
  padding:10px 4px 20px;
}
.suggestions-title{
  font-size:.75rem;
  color:var(--text-muted);
  font-weight:800;
  margin-bottom:12px;
  display:flex;align-items:center;gap:6px;
}
.suggestions-title svg{
  width:14px;height:14px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.suggestion-chips{
  display:flex;flex-wrap:wrap;gap:7px;
}
.suggestion-chip{
  padding:8px 14px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-soft);
  font-family:inherit;
  font-size:.72rem;
  font-weight:800;
  cursor:pointer;
  transition:all .25s;
  -webkit-tap-highlight-color:transparent;
}
.suggestion-chip:active{transform:scale(.94)}
.suggestion-chip:hover{
  border-color:var(--primary);
  color:var(--primary);
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;left:50%;bottom:0;
  transform:translateX(-50%);
  width:100%;max-width:640px;z-index:1000;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:1fr 1fr 78px 1fr 1fr;
  gap:4px;align-items:center;
  background:var(--nav-bg);
  border-top:1px solid rgba(255,255,255,.18);
  border-radius:26px 26px 0 0;
  box-shadow:
    0 -10px 28px rgba(225,29,72,.14),
    0 -24px 55px rgba(168,85,247,.10),
    inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(55px) saturate(220%);
  -webkit-backdrop-filter:blur(55px) saturate(220%);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:
    0 -10px 28px rgba(0,0,0,.55),
    0 -24px 55px rgba(219,39,119,.14);
}

.nav-item{
  min-height:56px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;position:relative;
  color:var(--text-muted);text-decoration:none;
  border-radius:14px;font-size:.56rem;font-weight:850;
  transition:color .2s ease,background .2s ease;
  padding:6px 2px;
}
.nav-item svg{
  width:21px;height:21px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .2s ease;
}
.nav-item.active{color:var(--primary);background:var(--gradient-soft)}
.nav-item.active svg{stroke-width:2.3}
.nav-item.active::before{
  content:"";position:absolute;top:-2px;left:50%;
  transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 5px 5px;
  background:var(--brand-grad);
}

.nav-fab-wrap{
  position:relative;
  height:100%;
  display:flex;align-items:center;justify-content:center;
}

.nav-fab{
  position:absolute;
  top:-30px;
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-grad);
  box-shadow:
    0 14px 32px rgba(225,29,72,.48),
    0 6px 16px rgba(168,85,247,.35);
  cursor:pointer;text-decoration:none;
  border:4px solid var(--surface-solid);
  transition:transform .25s ease,box-shadow .25s ease;
  z-index:10;
}
.nav-fab:active{transform:scale(.92)}
.nav-fab::before{
  content:"";position:absolute;
  width:100%;height:100%;border-radius:50%;
  background:var(--brand-grad);
  z-index:-1;
  animation:fabRipple 3s ease infinite;
  opacity:.45;
}
@keyframes fabRipple{
  0%{transform:scale(1);opacity:.45}
  100%{transform:scale(1.35);opacity:0}
}
.nav-fab svg{
  width:26px;height:26px;fill:none;stroke:#fff;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;
}

.nav-fab-label{
  position:absolute;
  bottom:6px;left:50%;
  transform:translateX(-50%);
  font-size:.56rem;
  font-weight:900;
  color:var(--primary);
  white-space:nowrap;
}

/* MODAL */
.detail-modal{
  position:fixed;inset:0;z-index:5000;
  display:none;align-items:flex-end;justify-content:center;
  padding:15px;
  background:rgba(15,8,20,.62);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.detail-modal.show{display:flex;animation:modalFade .25s ease}
@keyframes modalFade{from{opacity:0}to{opacity:1}}

.detail-box{
  width:100%;max-width:560px;max-height:88vh;
  overflow-y:auto;padding:20px;
  border-radius:27px 27px 21px 21px;
  background:var(--surface-solid);
  border:1px solid var(--border);
  box-shadow:0 -10px 50px rgba(219,39,119,.28);
  animation:modalUp .3s ease;
  -webkit-overflow-scrolling:touch;
}
@keyframes modalUp{
  from{transform:translateY(35px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modal-handle{
  width:42px;height:4px;border-radius:10px;
  margin:0 auto 17px;
  background:var(--text-muted);opacity:.25;
}

.detail-head{
  display:flex;align-items:center;gap:11px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border);
  margin-bottom:4px;
}
.detail-icon{
  width:47px;height:47px;flex:0 0 47px;
  border-radius:15px;
  display:flex;align-items:center;justify-content:center;
}
.detail-icon svg{
  width:24px;height:24px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.detail-title-wrap{flex:1;min-width:0}
.detail-cat{
  font-size:.62rem;
  color:var(--text-muted);
  font-weight:800;
  margin-bottom:2px;
}
.detail-title{
  font-size:1rem;
  font-weight:950;
  color:var(--text);
  line-height:1.6;
}
.detail-close{
  width:37px;height:37px;border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 37px;
}
.detail-close:active{transform:scale(.9)}
.detail-close svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2.4;stroke-linecap:round;
}
.detail-text{
  padding:17px 3px 13px;
  color:var(--text);
  font-size:.88rem;
  line-height:2.2;
  font-weight:650;
  white-space:pre-line;
}
.detail-source{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:20px;
  background:var(--gradient-soft);
  border:1px solid var(--border);
  color:var(--text-muted);
  font-size:.62rem;font-weight:800;
}
.detail-source svg{
  width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;
}
.detail-actions{
  display:flex;gap:7px;
  margin-top:17px;padding-top:13px;
  border-top:1px dashed var(--border);
}
.act-btn{
  width:39px;height:39px;border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:.2s;
}
.act-btn:active{transform:scale(.9)}
.act-btn svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.act-btn.speaking{
  color:var(--primary);
  background:var(--gradient-soft);
  animation:pulse .9s infinite;
}
@keyframes pulse{50%{opacity:.5}}

/* TOAST */
.toast{
  position:fixed;left:50%;
  bottom:calc(108px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;pointer-events:none;z-index:7000;
  max-width:90%;padding:11px 20px;border-radius:30px;
  background:rgba(33,20,46,.94);color:#fff;
  font-size:.72rem;font-weight:850;
  box-shadow:0 14px 38px rgba(219,39,119,.30);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:opacity .25s ease,transform .25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* RESPONSIVE */
@media(max-width:390px){
  .app{padding:0 12px}
  .page-title{font-size:.95rem}
  .search-input{font-size:.86rem;padding:13px 44px 13px 46px}
  .filter-chip{padding:7px 12px;font-size:.68rem}
  .result-title{font-size:.8rem}
  .result-snippet{font-size:.68rem}
  .detail-title{font-size:.92rem}
  .detail-text{font-size:.82rem}
  .nav-item{min-height:52px;font-size:.53rem}
  .nav-fab{width:56px;height:56px;top:-28px}
  .nav-fab svg{width:24px;height:24px}
  .bottom-nav{grid-template-columns:1fr 1fr 70px 1fr 1fr}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none !important;
    transition:none !important;
  }
}
</style>

function escapeHtml(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function normalizeText(s){
  if(!s) return "";
  return String(s)
    .toLowerCase()
    .replace(/[يى]/g,"ی")
    .replace(/ك/g,"ک")
    .replace(/[ۀة]/g,"ه")
    .replace(/[أإآٱ]/g,"ا")
    .replace(/ئ/g,"ی")
    .replace(/ؤ/g,"و")
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"")
    .replace(/\u200c/g," ")
    .replace(/[؟?!.,،؛:"'«»()\[\]{}ـ]/g," ")
    .replace(/[۰-۹]/g, function(d){ return String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)); })
    .replace(/\s+/g," ")
    .trim();
}

var SUFFIXES = [
  "هایمان","هایتان","هایشان",
  "هایم","هایت","هایش","های",
  "هایی","ها",
  "مان","تان","شان",
  "ترین","تر",
  "ان","ات",
  "م","ت","ش","ی"
];
function stemWord(w){
  if(!w || w.length < 3) return w;
  for(var i=0; i<SUFFIXES.length; i++){
    var suf = SUFFIXES[i];
    if(w.length > suf.length + 1 && w.slice(-suf.length) === suf){
      return w.slice(0, -suf.length);
    }
  }
  return w;
}

function levenshtein(a, b){
  if(a === b) return 0;
  var la = a.length, lb = b.length;
  if(la === 0) return lb;
  if(lb === 0) return la;
  if(Math.abs(la - lb) > 2) return 99;
  var prev = new Array(la+1), curr = new Array(la+1);
  for(var j=0; j<=la; j++) prev[j] = j;
  for(var i=1; i<=lb; i++){
    curr[0] = i;
    for(j=1; j<=la; j++){
      var cost = (b.charAt(i-1) === a.charAt(j-1)) ? 0 : 1;
      curr[j] = Math.min(curr[j-1]+1, prev[j]+1, prev[j-1]+cost);
    }
    var tmp = prev; prev = curr; curr = tmp;
  }
  return prev[la];
}

  { path:"data/medical/personal-hygiene.json", cat:"health" },
  { path:"data/hamraz/questions.json",  cat:"hamraz" },
  { path:"data/hamraz/categories.json", cat:"hamraz", isCategories:true },
  { path:"data/duas/duas.json", cat:"duas" },
  { path:"data/duas/amal.json", cat:"duas" },
  { path:"data/education/education.json", cat:"education" },
  { path:"data/education/videos.json",    cat:"education" },
  { path:"data/articles/articles.json", cat:"articles" },
  { path:"data/doctors/doctors.json", cat:"doctors" },
  { path:"data/daily/daily.json", cat:"daily" }
];

var searchIndex = [];
var currentFilter = "all";
var currentQuery = "";
var currentResult = null;

var CACHE_KEY = "bn_search_cache_v1";
var CACHE_TTL = 6 * 60 * 60 * 1000;

function loadFromCache(){
  try{
    var raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    var obj = JSON.parse(raw);
    if(!obj || !obj.ts || !Array.isArray(obj.items)) return null;
    if(Date.now() - obj.ts > CACHE_TTL) return null;
    return obj.items;
  }catch(e){ return null; }
}
function saveToCache(items){
  try{
    var trimmed = items.slice(0, 5000).map(function(it){
      return {
        c: it.cat,
        t: it.title.slice(0, 100),
        x: it.text.slice(0, 300),
        s: it.source.slice(0, 60)
      };
    });
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), items: trimmed }));
  }catch(e){}
}
function restoreFromCache(items){
  searchIndex = items.map(function(it){
    return {
      cat: it.c,
      title: it.t,
      text: it.x,
      source: it.s,
      normTitle: normalizeText(it.t),
      normText: normalizeText(it.x)
    };
  });
}

function addItem(cat, title, text, source){
  title = String(title || "").trim();
  text = String(text || "").trim();
  if(!title && !text) return;
  searchIndex.push({
    cat: cat,
    title: title,
    text: text,
    source: source || "",
    normTitle: normalizeText(title),
    normText: normalizeText(text)
  });
}

function extractText(v){
  if(!v) return "";
  if(typeof v === "string") return v;
  if(typeof v === "number") return String(v);
  if(typeof v !== "object") return "";
  if(Array.isArray(v)) return v.map(extractText).filter(Boolean).join("\n");
  var keys = ["fa","jafari","hanafi","sistani","shirazi","fayyaz","text","answer","body","content"];
  for(var i=0; i<keys.length; i++){
    if(typeof v[keys[i]] === "string") return v[keys[i]];
  }
  var vals = Object.values(v);
  for(var j=0; j<vals.length; j++){
    if(typeof vals[j] === "string") return vals[j];
  }
  return "";
}

function parseFiqh(data, variant){
  if(!data) return;
  var questions = [];
  if(Array.isArray(data)) questions = data;
  else if(Array.isArray(data.questions)) questions = data.questions;
  else if(Array.isArray(data.categories)){
    data.categories.forEach(function(cat){
      if(Array.isArray(cat.questions)){
        cat.questions.forEach(function(q){
          var copy = Object.assign({}, q);
          copy._catTitle = cat.title || "";
          questions.push(copy);
        });
      }
    });
  }
  questions.forEach(function(q){
    var title = q.q || q.title || q.question || q.name || "";
    var answer = "";
    if(q.a){
      if(typeof q.a === "string") answer = q.a;
      else if(variant && q.a[variant]) answer = q.a[variant];
      else answer = extractText(q.a);
    } else {
      answer = extractText(q.answer || q.text || q.content || q.body);
    }
    var srcLabel = q._catTitle || "احکام";
    if(variant === "hanafi") srcLabel = "حنفی — " + srcLabel;
    else if(variant === "sistani") srcLabel = "سیستانی — " + srcLabel;
    else if(variant === "shirazi") srcLabel = "شیرازی — " + srcLabel;
    else if(variant === "fayyaz") srcLabel = "فیاض — " + srcLabel;
    addItem("ahkam", title, answer, srcLabel);
  });
}

function parseGeneric(data, cat){
  if(!data) return;
  var items = [];
  if(Array.isArray(data)) items = data;
  else if(Array.isArray(data.items)) items = data.items;
  else if(Array.isArray(data.sections)) items = data.sections;
  else if(Array.isArray(data.topics)) items = data.topics;
  else if(Array.isArray(data.content)) items = data.content;
  else if(Array.isArray(data.data)) items = data.data;
  else if(Array.isArray(data.articles)) items = data.articles;
  else if(Array.isArray(data.doctors)) items = data.doctors;
  else if(data.title || data.q || data.name || data.question) items = [data];

  items.forEach(function(it){
    if(!it) return;
    if(typeof it === "string"){ addItem(cat, it, "", ""); return; }
    if(typeof it !== "object") return;
    var title = it.title || it.q || it.question || it.name || it.heading || "";
    var text = extractText(it.text || it.a || it.answer || it.description || it.content || it.body || it.summary);
    var srcLabel = it.category || it.source || it.section || it.tag || "";
    addItem(cat, title, text, srcLabel);
  });
}

function parseHamrazCategories(data){
  if(!data || !Array.isArray(data.categories)) return;
  data.categories.forEach(function(cat){
    if(!Array.isArray(cat.questions)) return;
    cat.questions.forEach(function(q){
      var title = q.q || "";
      var answer = extractText(q.a || q.answer || q.text);
      addItem("hamraz", title, answer, cat.title || "");
    });
  });
}

function parseDoctors(data){
  if(!data) return;
  var items = [];
  if(Array.isArray(data)) items = data;
  else if(Array.isArray(data.doctors)) items = data.doctors;
  else if(Array.isArray(data.items)) items = data.items;
  items.forEach(function(d){
    if(!d) return;
    var name = d.name || d.title || "";
    var spec = d.specialty || d.speciality || d.field || "";
    var city = d.city || d.location || "";
    var bio = d.bio || d.description || d.about || "";
    var text = [spec, city, bio].filter(Boolean).join(" • ");
    addItem("doctors", name, text, spec);
  });
}

function parseDaily(data){
  if(!data) return;
  if(Array.isArray(data.hikm)){
    data.hikm.forEach(function(h){
      addItem("daily", h.title || "حکم روز", h.text || "", h.source || "");
    });
  }
  if(Array.isArray(data.tip)){
    data.tip.forEach(function(t){
      addItem("daily", t.title || "نکته روز", t.text || "", t.source || "");
    });
  }
}

function fetchJSON(path){
  return fetch(path, { cache:"force-cache" })
    .then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
}

function loadAll(){
  var total = SOURCES.length;
  var done = 0;
  var progressEl = $("loadingProgress");

  var promises = SOURCES.map(function(src){
    return fetchJSON(src.path)
      .then(function(data){
        if(src.cat === "ahkam") parseFiqh(data, src.variant);
        else if(src.cat === "hamraz" && src.isCategories) parseHamrazCategories(data);
        else if(src.cat === "hamraz") parseGeneric(data, "hamraz");
        else if(src.cat === "doctors") parseDoctors(data);
        else if(src.cat === "daily") parseDaily(data);
        else parseGeneric(data, src.cat);
        done++;
        if(progressEl) progressEl.textContent = currentT.loading_progress + " " + Math.round((done/total)*100) + "%";
      })
      .catch(function(err){
        done++;
        console.warn("⚠️", src.path, "-", err.message);
      });
  });

  return Promise.all(promises);
}

function searchItems(query){
  var nq = normalizeText(query);
  if(!nq || nq.length < 2) return [];

  var qWords = nq.split(" ").filter(function(w){ return w.length > 1; });
  if(qWords.length === 0) return [];
  var qStems = qWords.map(stemWord);

  var results = [];
  var filter = currentFilter;

  for(var i=0; i<searchIndex.length; i++){
    var item = searchIndex[i];
    if(filter !== "all" && item.cat !== filter) continue;

    var score = 0;

    if(item.normTitle === nq){ score += 1000; }
    else if(item.normTitle.indexOf(nq) > -1){ score += 300; }

    if(item.normText.indexOf(nq) > -1){ score += 100; }

    var tWords = item.normTitle ? item.normTitle.split(" ") : [];
    var tStems = tWords.map(stemWord);
    var tText = item.normText;

    for(var j=0; j<qWords.length; j++){
      var qw = qWords[j];
      var qs = qStems[j];

      if(tWords.indexOf(qw) > -1 || tStems.indexOf(qs) > -1){
        score += 80;
        continue;
      }

      if(qs.length >= 3){
        var found = false;
        for(var k=0; k<tStems.length; k++){
          if(tStems[k].length < 3) continue;
          if(tStems[k] === qs){ score += 70; found = true; break; }
          var dist = levenshtein(qs, tStems[k]);
          if(dist === 1){ score += 40; found = true; break; }
        }
        if(found) continue;
      }

      if(tText.indexOf(qw) > -1){ score += 25; }
    }

    if(score > 30) results.push({ item:item, score:score });
  }

  results.sort(function(a,b){ return b.score - a.score; });
  return results.slice(0, 100);
}

function highlight(text, query){
  if(!text) return "";
  var safe = escapeHtml(text);
  if(!query) return safe;

  var nq = normalizeText(query);
  var words = nq.split(" ").filter(function(w){ return w.length > 1; });
  if(!words.length) return safe;

  var pattern = words
    .map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); })
    .join("|");
  if(!pattern) return safe;

  try{
    var re = new RegExp("(" + pattern + ")", "gi");
    return safe.replace(re, "<mark>$1</mark>");
  }catch(e){
    return safe;
  }
}

var SUGGESTS = {
  fa:["وضو","نماز مسافر","قاعدگی","بارداری","حجاب","دعای فرج","همراز"],
  ps:["وضو","مسافر لمونځ","حیض","امیدواري","حجاب","دعا","همراز"],
  en:["Wudu","Traveler prayer","Menstruation","Pregnancy","Hijab","Dua","Companion"]
};

var RECENT_KEY = "bn_search_recent_v1";
var MAX_RECENT = 6;

function getRecent(){
  try{
    var raw = localStorage.getItem(RECENT_KEY);
    if(!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveRecent(q){
  q = String(q || "").trim();
  if(q.length < 2) return;
  var arr = getRecent().filter(function(x){ return x !== q; });
  arr.unshift(q);
  if(arr.length > MAX_RECENT) arr = arr.slice(0, MAX_RECENT);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); }catch(e){}
}
function clearRecent(){
  try{ localStorage.removeItem(RECENT_KEY); }catch(e){}
  renderRecent();
}

function renderSuggestions(){
  var lang = getLang();
  var list = SUGGESTS[lang] || SUGGESTS.fa;
  var container = $("suggestionChips");
  if(!container) return;
  container.innerHTML = "";
  list.forEach(function(s){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "suggestion-chip";
    btn.textContent = s;
    btn.addEventListener("click", function(){
      $("searchInput").value = s;
      $("clearBtn").classList.add("show");
      runSearch(s);
    });
    container.appendChild(btn);
  });
}

function renderRecent(){
  var recent = getRecent();
  var container = $("recentChips");
  var wrap = $("recentBlock");
  if(!container || !wrap) return;

  if(recent.length === 0){
    wrap.style.display = "none";
    return;
  }
  wrap.style.display = "";
  container.innerHTML = "";
  recent.forEach(function(s){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "suggestion-chip";
    btn.textContent = s;
    btn.addEventListener("click", function(){
      $("searchInput").value = s;
      $("clearBtn").classList.add("show");
      runSearch(s);
    });
    container.appendChild(btn);
  });
}

function renderResults(results, query){
  var container = $("results");
  var stats = $("resultStats");
  var empty = $("emptyState");
  var sugg = $("suggestions");
  var recent = $("recentBlock");

  container.innerHTML = "";

  if(!query){
    stats.classList.remove("show");
    empty.classList.remove("show");
    sugg.style.display = "";
    if(recent) renderRecent();
    return;
  }

  sugg.style.display = "none";
  if(recent) recent.style.display = "none";

  if(results.length === 0){
    stats.classList.remove("show");
    empty.classList.add("show");
    return;
  }

  empty.classList.remove("show");
  stats.classList.add("show");
  stats.innerHTML = '<b>' + results.length + '</b> ' + currentT.result_count;

  var frag = document.createDocumentFragment();

  results.forEach(function(r){
    var item = r.item;
    var cat = CATS[item.cat] || CATS.hamraz;

    var card = document.createElement("div");
    card.className = "result-card";
    card.style.setProperty("--result-color", cat.featureColor);

    var titleH = highlight(item.title, query) || '<span style="color:var(--text-muted)">بدون عنوان</span>';
    var snippetRaw = item.text || "";
    if(snippetRaw.length > 220) snippetRaw = snippetRaw.slice(0, 220) + "...";
    var snippetH = highlight(snippetRaw, query);

    card.innerHTML =
      '<div class="result-head">' +
        '<div class="result-icon" style="background:' + cat.color + '">' + cat.icon + '</div>' +
        '<div class="result-cat">' + escapeHtml(currentT["cat_" + item.cat] || item.cat) + '</div>' +
      '</div>' +
      '<div class="result-title">' + titleH + '</div>' +
      (snippetH ? '<div class="result-snippet">' + snippetH + '</div>' : '');

    card.addEventListener("click", function(){ openDetail(item); });
    frag.appendChild(card);
  });

  container.appendChild(frag);
}

function renderNoQuery(){
  renderResults([], "");
}

var searchTimeout = null;
function runSearch(query){
  currentQuery = query;
  if(searchTimeout) clearTimeout(searchTimeout);
  searchTimeout = setTimeout(function(){
    var results = searchItems(query);
    renderResults(results, query);
    // ثبت رویداد آنالیتیکس
    if (window.bnAnalytics && query.length >= 2) {
      window.bnAnalytics.track('search', {
        query: query,
        filter: currentFilter,
        results: results.length
      });
    }
  }, 120);
}

function openDetail(item){
  currentResult = item;
  var cat = CATS[item.cat] || CATS.hamraz;

  var icon = $("detailIcon");
  icon.style.background = cat.color;
  icon.innerHTML = cat.icon;

  $("detailCat").textContent = currentT["cat_" + item.cat] || item.cat;
  $("detailTitle").textContent = item.title || "—";
  $("detailText").textContent = item.text || "—";

  var src = $("detailSource");
  if(item.source){
    src.style.display = "inline-flex";
    src.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>' + escapeHtml(item.source) + '</span>';
  } else {
    src.style.display = "none";
  }

  $("detailModal").classList.add("show");

  if(currentQuery) saveRecent(currentQuery);

  // ثبت رویداد
  if (window.bnAnalytics) {
    window.bnAnalytics.track('search_result_open', {
      cat: item.cat,
      title: (item.title || '').slice(0, 60)
    });
  }
}

function closeDetail(){
  stopSpeech();
  $("detailModal").classList.remove("show");
  currentResult = null;
}

function setupSwipeToClose(){
  var modal = $("detailModal");
  var box = modal.querySelector(".detail-box");
  if(!box) return;
  var startY = 0, currentY = 0, isDragging = false;

  box.addEventListener("touchstart", function(e){
    if(box.scrollTop > 10) return;
    startY = e.touches[0].clientY;
    isDragging = true;
    box.style.transition = "none";
  }, { passive:true });

  box.addEventListener("touchmove", function(e){
    if(!isDragging) return;
    currentY = e.touches[0].clientY;
    var diff = currentY - startY;
    if(diff > 0){
      box.style.transform = "translateY(" + diff + "px)";
    }
  }, { passive:true });

  box.addEventListener("touchend", function(){
    if(!isDragging) return;
    isDragging = false;
    var diff = currentY - startY;
    box.style.transition = "";
    box.style.transform = "";
    if(diff > 100){
      closeDetail();
    }
  });
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.top = "-1000px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); showMsg(currentT.copied); }catch(e){}
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg(currentT.copied); })
      .catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function shareText(text, title){
  if(!text) return;
  if(navigator.share){
    navigator.share({ title:title || "بانوان نور", text:text }).catch(function(){});
  } else {
    copyText(text);
    showMsg(currentT.share_fallback);
  }
}

var speechBtn = null;
function speakText(text, button){
  if(!text) return;
  if(!("speechSynthesis" in window)){ showMsg(currentT.speech_unsupported); return; }
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove("speaking");
    if(speechBtn === button){ speechBtn = null; return; }
  }
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang = currentT.lang === "en" ? "en-US" : (currentT.lang === "ps" ? "ps-AF" : "fa-IR");
  utt.rate = .95; utt.pitch = 1;
  try{
    var voices = window.speechSynthesis.getVoices();
    for(var i=0; i<voices.length; i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf(currentT.lang) === 0){
        utt.voice = voices[i]; break;
      }
    }
  }catch(e){}
  if(button){ button.classList.add("speaking"); speechBtn = button; }
  utt.onend = function(){ if(button) button.classList.remove("speaking"); if(speechBtn === button) speechBtn = null; };
  utt.onerror = function(){ if(button) button.classList.remove("speaking"); if(speechBtn === button) speechBtn = null; };
  window.speechSynthesis.speak(utt);
}
function stopSpeech(){
  try{
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove("speaking");
    speechBtn = null;
  }catch(e){}
}

function setupHandlers(){
  var input = $("searchInput");
  var clearBtn = $("clearBtn");

  input.addEventListener("input", function(){
    var v = input.value.trim();
    clearBtn.classList.toggle("show", v.length > 0);
    if(v.length === 0) renderNoQuery();
    else runSearch(v);
  });

  clearBtn.addEventListener("click", function(){
    input.value = "";
    clearBtn.classList.remove("show");
    input.focus();
    renderNoQuery();
  });

  var chips = document.querySelectorAll(".filter-chip");
  for(var i=0; i<chips.length; i++){
    (function(chip){
      chip.addEventListener("click", function(){
        for(var j=0; j<chips.length; j++) chips[j].classList.remove("active");
        chip.classList.add("active");
        currentFilter = chip.getAttribute("data-filter");
        if(input.value.trim()) runSearch(input.value);
      });
    })(chips[i]);
  }

  var clearRecentBtn = $("clearRecentBtn");
  if(clearRecentBtn) clearRecentBtn.addEventListener("click", clearRecent);

  $("detailClose").addEventListener("click", closeDetail);
  $("detailModal").addEventListener("click", function(e){
    if(e.target === $("detailModal")) closeDetail();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeDetail();
  });

  var actions = document.querySelector(".detail-actions");
  if(actions){
    actions.addEventListener("click", function(e){
      var btn = e.target.closest("[data-act]");
      if(!btn || !currentResult) return;
      var act = btn.getAttribute("data-act");
      var fullText = (currentResult.title || "") + "\n\n" + (currentResult.text || "") +
                     (currentResult.source ? "\n\n— " + currentResult.source : "");
      if(act === "copy") copyText(fullText);
      else if(act === "share") shareText(fullText + "\n\n— بانوان نور", "بانوان نور");
      else if(act === "speak") speakText((currentResult.title || "") + ". " + (currentResult.text || ""), btn);
    });
  }

  window.addEventListener("storage", function(e){
    if(e.key === THEME_KEY) applyTheme(e.newValue || getSystemTheme());
    if(e.key === "bn_lang") applyLang(e.newValue || DEFAULT_LANG);
  });
}

function tryOpenFromURL(){
  try{
    var params = new URLSearchParams(window.location.search);
    var q = params.get("q");
    if(q){
      $("searchInput").value = q;
      $("clearBtn").classList.add("show");
      runSearch(q);
    }
  }catch(e){}
}

function init(){
  applyLang(getLang());
  setupHandlers();
  setupSwipeToClose();
  renderSuggestions();
  renderRecent();

  var cached = loadFromCache();
  if(cached && cached.length > 0){
    restoreFromCache(cached);
    $("loadingState").classList.remove("show");
    console.log("⚡ از cache — " + searchIndex.length + " آیتم");
    tryOpenFromURL();
    return;
  }

  $("loadingState").classList.add("show");

  loadAll().then(function(){
    $("loadingState").classList.remove("show");
    saveToCache(searchIndex);
    console.log("✅ Search index built:", searchIndex.length, "items");
    tryOpenFromURL();
  });
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
})();
