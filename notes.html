<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="یادداشت‌های من — دفترچه شخصی بانوان نور">
<title>یادداشت‌های من | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#fbf8ff;--bg2:#f5ecfb;
  --card:rgba(255,255,255,.80);--card-solid:#fff;
  --text:#25152d;--muted:#776b80;
  --line:rgba(112,55,140,.12);
  --primary:#a832d6;--pink:#ec4899;
  --brand:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --soft:rgba(168,50,214,.09);
  --shadow-sm:0 6px 20px rgba(168,50,214,.08);
  --shadow-md:0 14px 34px rgba(168,50,214,.15);
  --nav-h:78px;
}
html[data-theme="dark"],
body.dark{
  --bg:#000;--bg2:#000;
  --card:rgba(28,28,30,.70);--card-solid:#1c1c1e;
  --text:#fff;--muted:#8e8e93;
  --line:rgba(192,132,252,.16);
  --soft:rgba(192,132,252,.14);
  --shadow-sm:0 6px 20px rgba(0,0,0,.45);
  --shadow-md:0 14px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 8% 0%,rgba(236,72,153,.15),transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(168,85,247,.17),transparent 32%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;
  direction:rtl;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}
/* ✅ LTR */
body.lang-ltr { direction: ltr; }
body.lang-ltr #backBtn svg { transform: none; }
body.lang-ltr .search-box svg { right: auto; left: 14px; }
body.lang-ltr .search-box input { padding: 0 16px 0 46px; }
body.lang-ltr .note-cat-badge { flex-direction: row-reverse; }

button,input,textarea{font:inherit}
button{border:0;cursor:pointer;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:21px;height:21px;display:block}
.hidden{display:none!important}

.app{width:100%;max-width:560px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 14px;gap:8px;
  position:sticky;top:0;z-index:50;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:linear-gradient(to bottom,#000 70%,transparent)}
.top-side{
  width:42px;height:42px;flex:0 0 42px;
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);
  color:var(--primary);box-shadow:var(--shadow-sm);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  cursor:pointer;transition:transform .2s ease;
}
.top-side:active{transform:scale(.91)}
.top-side svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title-box{flex:1;text-align:center;min-width:0}
.page-title-box strong{display:block;font-size:.95rem;font-weight:950}
.page-title-box span{display:block;margin-top:1px;font-size:.6rem;color:var(--muted);font-weight:700}

.hero{
  position:relative;overflow:hidden;
  border-radius:26px;padding:20px 18px 18px;
  color:#fff;background:var(--brand);background-size:180% 180%;
  box-shadow:
    0 18px 42px rgba(219,39,119,.40),
    0 8px 22px rgba(168,85,247,.30),
    inset 0 1px 0 rgba(255,255,255,.20);
  animation:heroShift 14s ease infinite;
  isolation:isolate;
}
@keyframes heroShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero::before{content:"";position:absolute;width:200px;height:200px;top:-110px;left:-70px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%);pointer-events:none}
.hero::after{content:"";position:absolute;width:170px;height:170px;right:-90px;bottom:-100px;border-radius:50%;border:1px solid rgba(255,255,255,.14);pointer-events:none}
.hero-content{position:relative;z-index:2}
.hero-badge{
  width:max-content;display:flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:100px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.24);
  font-size:.6rem;font-weight:800;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.hero-badge svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.9}
.hero h1{margin:12px 0 6px;font-size:1.18rem;line-height:1.35;font-weight:950;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.hero p{margin:0;font-size:.72rem;line-height:2;opacity:.95;max-width:420px;font-weight:700}
.hero-stats{
  display:flex;gap:7px;margin-top:14px;flex-wrap:wrap;
}
.hero-stat{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;border-radius:20px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.24);
  font-size:.62rem;font-weight:850;
  backdrop-filter:blur(8px);
}
.hero-stat svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.2}

.add-note-btn{
  width:100%;min-height:52px;padding:0 16px;
  border-radius:16px;border:0;
  background:var(--brand);background-size:180% 180%;
  color:#fff;font-family:inherit;font-size:.85rem;font-weight:900;
  cursor:pointer;transition:transform .2s ease;
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 12px 28px rgba(219,39,119,.35);
  margin-top:16px;
  animation:heroShift 14s ease infinite;
}
.add-note-btn:active{transform:scale(.97)}
.add-note-btn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.search-box{position:relative;margin-top:12px}
.search-box svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-box input{
  width:100%;height:48px;padding:0 46px 0 16px;
  border:1.5px solid var(--line);border-radius:16px;outline:0;
  color:var(--text);background:var(--card);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  font-family:inherit;font-size:.88rem;font-weight:700;
  transition:border-color .25s,box-shadow .25s;
}
.search-box input:focus{border-color:rgba(168,50,214,.5);box-shadow:0 0 0 4px rgba(168,50,214,.08)}
.search-box input::placeholder{color:var(--muted)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:8px 13px;border-radius:20px;
  background:var(--card);border:1.5px solid var(--line);
  color:var(--text);font-family:inherit;font-size:.7rem;font-weight:850;
  cursor:pointer;white-space:nowrap;transition:all .2s;
  box-shadow:var(--shadow-sm);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--brand);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(219,39,119,.35)}
.chip .chip-count{font-size:.58rem;background:rgba(168,50,214,.12);color:var(--primary);padding:1px 7px;border-radius:10px;font-weight:900;min-width:16px;text-align:center}
.chip.active .chip-count{background:rgba(255,255,255,.28);color:#fff}

.notes-list{display:grid;gap:11px;margin-top:4px}

.note-card{
  position:relative;overflow:hidden;
  border-radius:20px;
  background:var(--card);border:1.5px solid var(--line);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s;
  animation:cardIn .35s ease-out;
  padding:14px;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.note-card:active{transform:scale(.988)}
.note-card:hover{box-shadow:var(--shadow-md)}

.note-card.color-pink{background:linear-gradient(135deg,rgba(236,72,153,.14),rgba(236,72,153,.06));border-color:rgba(236,72,153,.22)}
.note-card.color-purple{background:linear-gradient(135deg,rgba(168,85,247,.14),rgba(168,85,247,.06));border-color:rgba(168,85,247,.22)}
.note-card.color-blue{background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(59,130,246,.06));border-color:rgba(59,130,246,.22)}
.note-card.color-green{background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(16,185,129,.06));border-color:rgba(16,185,129,.22)}
.note-card.color-amber{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.06));border-color:rgba(245,158,11,.22)}
.note-card.color-rose{background:linear-gradient(135deg,rgba(225,29,72,.14),rgba(225,29,72,.06));border-color:rgba(225,29,72,.22)}

.note-card.pinned{
  box-shadow:0 0 0 2px rgba(219,39,119,.25),var(--shadow-md);
}
.note-card.pinned::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--brand);
}

.note-head{
  display:flex;align-items:flex-start;gap:8px;
  margin-bottom:9px;
}
.note-pin-badge{
  width:22px;height:22px;flex:0 0 22px;
  display:grid;place-items:center;
  color:#db2777;
  margin-top:2px;
}
.note-pin-badge svg{width:14px;height:14px;fill:currentColor}
.note-title{
  flex:1;min-width:0;
  font-size:.88rem;font-weight:950;line-height:1.5;
  color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.note-cat-badge{
  display:inline-flex;align-items:center;gap:3px;
  padding:3px 8px;border-radius:8px;
  background:rgba(168,50,214,.12);
  color:var(--primary);
  font-size:.55rem;font-weight:900;
  white-space:nowrap;
}
.note-cat-badge svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.4}
html[data-theme="dark"] .note-cat-badge,
body.dark .note-cat-badge{background:rgba(192,132,252,.2);color:#d8b4fe}

.note-body{
  font-size:.72rem;font-weight:700;
  color:var(--muted);
  line-height:1.9;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
  white-space:pre-line;
  margin-bottom:9px;
}
.note-footer{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
  padding-top:9px;
  border-top:1px dashed var(--line);
}
.note-date{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.58rem;font-weight:800;
  color:var(--muted);
}
.note-date svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2}

.note-quick-actions{display:flex;gap:3px}
.note-quick{
  width:28px;height:28px;border-radius:9px;
  display:grid;place-items:center;
  color:var(--muted);
  background:transparent;
  transition:all .18s;
}
.note-quick:active{transform:scale(.88)}
.note-quick:hover{background:var(--soft);color:var(--primary)}
.note-quick svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.note-quick.active{color:#db2777;background:rgba(219,39,119,.1)}
.note-quick.active svg{fill:currentColor}

.state{padding:40px 18px;text-align:center;color:var(--muted);font-size:.8rem;font-weight:700;line-height:2}
.empty-icon{
  width:70px;height:70px;margin:0 auto 14px;
  display:grid;place-items:center;
  border-radius:22px;
  color:var(--primary);background:var(--soft);
}
.empty-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.9}

.modal{
  position:fixed;inset:0;z-index:5000;
  display:none;align-items:flex-end;justify-content:center;
  padding:15px;
  background:rgba(15,8,20,.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.modal.show{display:flex;animation:mFade .25s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:560px;max-height:92vh;
  overflow:hidden;
  border-radius:26px 26px 22px 22px;
  background:var(--card-solid);border:1px solid var(--line);
  box-shadow:0 -10px 55px rgba(219,39,119,.28);
  display:flex;flex-direction:column;
  animation:mSlide .3s ease;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes mSlide{from{transform:translateY(45px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:42px;height:4px;border-radius:10px;margin:9px auto 4px;background:var(--muted);opacity:.25}
.sheet-head{
  display:flex;align-items:center;gap:9px;
  padding:8px 14px 11px;
  border-bottom:1px solid var(--line);
  background:var(--card-solid);
}
.sheet-close{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:12px;display:grid;place-items:center;
  color:var(--text);background:var(--soft);
}
.sheet-close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4}
.sheet-title{flex:1;min-width:0;text-align:center}
.sheet-title strong{display:block;font-size:.88rem;font-weight:950}
.sheet-title span{display:block;margin-top:2px;color:var(--muted);font-size:.6rem;font-weight:700}
.sheet-save{
  height:38px;padding:0 15px;
  border-radius:12px;
  background:var(--brand);
  color:#fff;font-size:.7rem;font-weight:900;
  display:flex;align-items:center;gap:5px;
  box-shadow:0 6px 16px rgba(219,39,119,.32);
}
.sheet-save:active{transform:scale(.95)}
.sheet-save svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6}

.sheet-scroll{
  overflow-y:auto;overscroll-behavior:contain;
  padding:14px 14px 26px;
  -webkit-overflow-scrolling:touch;
}

.editor-field{margin-bottom:14px}
.editor-label{
  display:flex;align-items:center;gap:6px;
  font-size:.68rem;font-weight:900;
  color:var(--muted);margin-bottom:8px;
  letter-spacing:.2px;
}
.editor-label svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2}
.editor-input,.editor-textarea{
  width:100%;padding:13px 15px;border-radius:14px;
  border:1.5px solid var(--line);
  background:var(--card);color:var(--text);
  font-family:inherit;font-size:.85rem;font-weight:700;
  outline:none;transition:border-color .25s,box-shadow .25s;
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}
.editor-textarea{
  min-height:180px;resize:vertical;line-height:2;
  font-family:inherit;
}
.editor-input:focus,.editor-textarea:focus{
  border-color:rgba(168,50,214,.5);
  box-shadow:0 0 0 4px rgba(168,50,214,.08);
}
.editor-input::placeholder,.editor-textarea::placeholder{color:var(--muted)}

.cat-picker{
  display:flex;flex-wrap:wrap;gap:6px;
}
.cat-option{
  padding:7px 12px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--line);
  color:var(--muted);font-size:.68rem;font-weight:850;
  display:flex;align-items:center;gap:5px;
  transition:all .18s;
  cursor:pointer;
}
.cat-option:active{transform:scale(.95)}
.cat-option.active{
  background:var(--brand);color:#fff;border-color:transparent;
  box-shadow:0 5px 14px rgba(219,39,119,.28);
}
.cat-option svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4}

.color-picker{
  display:flex;gap:8px;flex-wrap:wrap;
}
.color-option{
  width:38px;height:38px;border-radius:12px;
  border:2.5px solid transparent;
  cursor:pointer;transition:all .18s;
  display:grid;place-items:center;
  position:relative;
}
.color-option:active{transform:scale(.9)}
.color-option.active{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(168,50,214,.15);
}
.color-option.active::after{
  content:"✓";
  color:#fff;font-weight:900;font-size:14px;
  text-shadow:0 1px 4px rgba(0,0,0,.3);
}
.color-option.c-default{background:var(--card);border:1.5px solid var(--line)}
.color-option.c-pink{background:linear-gradient(135deg,#f472b6,#ec4899)}
.color-option.c-purple{background:linear-gradient(135deg,#c084fc,#a855f7)}
.color-option.c-blue{background:linear-gradient(135deg,#60a5fa,#3b82f6)}
.color-option.c-green{background:linear-gradient(135deg,#34d399,#10b981)}
.color-option.c-amber{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.color-option.c-rose{background:linear-gradient(135deg,#fb7185,#e11d48)}

.pin-toggle{
  display:flex;align-items:center;gap:9px;
  padding:12px 14px;border-radius:14px;
  background:var(--card);border:1.5px solid var(--line);
  cursor:pointer;transition:all .18s;
}
.pin-toggle:active{transform:scale(.98)}
.pin-toggle.active{
  background:var(--soft);border-color:rgba(168,50,214,.3);
}
.pin-toggle-icon{
  width:32px;height:32px;border-radius:11px;
  display:grid;place-items:center;
  background:var(--soft);color:var(--muted);
  flex:0 0 32px;
}
.pin-toggle.active .pin-toggle-icon{
  background:var(--brand);color:#fff;
}
.pin-toggle-icon svg{width:16px;height:16px;fill:currentColor;stroke:none}
.pin-toggle-text{flex:1}
.pin-toggle-title{font-size:.75rem;font-weight:900;color:var(--text)}
.pin-toggle-sub{font-size:.6rem;color:var(--muted);font-weight:700;margin-top:2px}

.editor-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-top:6px;
}
.editor-action{
  min-height:44px;padding:0 12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:14px;
  background:var(--card);border:1.5px solid var(--line);
  color:var(--text);font-size:.72rem;font-weight:850;
  transition:all .18s;
}
.editor-action:active{transform:scale(.96)}
.editor-action.danger{color:#e11d48}
.editor-action.danger:hover{background:rgba(225,29,72,.08);border-color:rgba(225,29,72,.3)}
.editor-action svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2}

.toast{
  position:fixed;
  left:50%;bottom:calc(110px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;pointer-events:none;z-index:7000;
  max-width:90%;padding:11px 20px;border-radius:30px;
  background:rgba(33,20,46,.94);color:#fff;
  font-size:.72rem;font-weight:850;
  box-shadow:0 14px 38px rgba(219,39,119,.30);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:opacity .25s ease,transform .25s ease;
  text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.bottom-nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:560px;z-index:1000;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;
  gap:4px;align-items:center;
  background:var(--card);
  border-top:1px solid rgba(255,255,255,.18);
  border-radius:26px 26px 0 0;
  box-shadow:0 -10px 28px rgba(225,29,72,.14),0 -24px 55px rgba(168,85,247,.10),inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(55px) saturate(220%);
  -webkit-backdrop-filter:blur(55px) saturate(220%);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{border-top:1px solid rgba(255,255,255,.06);box-shadow:0 -10px 28px rgba(0,0,0,.55),0 -24px 55px rgba(219,39,119,.14)}
.nav-item{
  min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;position:relative;color:var(--muted);border-radius:14px;
  font-size:.56rem;font-weight:850;transition:color .2s ease;padding:6px 2px;
}
.nav-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--primary)}
.nav-item:active{transform:scale(.92)}
.nav-fab-wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.nav-fab{
  position:absolute;top:-30px;width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand);
  box-shadow:0 14px 32px rgba(225,29,72,.48),0 6px 16px rgba(168,85,247,.35);
  border:4px solid var(--card-solid);
  transition:transform .25s ease;z-index:10;
}
.nav-fab:active{transform:scale(.92)}
.nav-fab::before{
  content:"";position:absolute;width:100%;height:100%;border-radius:50%;
  background:var(--brand);z-index:-1;
  animation:fabRipple 3s ease infinite;opacity:.45;
}
@keyframes fabRipple{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.35);opacity:0}}
.nav-fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nav-fab-label{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.56rem;font-weight:900;color:var(--primary);white-space:nowrap}

button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(168,50,214,.25);outline-offset:2px}
@media(max-width:390px){
  .app{padding:0 12px}
  .hero{padding:18px 15px 16px;border-radius:24px}
  .hero h1{font-size:1.06rem}
  .nav-fab{width:56px;height:56px;top:-28px}
  .nav-fab svg{width:24px;height:24px}
  .bottom-nav{grid-template-columns:1fr 1fr 70px 1fr 1fr}
  .page-title-box span{display:none}
  .color-option{width:34px;height:34px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

<script>
"use strict";

const NOTES_KEY = "bn_notes_v2";
const THEME_KEY = "bn_theme";

const CATEGORIES = [
  { id:"personal", title:"شخصی",    icon:"user",     color:"purple" },
  { id:"medical",  title:"پزشکی",   icon:"pill",     color:"pink" },
  { id:"spiritual",title:"معنوی",   icon:"heart",    color:"rose" },
  { id:"shopping", title:"لیست خرید",icon:"shopping", color:"green" },
  { id:"ideas",    title:"ایده",    icon:"bulb",     color:"amber" },
  { id:"general",  title:"عمومی",   icon:"doc",      color:"blue" }
];
const COLORS = ["default","pink","purple","blue","green","amber","rose"];

let notes = [];
let currentEditId = null;
let currentCategory = "all";
let currentColor = "default";
let currentPinned = false;
let searchQuery = "";
let speechActive = false;
let toastTimer = null;

const $ = id => document.getElementById(id);
const notesList = $("notesList");
const searchInput = $("searchInput");
const chipsRow = $("chipsRow");
const editorModal = $("editorModal");
const editorTitle = $("editorTitle");
const editorSubtitle = $("editorSubtitle");
const titleInput = $("noteTitleInput");
const bodyInput = $("noteBodyInput");
const catPicker = $("catPicker");
const colorPicker = $("colorPicker");
const pinToggle = $("pinToggle");
const toastEl = $("toast");
const heroCount = $("heroCount");
const heroPinned = $("heroPinned");

/* THEME */
function getSystemTheme(){
  try{ return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch(e){ return "light"; }
}
function getSavedTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    if(t === "dark" || t === "light") return t;
  }catch(e){}
  return getSystemTheme();
}
function applyTheme(){
  const t = getSavedTheme();
  document.documentElement.setAttribute("data-theme", t);
  document.body.classList.toggle("dark", t === "dark");
  const m = $("themeMeta");
  if(m) m.setAttribute("content", t === "dark" ? "#000000" : "#db2777");
}
applyTheme();

/* HELPERS */
function escapeHTML(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function faNum(n){ return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]); }
function showToast(msg){
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
function pad2(n){ return n<10?"0"+n:""+n; }
function formatDate(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const h = d.getHours();
  const m = d.getMinutes();
  const hh = h<12 ? (h===0?12:h) : (h===12?12:h-12);
  const ampm = h<12 ? "صبح" : "عصر";
  const timeStr = faNum(hh)+":"+faNum(pad2(m))+" "+ampm;
  if(sameDay) return "امروز • " + timeStr;
  const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
  if(d.toDateString() === yesterday.toDateString()) return "دیروز • " + timeStr;
  const months = ["ژانویه","فوریه","مارس","آپریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"];
  return faNum(d.getDate())+" "+months[d.getMonth()];
}
function getCategory(id){
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[5];
}

/* STORAGE */
function loadNotes(){
  try{
    const raw = localStorage.getItem(NOTES_KEY);
    if(!raw){ notes = []; return; }
    const arr = JSON.parse(raw);
    notes = Array.isArray(arr) ? arr : [];
  }catch(e){ notes = []; }
}
function saveNotes(){
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }catch(e){}
}
function generateId(){
  return "note_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
}

/* RENDER */
function renderStats(){
  if(heroCount) heroCount.textContent = faNum(notes.length) + " یادداشت";
  if(heroPinned) heroPinned.textContent = faNum(notes.filter(n => n.pinned).length) + " پین";
}

function renderChips(){
  const counts = { all: notes.length };
  CATEGORIES.forEach(c => {
    counts[c.id] = notes.filter(n => n.category === c.id).length;
  });

  let html = '<button class="chip ' + (currentCategory==="all"?"active":"") + '" data-cat="all" type="button">' +
    '<span>همه</span>' +
    '<span class="chip-count">' + faNum(counts.all) + '</span>' +
  '</button>';

  CATEGORIES.forEach(c => {
    if(counts[c.id] === 0) return;
    const active = currentCategory === c.id ? "active" : "";
    html += '<button class="chip ' + active + '" data-cat="' + c.id + '" type="button">' +
      '<span>' + c.title + '</span>' +
      '<span class="chip-count">' + faNum(counts[c.id]) + '</span>' +
    '</button>';
  });

  chipsRow.innerHTML = html;
  chipsRow.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      currentCategory = chip.dataset.cat;
      renderChips();
      renderNotes();
    });
  });
}

function renderNotes(){
  const q = searchQuery.toLowerCase().trim();
  let filtered = notes.slice();

  if(currentCategory !== "all"){
    filtered = filtered.filter(n => n.category === currentCategory);
  }
  if(q){
    filtered = filtered.filter(n => {
      return (n.title||"").toLowerCase().includes(q) ||
             (n.body||"").toLowerCase().includes(q);
    });
  }

  filtered.sort((a,b) => {
    if(a.pinned && !b.pinned) return -1;
    if(!a.pinned && b.pinned) return 1;
    return (b.updated||b.created||0) - (a.updated||a.created||0);
  });

  renderStats();

  if(!filtered.length){
    const isEmpty = notes.length === 0;
    notesList.innerHTML =
      '<div class="state">' +
        '<div class="empty-icon"><svg><use href="#i-doc"></use></svg></div>' +
        '<strong>' + (isEmpty ? "هنوز یادداشتی نداری" : "چیزی پیدا نشد") + '</strong>' +
        '<div style="margin-top:8px;font-size:.72rem;color:var(--muted)">' +
          (isEmpty ? "روی «یادداشت جدید» بزن و اولین یادداشتت رو بنویس ✍️" : "فیلتر یا جستجو رو تغییر بده") +
        '</div>' +
      '</div>';
    return;
  }

  notesList.innerHTML = filtered.map(n => {
    const cat = getCategory(n.category);
    const colorClass = "color-" + (n.color || "default");
    const pinnedClass = n.pinned ? " pinned" : "";
    const pinSvg = n.pinned
      ? '<div class="note-pin-badge"><svg><use href="#i-pin"></use></svg></div>'
      : "";

    return `
      <article class="note-card ${colorClass}${pinnedClass}" data-id="${escapeHTML(n.id)}">
        <div class="note-head">
          ${pinSvg}
          <div class="note-title">${escapeHTML(n.title || "بدون عنوان")}</div>
          <span class="note-cat-badge">
            <svg><use href="#i-${cat.icon}"></use></svg>
            ${cat.title}
          </span>
        </div>
        ${n.body ? '<div class="note-body">' + escapeHTML(n.body) + '</div>' : ''}
        <div class="note-footer">
          <span class="note-date">
            <svg><use href="#i-clock"></use></svg>
            ${escapeHTML(formatDate(n.updated||n.created))}
          </span>
          <div class="note-quick-actions">
            <button class="note-quick ${n.pinned?"active":""}" data-act="pin" data-id="${escapeHTML(n.id)}" type="button" aria-label="پین">
              <svg><use href="#i-pin"></use></svg>
            </button>
            <button class="note-quick" data-act="copy" data-id="${escapeHTML(n.id)}" type="button" aria-label="کپی">
              <svg><use href="#i-copy"></use></svg>
            </button>
            <button class="note-quick" data-act="edit" data-id="${escapeHTML(n.id)}" type="button" aria-label="ویرایش">
              <svg><use href="#i-edit"></use></svg>
            </button>
          </div>
        </div>
      </article>
    `;
  }).join("");

  notesList.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      const act = btn.dataset.act;
      const id = btn.dataset.id;
      if(act === "edit") openEditor(id);
      else if(act === "pin") togglePin(id);
      else if(act === "copy") copyNote(id);
    });
  });

  notesList.querySelectorAll(".note-card").forEach(card => {
    card.addEventListener("click", e => {
      if(e.target.closest("[data-act]")) return;
      openEditor(card.dataset.id);
    });
  });
}

/* PIN */
function togglePin(id){
  const note = notes.find(n => n.id === id);
  if(!note) return;
  note.pinned = !note.pinned;
  note.updated = Date.now();
  saveNotes();
  renderNotes();
  showToast(note.pinned ? "📌 پین شد" : "پین برداشته شد");

  if (window.bnAnalytics) window.bnAnalytics.track("note_pin", { pinned: note.pinned });
}

/* EDITOR */
function buildCatPicker(){
  catPicker.innerHTML = CATEGORIES.map(c => `
    <button class="cat-option" data-cat="${c.id}" type="button">
      <svg><use href="#i-${c.icon}"></use></svg>
      ${c.title}
    </button>
  `).join("");

  catPicker.querySelectorAll(".cat-option").forEach(btn => {
    btn.addEventListener("click", () => {
      catPicker.querySelectorAll(".cat-option").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
}

function buildColorPicker(){
  colorPicker.innerHTML = COLORS.map(c => `
    <button class="color-option c-${c}" data-color="${c}" type="button" aria-label="${c}"></button>
  `).join("");

  colorPicker.querySelectorAll(".color-option").forEach(btn => {
    btn.addEventListener("click", () => {
      colorPicker.querySelectorAll(".color-option").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentColor = btn.dataset.color;
    });
  });
}

function setActiveCategory(catId){
  catPicker.querySelectorAll(".cat-option").forEach(b => {
    b.classList.toggle("active", b.dataset.cat === catId);
  });
}

function setActiveColor(color){
  colorPicker.querySelectorAll(".color-option").forEach(b => {
    b.classList.toggle("active", b.dataset.color === color);
  });
}

function setPinState(pinned){
  currentPinned = pinned;
  pinToggle.classList.toggle("active", pinned);
}

function openEditor(id){
  currentEditId = id || null;

  if(id){
    const note = notes.find(n => n.id === id);
    if(!note) return;
    editorTitle.textContent = "ویرایش یادداشت";
    editorSubtitle.textContent = "آخرین ویرایش: " + formatDate(note.updated);
    titleInput.value = note.title || "";
    bodyInput.value = note.body || "";
    currentColor = note.color || "default";
    currentPinned = !!note.pinned;
    setActiveCategory(note.category || "general");
    setActiveColor(currentColor);
    setPinState(currentPinned);
    $("editorDelete").style.display = "flex";
  } else {
    editorTitle.textContent = "یادداشت جدید";
    editorSubtitle.textContent = "بانوان نور";
    titleInput.value = "";
    bodyInput.value = "";
    currentColor = "default";
    currentPinned = false;
    setActiveCategory("personal");
    setActiveColor("default");
    setPinState(false);
    $("editorDelete").style.display = "none";
  }

  editorModal.classList.add("show");
  document.body.style.overflow = "hidden";
  setTimeout(() => titleInput.focus(), 300);
}

function closeEditor(){
  stopSpeech();
  editorModal.classList.remove("show");
  document.body.style.overflow = "";
  currentEditId = null;
}

function saveCurrentNote(){
  const title = (titleInput.value || "").trim();
  const body = (bodyInput.value || "").trim();

  if(!title && !body){
    showToast("یادداشت خالی است");
    return;
  }

  const catActive = catPicker.querySelector(".cat-option.active");
  const category = catActive ? catActive.dataset.cat : "personal";
  const now = Date.now();

  if(currentEditId){
    const note = notes.find(n => n.id === currentEditId);
    if(note){
      note.title = title;
      note.body = body;
      note.category = category;
      note.color = currentColor;
      note.pinned = currentPinned;
      note.updated = now;
    }
    showToast("یادداشت ویرایش شد ✓");
  } else {
    notes.push({
      id: generateId(),
      title,
      body,
      category,
      color: currentColor,
      pinned: currentPinned,
      created: now,
      updated: now
    });
    showToast("یادداشت ذخیره شد ✓");
  }

  saveNotes();
  renderChips();
  renderNotes();
  closeEditor();

  if (window.bnAnalytics) window.bnAnalytics.track("note_saved", { category: category });
}

function deleteCurrentNote(){
  if(!currentEditId) return;
  const note = notes.find(n => n.id === currentEditId);
  if(!note) return;
  if(!confirm("مطمئنی می‌خوای این یادداشت رو حذف کنی؟")) return;
  notes = notes.filter(n => n.id !== currentEditId);
  saveNotes();
  renderChips();
  renderNotes();
  closeEditor();
  showToast("🗑️ حذف شد");
}

/* COPY / SHARE / SPEAK */
function copyNote(id){
  const note = notes.find(n => n.id === id);
  if(!note) return;
  const text = (note.title ? note.title + "\n\n" : "") + (note.body || "");
  copyText(text);
}

function copyCurrentNote(){
  const title = (titleInput.value || "").trim();
  const body = (bodyInput.value || "").trim();
  if(!title && !body){ showToast("یادداشت خالی است"); return; }
  const text = (title ? title + "\n\n" : "") + body;
  copyText(text);
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); showToast("متن کپی شد ✓"); }catch(e){}
  document.body.removeChild(ta);
}
async function copyText(text){
  if(!text) return;
  try{
    await navigator.clipboard.writeText(text);
    showToast("متن کپی شد ✓");
  }catch(e){ fallbackCopy(text); }
}

async function shareCurrentNote(){
  const title = (titleInput.value || "").trim();
  const body = (bodyInput.value || "").trim();
  if(!title && !body){ showToast("یادداشت خالی است"); return; }
  const text = (title ? title + "\n\n" : "") + body + "\n\n— بانوان نور";
  try{
    if(navigator.share) await navigator.share({ title: title || "یادداشت", text });
    else { await navigator.clipboard.writeText(text); showToast("متن کپی شد"); }
  }catch(e){}
}

function speakCurrentNote(){
  if(!("speechSynthesis" in window)){ showToast("پشتیبانی نمی‌شود"); return; }
  const btn = $("editorSpeak");
  if(speechActive){
    speechSynthesis.cancel();
    speechActive = false;
    btn.style.background = "";
    btn.style.color = "";
    return;
  }
  const title = (titleInput.value || "").trim();
  const body = (bodyInput.value || "").trim();
  if(!title && !body){ showToast("چیزی برای خواندن نیست"); return; }
  const text = (title ? title + ". " : "") + body;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fa-IR"; u.rate = .95; u.pitch = 1;
  u.onstart = () => {
    speechActive = true;
    btn.style.background = "rgba(168,50,214,.12)";
    btn.style.color = "#a832d6";
  };
  u.onend = u.onerror = () => {
    speechActive = false;
    btn.style.background = "";
    btn.style.color = "";
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  speechActive = false;
  const btn = $("editorSpeak");
  if(btn){ btn.style.background = ""; btn.style.color = ""; }
}

/* EVENTS */
$("addNoteBtn").addEventListener("click", () => openEditor(null));
$("editorClose").addEventListener("click", closeEditor);
$("editorSave").addEventListener("click", saveCurrentNote);
$("editorDelete").addEventListener("click", deleteCurrentNote);
$("editorCopy").addEventListener("click", copyCurrentNote);
$("editorShare").addEventListener("click", shareCurrentNote);
$("editorSpeak").addEventListener("click", speakCurrentNote);
pinToggle.addEventListener("click", () => setPinState(!currentPinned));

editorModal.addEventListener("click", e => { if(e.target === editorModal) closeEditor(); });

let searchTimer = null;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value || "";
    renderNotes();
  }, 180);
});

$("topSearchBtn").addEventListener("click", () => { searchInput.focus(); window.scrollTo({top:0,behavior:"smooth"}); });
$("navSearch").addEventListener("click", () => { searchInput.focus(); window.scrollTo({top:0,behavior:"smooth"}); });
$("navHome").addEventListener("click", () => { location.href = "home.html"; });
$("navHamraz").addEventListener("click", () => { location.href = "hamraz.html"; });
$("navAhkam").addEventListener("click", () => { location.href = "ahkam.html"; });
$("navMore").addEventListener("click", () => { location.href = "settings.html"; });

$("backBtn").addEventListener("click", () => {
  if(editorModal.classList.contains("show")){ closeEditor(); return; }
  if(document.referrer && document.referrer.indexOf(location.origin) === 0){
    history.back();
  } else {
    location.href = "home.html";
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && editorModal.classList.contains("show")) closeEditor();
  if((e.ctrlKey || e.metaKey) && e.key === "Enter" && editorModal.classList.contains("show")){
    saveCurrentNote();
  }
});

window.addEventListener("storage", e => {
  if(e.key === THEME_KEY) applyTheme();
  if(e.key === "bn_lang") location.reload();
});

/* START */
function init(){
  loadNotes();
  buildCatPicker();
  buildColorPicker();
  renderChips();
  renderNotes();
  if (window.bnAnalytics) window.bnAnalytics.track("notes_loaded", { count: notes.length });
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
