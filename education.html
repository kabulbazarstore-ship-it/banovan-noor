<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#8b5cf6" />
<title>آموزش | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
:root{
  --bg-1:#f5f3ff;--bg-2:#ede9fe;--bg-3:#ddd6fe;--bg-4:#c4b5fd;
  --text:#4c1d95;--text-soft:#5b21b6;--text-card:#4c1d95;--text-muted:#6d28d9;
  --card:rgba(255,255,255,.85);--card-border:rgba(139,92,246,.22);
  --card-shadow:0 8px 22px rgba(109,40,217,.12);
  --icon-bg:rgba(255,255,255,.85);--icon-border:rgba(139,92,246,.25);--icon-color:#7c3aed;
  --nav-bg:rgba(255,255,255,.94);--nav-border:rgba(139,92,246,.2);
  --nav-color:#6d28d9;--nav-active:#7c3aed;
  --star:.2;
  --search-bg:rgba(255,255,255,.92);
  --chip-bg:rgba(255,255,255,.7);
  --chip-border:rgba(139,92,246,.25);
  --accent:#7c3aed;
  --accent-dark:#6d28d9;
  --violet-soft:rgba(139,92,246,.1);
}
body.dark{
  --bg-1:#2e1065;--bg-2:#4c1d95;--bg-3:#5b21b6;--bg-4:#2e1065;
  --text:#fff;--text-soft:#ddd6fe;--text-card:#fff;--text-muted:#c4b5fd;
  --card:rgba(255,255,255,.08);--card-border:rgba(196,181,253,.3);
  --card-shadow:0 8px 22px rgba(0,0,0,.3);
  --icon-bg:rgba(255,255,255,.08);--icon-border:rgba(196,181,253,.3);--icon-color:#ddd6fe;
  --nav-bg:rgba(46,16,101,.94);--nav-border:rgba(196,181,253,.25);
  --nav-color:#a78bfa;--nav-active:#ddd6fe;
  --star:.7;
  --search-bg:rgba(255,255,255,.08);
  --chip-bg:rgba(255,255,255,.06);
  --chip-border:rgba(196,181,253,.3);
  --violet-soft:rgba(196,181,253,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%}
body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl;font-size:17px;
  line-height:1.8;font-weight:600;color:var(--text);background-color:var(--bg-1);
  background-image:
    radial-gradient(ellipse 500px 400px at 20% 5%,rgba(139,92,246,.15) 0,transparent 60%),
    radial-gradient(ellipse 400px 350px at 85% 15%,rgba(167,139,250,.18) 0,transparent 65%),
    linear-gradient(160deg,var(--bg-1) 0,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%,var(--bg-4) 100%);
  background-attachment:fixed;min-height:100vh;padding:0 0 110px;position:relative;overflow-x:hidden;
  transition:background-color .4s,color .3s;
}
body::before{
  content:"";position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 12% 8%,rgba(253,230,138,var(--star)) 0,transparent 1.2%),
    radial-gradient(circle at 88% 6%,rgba(253,230,138,var(--star)) 0,transparent 1%);
  pointer-events:none;z-index:0;
}
.app{max-width:520px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

.page-header{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
.back-btn{
  width:44px;height:44px;border-radius:14px;background:var(--icon-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--icon-border);color:var(--icon-color);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex:0 0 44px;text-decoration:none;box-shadow:0 4px 12px rgba(109,40,217,.15);
}
.back-btn:active{transform:scale(.94)}
.back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
.page-header h1{font-size:1.35rem;font-weight:900;color:var(--text);flex:1;text-align:center;padding-right:44px}

.hero{
  background:linear-gradient(135deg,#a78bfa 0,#6d28d9 100%);
  border-radius:20px;padding:22px;margin-bottom:16px;
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 12px 30px rgba(109,40,217,.35);
  display:flex;align-items:center;gap:14px;
}
.hero::before{
  content:"";position:absolute;top:-40px;right:-40px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);
  pointer-events:none;
}
.hero-icon{
  width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;flex:0 0 56px;
  backdrop-filter:blur(10px);
}
.hero-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero-text{flex:1}
.hero-title{font-size:1.1rem;font-weight:900;margin-bottom:5px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero-sub{font-size:.85rem;color:#fff;opacity:.95;font-weight:700;line-height:1.7}

.tabs{
  display:flex;gap:6px;background:var(--chip-bg);
  border:1.5px solid var(--chip-border);border-radius:16px;
  padding:5px;margin-bottom:16px;
  backdrop-filter:blur(12px);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:fit-content;padding:11px 10px;border-radius:12px;border:0;
  background:transparent;color:var(--text-soft);
  font-family:inherit;font-size:.82rem;font-weight:800;
  cursor:pointer;transition:all .22s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.tab:active{transform:scale(.96)}
.tab.active{
  background:linear-gradient(135deg,#a78bfa,#6d28d9);
  color:#fff;box-shadow:0 4px 14px rgba(109,40,217,.4);
}
.tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px}
.tab .tab-count{
  font-size:.65rem;background:rgba(255,255,255,.25);
  padding:1px 6px;border-radius:10px;font-weight:900;
  min-width:16px;text-align:center;
}
.tab.active .tab-count{background:rgba(255,255,255,.3)}

.search-wrap{position:relative;margin-bottom:14px}
.search-input{
  width:100%;padding:14px 48px 14px 18px;border-radius:16px;
  border:1.5px solid var(--card-border);background:var(--search-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);font-family:inherit;font-size:.95rem;font-weight:700;
  outline:none;transition:border-color .25s;
}
.search-input:focus{border-color:rgba(139,92,246,.7)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--text-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

.filter-count{
  font-size:.82rem;font-weight:800;color:var(--text-muted);
  margin:0 4px 14px;
}

.edu-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.edu-card{
  background:var(--card);backdrop-filter:blur(20px);
  border:1.5px solid var(--card-border);border-radius:16px;
  padding:16px;cursor:pointer;transition:all .22s;
  display:flex;align-items:flex-start;gap:14px;
  box-shadow:var(--card-shadow);width:100%;text-align:right;
  font-family:inherit;position:relative;overflow:hidden;
}
.edu-card:active{transform:scale(.99)}
.edu-card:hover{border-color:rgba(139,92,246,.5)}
.edu-icon{
  width:50px;height:50px;border-radius:14px;flex:0 0 50px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#a78bfa,#6d28d9);
  box-shadow:0 6px 14px rgba(109,40,217,.3);
}
.edu-icon svg{
  width:26px;height:26px;fill:none;stroke:#fff;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.edu-body{flex:1;min-width:0}
.edu-cat{
  display:inline-block;font-size:.65rem;font-weight:900;
  padding:2px 8px;border-radius:10px;
  background:var(--violet-soft);color:var(--accent);
  margin-bottom:6px;
}
.edu-title{
  font-size:.98rem;font-weight:900;color:var(--text-card);
  line-height:1.5;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.edu-excerpt{
  font-size:.82rem;font-weight:700;color:var(--text-muted);
  line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.edu-type-row{
  display:flex;align-items:center;gap:6px;margin-top:8px;
  font-size:.7rem;font-weight:900;
}
.edu-type-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:12px;
  background:linear-gradient(135deg,#a78bfa,#6d28d9);
  color:#fff;
}
.edu-type-badge svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.edu-type-badge.video svg{fill:currentColor}
.edu-duration{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:12px;
  background:var(--violet-soft);color:var(--accent);
}
.edu-duration svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:10000;padding:0;
}
.modal.show{display:flex;animation:mFade .3s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--bg-1);border-radius:28px 28px 0 0;
  padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));
  animation:mSlide .35s ease;
}
@keyframes mSlide{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:18px;padding-bottom:14px;
  border-bottom:1.5px solid var(--card-border);gap:12px;
}
.modal-head-text{flex:1;min-width:0}
.modal-badge{
  display:inline-block;font-size:.72rem;font-weight:900;
  padding:4px 12px;border-radius:20px;
  background:linear-gradient(135deg,#a78bfa,#6d28d9);
  color:#fff;margin-bottom:10px;box-shadow:0 4px 12px rgba(109,40,217,.35);
}
.modal-q{font-size:1.15rem;font-weight:900;color:var(--text);line-height:1.7}
.modal-close{
  width:44px;height:44px;border-radius:14px;
  background:var(--card);border:1px solid var(--card-border);
  color:var(--text-soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 44px;
}
.modal-close:active{transform:scale(.9)}
.modal-close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* VIDEO BUTTON */
.video-cta{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  border-radius:16px;padding:16px;margin-bottom:14px;
  color:#fff;cursor:pointer;transition:transform .2s;
  box-shadow:0 8px 20px rgba(220,38,38,.35);
  border:0;font-family:inherit;width:100%;text-align:right;
}
.video-cta:active{transform:scale(.97)}
.video-cta-icon{
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.25);
  border:2px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;flex:0 0 52px;
}
.video-cta-icon svg{width:24px;height:24px;fill:#fff;stroke:#fff;margin-right:-3px}
.video-cta-text{flex:1}
.video-cta-title{
  font-size:1rem;font-weight:900;margin-bottom:4px;
  text-shadow:0 2px 8px rgba(0,0,0,.15);
}
.video-cta-sub{
  font-size:.78rem;font-weight:700;
  opacity:.95;line-height:1.6;
}
.video-cta-arrow{
  width:24px;height:24px;flex:0 0 24px;
  fill:none;stroke:#fff;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);
}

.modal-content{
  background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(109,40,217,.06));
  border:1px solid var(--card-border);border-radius:18px;
  padding:18px;margin-top:6px;
}
.answer-text{
  font-size:.95rem;line-height:2.2;color:var(--text-card);
  font-weight:700;white-space:pre-line;
}

.action-bar{
  display:flex;gap:4px;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--card-border);flex-wrap:wrap;
}
.act-btn{
  width:40px;height:40px;border-radius:11px;
  background:transparent;border:1px solid transparent;
  color:var(--text-muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .18s;
}
.act-btn:hover{background:var(--icon-bg);border-color:var(--icon-border);color:var(--icon-color)}
.act-btn:active{transform:scale(.88)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act-btn.speaking{color:#7c3aed;background:rgba(139,92,246,.12);animation:pulse 1.1s infinite}
body.dark .act-btn.speaking{color:#ddd6fe;background:rgba(196,181,253,.15)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.loader,.empty{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);font-size:.95rem;font-weight:700;line-height:2;
}
.loader::before{
  content:"";display:block;width:32px;height:32px;
  border:3px solid rgba(139,92,246,.2);border-top-color:#7c3aed;
  border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(24px);
  border-top:1px solid var(--nav-border);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;
  box-shadow:0 -8px 30px rgba(109,40,217,.15);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--nav-color);padding:8px 2px;font-size:.68rem;font-weight:800;
  text-decoration:none;cursor:pointer;border-radius:12px;position:relative;
}
.nav-item.active{color:var(--nav-active)}
.nav-item.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,#a78bfa,#6d28d9,#fde68a);
  box-shadow:0 0 12px rgba(109,40,217,.8);
}
.nav-item svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke-width:2.4}

.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff;
  padding:14px 26px;border-radius:30px;font-size:.95rem;font-weight:900;
  z-index:10002;opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:0 12px 30px rgba(139,92,246,.5);max-width:90vw;text-align:center;
  white-space:pre-line;line-height:1.7;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:380px){
  body{font-size:16px}
  .app{padding:0 12px}
  .page-header h1{font-size:1.2rem}
  .hero{padding:18px}
  .hero-icon{width:48px;height:48px;flex:0 0 48px}
  .edu-icon{width:44px;height:44px;flex:0 0 44px}
  .edu-icon svg{width:22px;height:22px}
  .nav-item{font-size:.62rem}
  .nav-item svg{width:21px;height:21px}
  .tab{font-size:.75rem;padding:10px 8px}
  .video-cta-icon{width:46px;height:46px;flex:0 0 46px}
}
</style>
</head>

<script>
(function(){
  try{ if(localStorage.getItem('bn_theme')==='dark') document.body.classList.add('dark'); }catch(e){}
})();
</script>

  <div style="height:20px"></div>
</div>

    <span>خانه</span>
  </a>
  <a class="nav-item" href="search.html">

  <a class="nav-item" href="hamraz.html">

  <a class="nav-item" href="ahkam.html">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>احکام</span>
  </a>
  <a class="nav-item" href="settings.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>بیشتر</span>
  </a>
</nav>

<div class="modal" id="eduModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-head-text">
        <span class="modal-badge" id="modalBadge">آموزش</span>
        <div class="modal-q" id="modalTitle">—</div>
      </div>
      <button class="modal-close" id="modalClose" type="button" aria-label="بستن">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="modalMedia"></div>

    <div class="modal-content">
      <div class="answer-text" id="modalContent">—</div>
      <div class="action-bar">
        <button class="act-btn" data-edu-act="copy" title="کپی">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="act-btn" data-edu-act="share" title="اشتراک‌گذاری">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
        </button>
        <button class="act-btn" data-edu-act="speak" title="خواندن صوتی">
          <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var EDUCATION_PATH = 'data/education/education.json';

var allItems = [];
var currentTab = 'all';
var searchQuery = '';
var currentItem = null;
var speechBtn = null;
var toastTimer = null;

/* ═══ آیکون‌ها ═══ */
var ICONS = {
  droplet: '<svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
  drop: '<svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><circle cx="12" cy="14" r="3" fill="currentColor" opacity=".3"/></svg>',
  pregnant: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M9 10c0-1.5 1.5-3 3-3s3 1.5 3 3v3c1.5.5 3 2 3 4 0 2-1.5 3-3 3h-6c-1.5 0-3-1-3-3 0-2 1.5-3.5 3-4z"/></svg>',
  prayer: '<svg viewBox="0 0 24 24"><path d="M12 2L8 6h8z"/><path d="M4 10h16v12H4z"/><path d="M8 22v-6h8v6"/></svg>',
  warning: '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  apple: '<svg viewBox="0 0 24 24"><path d="M12 6c-3 0-5 2-5 6s2 8 5 8 5-4 5-8-2-6-5-6z"/><path d="M12 6c0-2 1-4 3-4"/><path d="M10 3c1 0 2 1 2 3"/></svg>',
  tooth: '<svg viewBox="0 0 24 24"><path d="M12 2C8 2 5 4 5 8c0 3 1 5 1 8s1 6 2 6 2-2 2-5 1-3 2-3 2 0 2 3 1 5 2 5 2-3 2-6 1-5 1-8c0-4-3-6-7-6z"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  baby: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
  dumbbell: '<svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M3 8h3M3 16h3M18 8h3M18 16h3M6 12h12"/></svg>',
  yoga: '<svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v6"/><path d="M6 12h12l-3 6H9z"/></svg>',
  medical: '<svg viewBox="0 0 24 24"><path d="M12 2v20M5 7l7-5 7 5"/><circle cx="12" cy="12" r="4" fill="currentColor" opacity=".3"/></svg>',
  firstaid: '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M12 10v6M9 13h6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  salad: '<svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M5 12c0 5 3 9 7 9s7-4 7-9"/><path d="M12 8c0-2-1-4-3-4s-3 2-3 4"/><path d="M12 8c0-2 1-4 3-4s3 2 3 4"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};

var CATEGORY_ICONS = {
  'احکام': 'prayer',
  'بارداری': 'pregnant',
  'قاعدگی': 'drop',
  'تغذیه': 'apple',
  'بهداشت': 'tooth',
  'روان': 'heart',
  'شیردهی': 'baby',
  'زایمان': 'baby',
  'ورزش': 'dumbbell',
  'سلامت': 'medical'
};

function getTypeIcon(type){
  if(type === 'video'){
    return '<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
  }
  return '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
}

function getTypeLabel(type){
  if(type === 'video') return 'ویدیو';
  return 'مقاله';
}

function getItemIcon(item){
  if(item.icon && ICONS[item.icon]) return ICONS[item.icon];
  if(item.category && CATEGORY_ICONS[item.category]){
    var key = CATEGORY_ICONS[item.category];
    if(ICONS[key]) return ICONS[key];
  }
  return ICONS.book;
}

/* ═══ HELPERS ═══ */
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function faNum(n){ return String(n).replace(/\d/g,function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
function showMsg(msg,dur){
  dur=dur||2200;
  var t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },dur);
}
function getTheme(){ try{ return localStorage.getItem('bn_theme')||'light'; }catch(e){ return 'light'; } }
function applyTheme(){
  if(getTheme()==='dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}

/* ═══ LOAD ═══ */
function fetchJSON(path){
  return fetch(path).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function normalizeItem(a, idx){
  if(!a) return null;
  var id = a.id || ('ed_'+(idx+1));
  var type = a.type || 'article';
  return {
    id: String(id),
    type: type,
    title: a.title || '',
    excerpt: a.excerpt || '',
    category: a.category || '',
    icon: a.icon || '',
    content: a.content || '',
    videoUrl: a.videoUrl || '',
    duration: a.duration || '',
    tags: Array.isArray(a.tags) ? a.tags : [],
    source: a.source || ''
  };
}

function extractItems(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.articles)) return data.articles;
  if(Array.isArray(data.items)) return data.items;
  if(Array.isArray(data.list)) return data.list;
  if(Array.isArray(data.data)) return data.data;
  return [];
}

function loadEducation(){
  return fetchJSON(EDUCATION_PATH)
    .then(function(data){
      var arr = extractItems(data);
      allItems = arr.map(normalizeItem).filter(Boolean);
      updateCounts();
      renderItems();
      return allItems;
    })
    .catch(function(err){
      console.warn('education.json:', err.message);
      allItems = [];
      var list = $('eduList');
      if(list){
        list.innerHTML = '<div class="empty">هنوز محتوایی اضافه نشده<br><br><span style="font-size:.85rem;opacity:.8">فایل: <strong>data/education/education.json</strong></span></div>';
      }
      return [];
    });
}

function updateCounts(){
  var counts = { all: allItems.length, video: 0, article: 0 };
  allItems.forEach(function(i){ counts[i.type] = (counts[i.type] || 0) + 1; });
  var elAll = $('countAll'); if(elAll) elAll.textContent = faNum(counts.all);
  var elV = $('countVideo'); if(elV) elV.textContent = faNum(counts.video);
  var elA = $('countArticle'); if(elA) elA.textContent = faNum(counts.article);
}

function setupTabs(){
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentTab = tab.getAttribute('data-tab');
      renderItems();
    });
  });
}

function renderItems(){
  var list = $('eduList');
  if(!list) return;
  var items = allItems.slice();

  if(currentTab !== 'all'){
    items = items.filter(function(i){ return i.type === currentTab; });
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase().trim();
    items = items.filter(function(i){
      return i.title.toLowerCase().indexOf(q) > -1 ||
             i.excerpt.toLowerCase().indexOf(q) > -1 ||
             i.content.toLowerCase().indexOf(q) > -1 ||
             i.category.toLowerCase().indexOf(q) > -1 ||
             i.tags.some(function(t){ return String(t).toLowerCase().indexOf(q) > -1; });
    });
  }

  var cnt = $('filterCount');
  if(cnt) cnt.textContent = faNum(items.length) + ' آموزش';

  if(items.length === 0){
    list.innerHTML = '<div class="empty">' +
      (searchQuery ? 'برای «' + escapeHtml(searchQuery) + '» نتیجه‌ای یافت نشد' : 'محتوایی در این دسته نیست') +
    '</div>';
    return;
  }

  var html = '';
  items.forEach(function(i){
    var typeLabel = getTypeLabel(i.type);
    var typeIcon = getTypeIcon(i.type);
    var itemIcon = getItemIcon(i);
    var badgeClass = i.type === 'video' ? 'edu-type-badge video' : 'edu-type-badge';

    html += '<div class="edu-card" data-id="' + escapeHtml(i.id) + '" role="button" tabindex="0">' +
      '<div class="edu-icon">' + itemIcon + '</div>' +
      '<div class="edu-body">' +
        (i.category ? '<span class="edu-cat">' + escapeHtml(i.category) + '</span>' : '') +
        '<div class="edu-title">' + escapeHtml(i.title) + '</div>' +
        '<div class="edu-excerpt">' + escapeHtml(i.excerpt) + '</div>' +
        '<div class="edu-type-row">' +
          '<span class="' + badgeClass + '">' + typeIcon + escapeHtml(typeLabel) + '</span>' +
          (i.duration && i.type === 'video' ? '<span class="edu-duration">' +
            '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
            escapeHtml(i.duration) +
          '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.edu-card').forEach(function(card){
    card.addEventListener('click', function(){
      openItem(card.getAttribute('data-id'));
    });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openItem(card.getAttribute('data-id')); }
    });
  });
}

function openItem(id){
  var item = null;
  for(var i=0; i<allItems.length; i++){
    if(allItems[i].id === id){ item = allItems[i]; break; }
  }
  if(!item) return;
  currentItem = item;

  $('modalBadge').textContent = getTypeLabel(item.type) + (item.category ? ' • ' + item.category : '');
  $('modalTitle').textContent = item.title;

  var mediaEl = $('modalMedia');
  mediaEl.innerHTML = '';

  // اگه ویدیو بود، دکمه «تماشای ویدیو» نشون بده
  if(item.type === 'video' && item.videoUrl){
    var videoBtn = document.createElement('button');
    videoBtn.type = 'button';
    videoBtn.className = 'video-cta';
    videoBtn.innerHTML =
      '<div class="video-cta-icon">' +
        '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>' +
      '</div>' +
      '<div class="video-cta-text">' +
        '<div class="video-cta-title">تماشای ویدیو در یوتیوب</div>' +
        '<div class="video-cta-sub">' + (item.duration ? 'مدت: ' + item.duration + ' • ' : '') + 'با کلیک، به یوتیوب منتقل می‌شوی' + '</div>' +
      '</div>' +
      '<svg class="video-cta-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    videoBtn.addEventListener('click', function(){
      window.open(item.videoUrl, '_blank', 'noopener');
    });
    mediaEl.appendChild(videoBtn);
  }

  $('modalContent').textContent = item.content || item.excerpt || '';
  $('eduModal').classList.add('show');
}

function closeModal(){
  stopSpeech();
  $('eduModal').classList.remove('show');
  $('modalMedia').innerHTML = '';
  currentItem = null;
}

/* ═══ COPY / SHARE / SPEAK ═══ */
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showMsg('متن کپی شد ✓'); }
  catch(e){ showMsg('...'); }
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg('متن کپی شد ✓'); })
      .catch(function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function shareText(text,title){
  if(!text) return;
  if(navigator.share){
    navigator.share({title:title||'بانوان نور',text:text}).catch(function(){});
  } else { copyText(text); showMsg('متن کپی شد'); }
}
function speakText(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window)){ showMsg('خواندن صوتی پشتیبانی نمی‌شود'); return; }
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    if(speechBtn === btn){ speechBtn = null; return; }
  }
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang='fa-IR'; utt.rate=0.95; utt.pitch=1;
  try{
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf('fa')===0){ utt.voice=voices[i]; break; }
    }
  }catch(e){}
  if(btn){ btn.classList.add('speaking'); speechBtn = btn; }
  utt.onend = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  utt.onerror = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  window.speechSynthesis.speak(utt);
}
function stopSpeech(){
  try{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    speechBtn = null;
  }catch(e){}
}

/* ═══ MODAL ACTIONS ═══ */
function setupModalActions(){
  var bar = document.querySelector('#eduModal .action-bar');
  if(bar){
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('[data-edu-act]');
      if(!btn || !currentItem) return;
      var act = btn.getAttribute('data-edu-act');
      var fullText = (currentItem.title ? currentItem.title + '\n\n' : '') + (currentItem.content || '');
      var shareUrl = (currentItem.type === 'video') ? currentItem.videoUrl : '';
      if(act === 'copy') copyText(fullText);
      else if(act === 'share'){
        var st = fullText + (shareUrl ? '\n\n🎬 ' + shareUrl : '') + '\n\n— بانوان نور';
        shareText(st, 'بانوان نور');
      }
      else if(act === 'speak') speakText((currentItem.title ? currentItem.title + '. ' : '') + (currentItem.content || ''), btn);
    });
  }
  var closeBtn = $('modalClose');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  var modal = $('eduModal');
  if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('eduModal').classList.contains('show')) closeModal();
  });
}

function setupSearch(){
  var si = $('searchInput');
  if(!si) return;
  var timer = null;
  si.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      searchQuery = si.value || '';
      renderItems();
    }, 180);
  });
}

function init(){
  applyTheme();
  setupTabs();
  setupSearch();
  setupModalActions();
  loadEducation();

  window.addEventListener('storage', function(e){
    if(e.key === 'bn_theme') applyTheme();
  });

  try{
    if('speechSynthesis' in window) window.speechSynthesis.getVoices();
  }catch(e){}

  console.log('📚 صفحه آموزش آماده');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else init();

})();
</script>
