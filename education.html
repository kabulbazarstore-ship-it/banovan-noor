<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="آموزش بانوان نور — مقالات و ویدیوهای آموزشی">
<title>آموزش | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">

<script>
(function(){
  try{
    var t = localStorage.getItem('bn_theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#fdf5ff;--bg-soft:#f6e9ff;
  --surface:rgba(255,255,255,.78);--surface-solid:#ffffff;
  --text:#2a1740;--text-soft:#5f4a77;--text-muted:#9686a8;
  --primary:#a832d6;--primary-2:#c026d3;--magenta:#d946ef;--pink:#ec4899;
  --red:#e11d48;--green:#10b981;--amber:#f59e0b;
  --border:rgba(168,50,214,.14);
  --shadow-sm:0 6px 20px rgba(168,50,214,.08);
  --shadow-md:0 14px 34px rgba(168,50,214,.15);
  --shadow-lg:0 22px 50px rgba(168,50,214,.20);
  --nav-bg:rgba(255,255,255,.68);
  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.13),rgba(168,85,247,.10));
  --violet-soft:rgba(168,50,214,.10);
  --chip-bg:rgba(255,255,255,.70);
  --chip-border:rgba(168,50,214,.18);
}
html[data-theme="dark"],
body.dark{
  --bg:#000000;--bg-soft:#000000;
  --surface:rgba(28,28,30,.72);--surface-solid:#1c1c1e;
  --text:#ffffff;--text-soft:#e4e6eb;--text-muted:#8e8e93;
  --primary:#c084fc;--primary-2:#d8b4fe;--magenta:#e879f9;--pink:#ec4899;
  --red:#e11d48;--green:#34d399;--amber:#fbbf24;
  --border:rgba(192,132,252,.16);
  --shadow-sm:0 6px 20px rgba(0,0,0,.45);
  --shadow-md:0 14px 34px rgba(0,0,0,.55);
  --shadow-lg:0 22px 50px rgba(0,0,0,.65);
  --nav-bg:rgba(15,10,22,.68);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.18),rgba(168,85,247,.14));
  --violet-soft:rgba(192,132,252,.14);
  --chip-bg:rgba(28,28,30,.72);
  --chip-border:rgba(192,132,252,.20);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}
body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl;color:var(--text);
  background:
    radial-gradient(circle at 8% 0%,rgba(236,72,153,.15),transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(168,85,247,.17),transparent 32%),
    linear-gradient(160deg,var(--bg),var(--bg-soft));
  min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}
/* ✅ LTR */
body.lang-ltr { direction: ltr; }
body.lang-ltr .back-btn svg { transform: none; }
body.lang-ltr .edu-card::before { right: auto; left: 0; border-radius: 16px 0 0 16px; }
body.lang-ltr .video-cta-arrow { transform: none; }
body.lang-ltr .search-icon { left: auto; right: 14px; }
body.lang-ltr .search-input { padding: 13px 16px 13px 46px; }
body.lang-ltr .related-title::before { margin-right: 0; margin-left: 0; }

.app{width:100%;max-width:640px;margin:0 auto;padding:0 16px;position:relative;z-index:2}
.topbar{
  display:flex;align-items:center;gap:10px;padding:18px 0 14px;
  position:sticky;top:0;background:linear-gradient(to bottom,var(--bg) 70%,transparent);
  z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:linear-gradient(to bottom,#000 70%,transparent)}
.back-btn,.icon-btn-mini{
  width:42px;height:42px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 42px;text-decoration:none;
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow-sm);transition:transform .2s;
}
.back-btn:active,.icon-btn-mini:active{transform:scale(.9)}
.back-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
.icon-btn-mini svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.page-title{flex:1;font-size:1.05rem;font-weight:900;text-align:center}

.hero{
  border-radius:24px;padding:20px;margin-bottom:14px;color:#fff;
  background:var(--brand-grad);background-size:180% 180%;
  box-shadow:0 18px 42px rgba(219,39,119,.40),0 8px 22px rgba(168,85,247,.30),inset 0 1px 0 rgba(255,255,255,.22);
  animation:heroShift 14s ease infinite;
  display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;
}
@keyframes heroShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero::before{
  content:"";position:absolute;width:220px;height:220px;top:-120px;left:-80px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.30),transparent 70%);
  pointer-events:none;
}
.hero-icon{
  width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.22);
  border:1.5px solid rgba(255,255,255,.32);
  display:flex;align-items:center;justify-content:center;flex:0 0 54px;
  backdrop-filter:blur(10px);position:relative;z-index:1;
}
.hero-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hero-text{flex:1;min-width:0;position:relative;z-index:1}
.hero-title{font-size:1rem;font-weight:900;line-height:1.4;margin-bottom:4px}
.hero-sub{font-size:.7rem;line-height:1.75;opacity:.95;font-weight:600}

.progress-card{
  background:var(--surface);backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1.5px solid var(--border);border-radius:16px;
  padding:12px 14px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.progress-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;font-size:.72rem;font-weight:900;
}
.progress-head .label{color:var(--text-soft);display:flex;align-items:center;gap:6px}
.progress-head .label svg{width:14px;height:14px;fill:none;stroke:var(--primary);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.progress-head .value{color:var(--primary)}
.progress-bar{
  height:8px;border-radius:10px;background:var(--violet-soft);
  overflow:hidden;position:relative;
}
.progress-bar::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-22deg);
}
.progress-fill{
  height:100%;border-radius:10px;
  background:var(--brand-grad);
  transition:width .6s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 12px rgba(219,39,119,.5);
}

.tabs{
  display:flex;gap:4px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:16px;
  padding:4px;margin-bottom:12px;
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:fit-content;padding:10px 10px;border-radius:12px;border:0;
  background:transparent;color:var(--text-soft);
  font-family:inherit;font-size:.76rem;font-weight:850;
  cursor:pointer;transition:all .22s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.tab:active{transform:scale(.96)}
.tab.active{
  background:var(--brand-grad);color:#fff;
  box-shadow:0 6px 16px rgba(219,39,119,.35);
}
.tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 14px}
.tab .tab-count{
  font-size:.6rem;background:rgba(168,50,214,.14);
  color:var(--primary);padding:1px 6px;border-radius:10px;
  font-weight:900;min-width:16px;text-align:center;
}
.tab.active .tab-count{background:rgba(255,255,255,.28);color:#fff}

.chips-wrap{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:2px 2px 12px;margin-bottom:4px;
}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:20px;
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text-soft);font-family:inherit;
  font-size:.72rem;font-weight:850;cursor:pointer;
  transition:all .2s;white-space:nowrap;
  backdrop-filter:blur(12px);
}
.chip:hover{border-color:rgba(219,39,119,.4);color:var(--text)}
.chip:active{transform:scale(.95)}
.chip.active{
  background:var(--brand-grad);color:#fff;
  border-color:transparent;
  box-shadow:0 6px 14px rgba(219,39,119,.3);
}
.chip .chip-count{
  font-size:.6rem;background:rgba(168,50,214,.14);
  color:var(--primary);padding:0 6px;border-radius:8px;
  font-weight:900;min-width:14px;text-align:center;
}
.chip.active .chip-count{background:rgba(255,255,255,.28);color:#fff}

.search-wrap{position:relative;margin-bottom:12px}
.search-input{
  width:100%;padding:13px 46px 13px 16px;border-radius:14px;
  border:1.5px solid var(--border);background:var(--surface);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  color:var(--text);font-family:inherit;font-size:.88rem;font-weight:700;
  outline:none;transition:border-color .25s;box-shadow:var(--shadow-sm);
}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--brand-grad-soft)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;fill:none;stroke:var(--text-muted);
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
}

.filter-count{
  font-size:.72rem;font-weight:800;color:var(--text-muted);
  margin:0 4px 12px;
}

.edu-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.edu-card{
  background:var(--surface);backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1.5px solid var(--border);border-radius:16px;
  padding:14px;cursor:pointer;transition:all .22s;
  display:flex;align-items:flex-start;gap:12px;
  box-shadow:var(--shadow-sm);width:100%;text-align:right;
  font-family:inherit;position:relative;overflow:hidden;
  animation:cardIn .35s ease-out;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.edu-card::before{
  content:"";position:absolute;top:0;right:0;width:3px;height:100%;
  background:var(--brand-grad);border-radius:0 16px 16px 0;opacity:.85;
}
.edu-card.read::before{opacity:.3}
.edu-card:active{transform:scale(.99)}
.edu-card:hover{border-color:rgba(219,39,119,.45);box-shadow:var(--shadow-md)}
.edu-icon{
  width:50px;height:50px;border-radius:14px;flex:0 0 50px;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-grad);
  box-shadow:0 8px 20px rgba(219,39,119,.35);
  position:relative;
}
.edu-icon::after{
  content:"";position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 60%);
  pointer-events:none;
}
.edu-icon svg{
  width:26px;height:26px;fill:none;stroke:#fff;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  position:relative;z-index:1;
}
.edu-body{flex:1;min-width:0}
.edu-cat{
  display:inline-block;font-size:.6rem;font-weight:900;
  padding:2px 9px;border-radius:10px;
  background:var(--brand-grad-soft);color:var(--primary);
  border:1px solid var(--border);
  margin-bottom:5px;
}
.edu-title{
  font-size:.92rem;font-weight:900;color:var(--text);
  line-height:1.5;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.edu-excerpt{
  font-size:.76rem;font-weight:700;color:var(--text-muted);
  line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.edu-type-row{
  display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap;
  font-size:.65rem;font-weight:900;
}
.edu-type-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:12px;
  background:var(--brand-grad);color:#fff;
  box-shadow:0 4px 10px rgba(219,39,119,.25);
}
.edu-type-badge svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.edu-type-badge.video svg{fill:currentColor;stroke:none}
.edu-duration,.edu-time{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:12px;
  background:var(--brand-grad-soft);color:var(--primary);
  border:1px solid var(--border);
}
.edu-duration svg,.edu-time svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

.edu-card-actions{
  display:flex;flex-direction:column;gap:6px;align-items:center;flex:0 0 auto;
}
.edu-bookmark{
  width:36px;height:36px;border-radius:11px;
  background:transparent;border:1.5px solid var(--border);
  color:var(--text-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;transition:all .2s;
  backdrop-filter:blur(8px);
}
.edu-bookmark:hover{border-color:rgba(219,39,119,.5);color:var(--primary)}
.edu-bookmark:active{transform:scale(.9)}
.edu-bookmark.active{
  background:var(--brand-grad);color:#fff;border-color:transparent;
  box-shadow:0 6px 14px rgba(219,39,119,.35);
}
.edu-bookmark svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.edu-bookmark.active svg{fill:currentColor}
.edu-read-badge{
  width:36px;height:36px;border-radius:11px;
  background:rgba(16,185,129,.12);color:var(--green);
  border:1.5px solid rgba(16,185,129,.3);
  display:none;align-items:center;justify-content:center;
}
.edu-card.read .edu-read-badge{display:flex}
.edu-read-badge svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.modal{
  position:fixed;inset:0;background:rgba(15,8,20,.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:5000;padding:15px;
}
.modal.show{display:flex;animation:mFade .25s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  background:var(--surface-solid);border:1px solid var(--border);
  border-radius:26px 26px 20px 20px;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  animation:mSlide .3s ease;box-shadow:0 -10px 55px rgba(219,39,119,.28);
}
@keyframes mSlide{from{transform:translateY(45px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:44px;height:4px;border-radius:10px;margin:0 auto 14px;background:var(--text-muted);opacity:.25}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid var(--border);gap:10px;
}
.modal-head-text{flex:1;min-width:0}
.modal-badge{
  display:inline-block;font-size:.64rem;font-weight:900;
  padding:4px 12px;border-radius:20px;background:var(--brand-grad);
  color:#fff;margin-bottom:8px;box-shadow:0 4px 12px rgba(219,39,119,.32);
}
.modal-q{font-size:.98rem;font-weight:900;color:var(--text);line-height:1.7}
.modal-close{
  width:38px;height:38px;border-radius:13px;background:var(--surface);
  border:1px solid var(--border);color:var(--text-soft);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 38px;
}
.modal-close:active{transform:scale(.9)}
.modal-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.font-ctrl{
  display:flex;align-items:center;gap:6px;justify-content:flex-end;
  margin-bottom:10px;padding-bottom:10px;
  border-bottom:1px dashed var(--border);
}
.font-ctrl-label{
  font-size:.68rem;font-weight:800;color:var(--text-muted);
  display:flex;align-items:center;gap:5px;margin-left:auto;
}
.font-ctrl-label svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.font-btn{
  width:32px;height:32px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-soft);font-family:inherit;
  font-size:.9rem;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;transition:all .2s;
}
.font-btn:hover{color:var(--primary);border-color:rgba(219,39,119,.5)}
.font-btn:active{transform:scale(.9)}

.modal-content-wrap{
  background:var(--brand-grad-soft);border:1px solid var(--border);
  border-radius:16px;padding:16px;margin-top:6px;
}
.answer-text{
  line-height:2.15;color:var(--text);font-weight:650;
  white-space:pre-line;transition:font-size .2s;
}
.answer-text[data-size="sm"]{font-size:.82rem}
.answer-text[data-size="md"]{font-size:.9rem}
.answer-text[data-size="lg"]{font-size:1rem}
.answer-text[data-size="xl"]{font-size:1.1rem}

.video-cta{
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#ef4444,#dc2626);
  border-radius:16px;padding:14px;margin-bottom:12px;
  color:#fff;cursor:pointer;transition:transform .2s;
  box-shadow:0 10px 26px rgba(220,38,38,.38);
  border:0;font-family:inherit;width:100%;text-align:right;
  position:relative;overflow:hidden;
}
.video-cta::before{
  content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-22deg);animation:shine 4s ease-in-out infinite;pointer-events:none;
}
@keyframes shine{0%,55%{left:-60%}80%,100%{left:130%}}
.video-cta:active{transform:scale(.97)}
.video-cta-icon{
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.22);
  border:2px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;flex:0 0 50px;
  position:relative;z-index:1;
}
.video-cta-icon svg{width:22px;height:22px;fill:#fff;stroke:#fff;margin-right:-3px}
.video-cta-text{flex:1;position:relative;z-index:1}
.video-cta-title{font-size:.94rem;font-weight:900;margin-bottom:3px}
.video-cta-sub{font-size:.68rem;font-weight:700;opacity:.95;line-height:1.6}
.video-cta-arrow{
  width:22px;height:22px;flex:0 0 22px;
  fill:none;stroke:#fff;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);position:relative;z-index:1;
}

.action-bar{
  display:flex;gap:4px;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);flex-wrap:wrap;
}
.act-btn{
  width:40px;height:40px;border-radius:11px;
  background:transparent;border:1px solid transparent;
  color:var(--text-muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .18s;
}
.act-btn:hover{background:var(--brand-grad-soft);border-color:var(--border);color:var(--primary)}
.act-btn:active{transform:scale(.88)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act-btn.speaking{color:var(--primary);background:var(--brand-grad-soft);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.related-section{margin-top:18px;padding-top:14px;border-top:1.5px solid var(--border)}
.related-title{
  display:flex;align-items:center;gap:8px;
  font-size:.82rem;font-weight:900;color:var(--text);
  margin-bottom:10px;
}
.related-title::before{
  content:"";width:3px;height:16px;border-radius:2px;
  background:var(--brand-grad);
  box-shadow:0 0 10px rgba(219,39,119,.5);
}
.related-list{display:flex;flex-direction:column;gap:8px}
.related-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:all .2s;text-align:right;
  font-family:inherit;
}
.related-item:hover{border-color:rgba(219,39,119,.4);background:var(--brand-grad-soft)}
.related-item:active{transform:scale(.98)}
.related-icon{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:var(--brand-grad);display:flex;
  align-items:center;justify-content:center;
}
.related-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.related-text{
  flex:1;min-width:0;font-size:.78rem;font-weight:800;color:var(--text);
  line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

.loader,.empty{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);font-size:.88rem;font-weight:700;line-height:2;
}
.loader::before{
  content:"";display:block;width:32px;height:32px;
  border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.bottom-nav{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:640px;z-index:1000;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;
  gap:4px;align-items:center;background:var(--nav-bg);
  border-top:1px solid rgba(255,255,255,.18);border-radius:26px 26px 0 0;
  box-shadow:0 -10px 28px rgba(225,29,72,.14),0 -24px 55px rgba(168,85,247,.10),inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(55px) saturate(220%);
  -webkit-backdrop-filter:blur(55px) saturate(220%);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:0 -10px 28px rgba(0,0,0,.55),0 -24px 55px rgba(219,39,119,.14);
}
.nav-item{
  min-height:56px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;position:relative;
  color:var(--text-muted);text-decoration:none;
  border-radius:14px;font-size:.56rem;font-weight:850;
  transition:color .2s ease,background .2s ease;padding:6px 2px;
}
.nav-item svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item:active{transform:scale(.92)}
.nav-item.active{color:var(--primary)}
.nav-fab-wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
.nav-fab{
  position:absolute;top:-30px;width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-grad);
  box-shadow:0 14px 32px rgba(225,29,72,.48),0 6px 16px rgba(168,85,247,.35);
  cursor:pointer;text-decoration:none;
  border:4px solid var(--surface-solid);
  transition:transform .25s ease;z-index:10;
}
.nav-fab:active{transform:scale(.92)}
.nav-fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nav-fab-label{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  font-size:.56rem;font-weight:900;color:var(--primary);white-space:nowrap;
}

.toast{
  position:fixed;bottom:calc(108px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--brand-grad);color:#fff;padding:12px 22px;border-radius:30px;
  font-size:.82rem;font-weight:900;z-index:7000;opacity:0;
  transition:all .3s;pointer-events:none;
  box-shadow:0 14px 38px rgba(219,39,119,.42);
  max-width:90vw;text-align:center;white-space:pre-line;line-height:1.7;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:380px){
  .app{padding:0 12px}
  .page-title{font-size:.95rem}
  .hero{padding:16px;border-radius:22px}

  .edu-card-actions{gap:4px}
  .edu-bookmark,.edu-read-badge{width:32px;height:32px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

/* THEME */
function getSystemTheme(){
  try{ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  catch(e){ return 'light'; }
}
function getSavedTheme(){
  try{
    var t = localStorage.getItem(THEME_KEY);
    if(t === 'dark' || t === 'light') return t;
  }catch(e){}
  return getSystemTheme();
}
function applyTheme(){
  var t = getSavedTheme();
  document.documentElement.setAttribute('data-theme', t);
  document.body.classList.toggle('dark', t === 'dark');
  var meta = document.getElementById('themeMeta');
  if(meta) meta.setAttribute('content', t === 'dark' ? '#000000' : '#db2777');
}
applyTheme();

var ICONS = {

  prayer: '<svg viewBox="0 0 24 24"><path d="M12 2L8 6h8z"/><path d="M4 10h16v12H4z"/><path d="M8 22v-6h8v6"/></svg>',

  'ورزش': 'dumbbell','سلامت': 'medical'
};

  if(type === 'video'){
    return '<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';

}
function getTypeLabel(type){
  if(type === 'video') return 'ویدیو';
  return 'مقاله';
}
function getItemIcon(item){
  if(item.icon && ICONS[item.icon]) return ICONS[item.icon];
  if(item.category && CATEGORY_ICONS[item.category]){
    var key = CATEGORY_ICONS[item.category];
    if(ICONS[key]) return ICONS[key];
  }
  return ICONS.book;
}
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function faNum(n){ return String(n).replace(/\d/g,function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
function showMsg(msg,dur){
  dur=dur||2200;
  var t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },dur);
}

function loadBookmarks(){
  try{
    var raw = localStorage.getItem(BOOKMARKS_KEY);
    bookmarks = raw ? JSON.parse(raw) : {};
    if(typeof bookmarks !== 'object' || bookmarks === null) bookmarks = {};
  }catch(e){ bookmarks = {}; }
}
function saveBookmarks(){
  try{ localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(bookmarks)); }catch(e){}
}
function toggleBookmark(id){
  if(bookmarks[id]) delete bookmarks[id];
  else bookmarks[id] = true;
  saveBookmarks();
}
function isBookmarked(id){ return !!bookmarks[id]; }

function loadRead(){
  try{
    var raw = localStorage.getItem(READ_KEY);
    readItems = raw ? JSON.parse(raw) : {};
    if(typeof readItems !== 'object' || readItems === null) readItems = {};
  }catch(e){ readItems = {}; }
}
function saveRead(){
  try{ localStorage.setItem(READ_KEY, JSON.stringify(readItems)); }catch(e){}
}
function markRead(id){
  if(!readItems[id]){
    readItems[id] = true;
    saveRead();
    updateProgress();
  }
}
function isRead(id){ return !!readItems[id]; }

function getFontSize(){
  try{
    var s = localStorage.getItem(FONT_KEY);
    if(s && ['sm','md','lg','xl'].indexOf(s) > -1) return s;
  }catch(e){}
  return 'md';
}
function setFontSize(s){
  try{ localStorage.setItem(FONT_KEY, s); }catch(e){}
}
var FONT_SIZES = ['sm','md','lg','xl'];
function changeFontSize(dir){
  var cur = getFontSize();
  var idx = FONT_SIZES.indexOf(cur);
  if(dir === '+') idx = Math.min(FONT_SIZES.length - 1, idx + 1);
  else idx = Math.max(0, idx - 1);
  var next = FONT_SIZES[idx];
  setFontSize(next);
  applyFontSize();
}
function applyFontSize(){
  var el = $('modalContent');
  if(el) el.setAttribute('data-size', getFontSize());
}

function fetchJSON(path){
  return fetch(path).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}
function normalizeItem(a, idx){
  if(!a) return null;
  var id = a.id || ('ed_'+(idx+1));
  var type = a.type || 'article';
  return {
    id: String(id), type: type,
    title: a.title || '', excerpt: a.excerpt || '',
    category: a.category || '', icon: a.icon || '',
    content: a.content || '', videoUrl: a.videoUrl || '',
    duration: a.duration || '',
    tags: Array.isArray(a.tags) ? a.tags : [],
    source: a.source || ''
  };
}
function extractItems(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.articles)) return data.articles;
  if(Array.isArray(data.items)) return data.items;
  if(Array.isArray(data.list)) return data.list;
  if(Array.isArray(data.data)) return data.data;
  return [];
}
function loadEducation(){
  return fetchJSON(EDUCATION_PATH)
    .then(function(data){
      var arr = extractItems(data);
      allItems = arr.map(normalizeItem).filter(Boolean);
      updateCounts(); renderChips(); renderItems(); updateProgress();
      return allItems;
    })
    .catch(function(err){
      console.warn('education.json:', err.message);
      allItems = [];
      var list = $('eduList');
      if(list){
        list.innerHTML = '<div class="empty">هنوز محتوایی اضافه نشده<br><br><span style="font-size:.85rem;opacity:.8">فایل: <strong>data/education/education.json</strong></span></div>';
      }
      var cnt = $('filterCount'); if(cnt) cnt.textContent = '۰ آموزش';
      return [];
    });
}
function updateCounts(){
  var counts = { all: allItems.length, video: 0, article: 0, bookmarks: 0 };
  allItems.forEach(function(i){
    counts[i.type] = (counts[i.type] || 0) + 1;
    if(isBookmarked(i.id)) counts.bookmarks++;
  });
  var elAll = $('countAll'); if(elAll) elAll.textContent = faNum(counts.all);
  var elV = $('countVideo'); if(elV) elV.textContent = faNum(counts.video);
  var elA = $('countArticle'); if(elA) elA.textContent = faNum(counts.article);
  var elB = $('countBookmarks'); if(elB) elB.textContent = faNum(counts.bookmarks);
}
function updateProgress(){
  var total = allItems.length;
  if(total === 0){
    var pc = $('progressCard'); if(pc) pc.style.display = 'none';
    return;
  }
  var read = 0;
  allItems.forEach(function(i){ if(isRead(i.id)) read++; });
  var pct = Math.round((read / total) * 100);
  var pc2 = $('progressCard');
  if(pc2) pc2.style.display = 'block';
  var pv = $('progressValue'); if(pv) pv.textContent = faNum(pct) + '٪';
  var pf = $('progressFill'); if(pf) pf.style.width = pct + '%';
}

function renderChips(){
  var wrap = $('chipsWrap');
  if(!wrap) return;
  var catCounts = {};
  allItems.forEach(function(i){
    if(i.category) catCounts[i.category] = (catCounts[i.category] || 0) + 1;
  });
  var cats = Object.keys(catCounts).sort();
  if(cats.length === 0){ wrap.innerHTML = ''; return; }
  var html = '<button class="chip' + (currentCategory === 'all' ? ' active' : '') + '" data-cat="all" type="button">همه دسته‌ها</button>';
  cats.forEach(function(c){
    html += '<button class="chip' + (currentCategory === c ? ' active' : '') + '" data-cat="' + escapeHtml(c) + '" type="button">' +
      escapeHtml(c) +
      '<span class="chip-count">' + faNum(catCounts[c]) + '</span>' +
    '</button>';
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentCategory = btn.getAttribute('data-cat');
      renderChips();
      renderItems();
    });
  });
}

function setupTabs(){
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentTab = tab.getAttribute('data-tab');
      renderItems();
      if (window.bnAnalytics) window.bnAnalytics.track('edu_tab', { tab: currentTab });
    });
  });
}

function estimateReadTime(text){
  if(!text) return '۱ دقیقه';
  var words = text.split(/\s+/).length;
  var minutes = Math.max(1, Math.ceil(words / 180));
  return faNum(minutes) + ' دقیقه';
}

function renderItems(){
  var list = $('eduList');
  if(!list) return;
  var items = allItems.slice();

  if(currentTab === 'article') items = items.filter(function(i){ return i.type === 'article'; });
  else if(currentTab === 'video') items = items.filter(function(i){ return i.type === 'video'; });
  else if(currentTab === 'bookmarks') items = items.filter(function(i){ return isBookmarked(i.id); });

  if(currentCategory !== 'all'){
    items = items.filter(function(i){ return i.category === currentCategory; });
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase().trim();
    items = items.filter(function(i){
      return i.title.toLowerCase().indexOf(q) > -1 ||
             i.excerpt.toLowerCase().indexOf(q) > -1 ||
             i.content.toLowerCase().indexOf(q) > -1 ||
             i.category.toLowerCase().indexOf(q) > -1 ||
             i.tags.some(function(t){ return String(t).toLowerCase().indexOf(q) > -1; });
    });
  }

  var cnt = $('filterCount');
  if(cnt) cnt.textContent = faNum(items.length) + ' آموزش';

  if(items.length === 0){
    var msg = 'محتوایی یافت نشد';
    if(currentTab === 'bookmarks') msg = 'هنوز آموزشی را نشان نکرده‌اید';
    else if(searchQuery) msg = 'برای «' + escapeHtml(searchQuery) + '» نتیجه‌ای یافت نشد';
    list.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }

  var html = '';
  items.forEach(function(i){
    var typeLabel = getTypeLabel(i.type);
    var typeIcon = getTypeIcon(i.type);
    var itemIcon = getItemIcon(i);
    var badgeClass = i.type === 'video' ? 'edu-type-badge video' : 'edu-type-badge';
    var readClass = isRead(i.id) ? ' read' : '';
    var bookmarkClass = isBookmarked(i.id) ? ' active' : '';
    var readTime = estimateReadTime(i.content || i.excerpt);

    html += '<div class="edu-card' + readClass + '" data-id="' + escapeHtml(i.id) + '" role="button" tabindex="0">' +
      '<div class="edu-icon">' + itemIcon + '</div>' +
      '<div class="edu-body">' +
        (i.category ? '<span class="edu-cat">' + escapeHtml(i.category) + '</span>' : '') +
        '<div class="edu-title">' + escapeHtml(i.title) + '</div>' +
        '<div class="edu-excerpt">' + escapeHtml(i.excerpt) + '</div>' +
        '<div class="edu-type-row">' +
          '<span class="' + badgeClass + '">' + typeIcon + escapeHtml(typeLabel) + '</span>' +
          (i.duration && i.type === 'video'
            ? '<span class="edu-duration"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' + escapeHtml(i.duration) + '</span>'
            : '<span class="edu-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' + readTime + '</span>') +
        '</div>' +
      '</div>' +
      '<div class="edu-card-actions">' +
        '<button class="edu-bookmark' + bookmarkClass + '" data-bm="' + escapeHtml(i.id) + '" type="button" aria-label="نشان‌گذاری">' +
          '<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>' +
        '</button>' +
        '<div class="edu-read-badge">' +
          '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</div>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.edu-card').forEach(function(card){
    card.addEventListener('click', function(e){
      if(e.target.closest('.edu-bookmark')) return;
      openItem(card.getAttribute('data-id'));
    });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openItem(card.getAttribute('data-id')); }
    });
  });
  list.querySelectorAll('.edu-bookmark').forEach(function(bm){
    bm.addEventListener('click', function(e){
      e.stopPropagation();
      var id = bm.getAttribute('data-bm');
      toggleBookmark(id);
      bm.classList.toggle('active');
      updateCounts();
      if(currentTab === 'bookmarks') renderItems();
    });
  });
}

function openItem(id){
  var item = null;
  for(var i=0; i<allItems.length; i++){
    if(allItems[i].id === id){ item = allItems[i]; break; }
  }
  if(!item) return;
  currentItem = item;

  $('modalBadge').textContent = getTypeLabel(item.type) + (item.category ? ' • ' + item.category : '');
  $('modalTitle').textContent = item.title;

  var mediaEl = $('modalMedia');
  mediaEl.innerHTML = '';
  if(item.type === 'video' && item.videoUrl){
    var videoBtn = document.createElement('button');
    videoBtn.type = 'button';
    videoBtn.className = 'video-cta';
    videoBtn.innerHTML =
      '<div class="video-cta-icon">' +
        '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>' +
      '</div>' +
      '<div class="video-cta-text">' +
        '<div class="video-cta-title">تماشای ویدیو در یوتیوب</div>' +
        '<div class="video-cta-sub">' + (item.duration ? 'مدت: ' + item.duration + ' • ' : '') + 'با کلیک، به یوتیوب منتقل می‌شوی' + '</div>' +
      '</div>' +
      '<svg class="video-cta-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
    videoBtn.addEventListener('click', function(){
      window.open(item.videoUrl, '_blank', 'noopener');
      if (window.bnAnalytics) window.bnAnalytics.track('edu_video_click', { id: item.id });
    });
    mediaEl.appendChild(videoBtn);
  }

  $('modalContent').textContent = item.content || item.excerpt || '';
  applyFontSize();

  var mb = $('modalBookmarkBtn');
  if(mb) mb.classList.toggle('active', isBookmarked(item.id));
  var mr = $('modalReadBtn');
  if(mr) mr.classList.toggle('speaking', isRead(item.id));

  renderRelated(item);

  $('eduModal').classList.add('show');
  setTimeout(function(){ markRead(item.id); }, 800);
  setTimeout(function(){ renderItems(); }, 900);

  if (window.bnAnalytics) window.bnAnalytics.track('edu_open', { id: item.id, type: item.type });
}

function renderRelated(item){
  var wrap = $('relatedSection');
  var list = $('relatedList');
  if(!wrap || !list) return;
  var related = allItems.filter(function(i){
    if(i.id === item.id) return false;
    if(item.category && i.category === item.category) return true;
    if(item.tags && i.tags.length){
      return i.tags.some(function(t){ return item.tags.indexOf(t) > -1; });
    }
    return false;
  }).slice(0, 3);
  if(related.length === 0){
    wrap.style.display = 'none';
    return;
  }
  var html = '';
  related.forEach(function(r){
    var icon = getItemIcon(r);
    html += '<button class="related-item" data-rid="' + escapeHtml(r.id) + '" type="button">' +
      '<div class="related-icon">' + icon + '</div>' +
      '<div class="related-text">' + escapeHtml(r.title) + '</div>' +
    '</button>';
  });
  list.innerHTML = html;
  list.querySelectorAll('.related-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      var rid = btn.getAttribute('data-rid');
      closeModal();
      setTimeout(function(){ openItem(rid); }, 260);
    });
  });
  wrap.style.display = 'block';
}

function closeModal(){
  stopSpeech();
  $('eduModal').classList.remove('show');
  $('modalMedia').innerHTML = '';
  currentItem = null;
}

function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showMsg('متن کپی شد ✓'); }
  catch(e){ showMsg('کپی نشد'); }
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg('متن کپی شد ✓'); })
      .catch(function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function shareText(text,title){
  if(!text) return;
  if(navigator.share){
    navigator.share({title:title||'بانوان نور',text:text}).catch(function(){});
  } else { copyText(text); showMsg('متن کپی شد'); }
}
function findPersianVoice(){
  if(!('speechSynthesis' in window)) return null;
  try{
    var voices = window.speechSynthesis.getVoices() || [];
    for(var i=0;i<voices.length;i++){
      var l = (voices[i].lang||'').toLowerCase();
      if(l === 'fa-ir' || l === 'fa_ir') return voices[i];
    }
    for(i=0;i<voices.length;i++){
      l = (voices[i].lang||'').toLowerCase();
      if(l.indexOf('fa') === 0) return voices[i];
    }
  }catch(e){}
  return null;
}
function speakText(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window)){ showMsg('خواندن صوتی پشتیبانی نمی‌شود'); return; }
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    if(speechBtn === btn){ speechBtn = null; return; }
  }
  var faVoice = findPersianVoice();
  if(!faVoice){
    showMsg('🔇 صدای فارسی روی این دستگاه نصب نیست\nتنظیمات گوشی → Text-to-Speech', 4000);
    return;
  }
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang='fa-IR'; utt.voice=faVoice; utt.rate=0.95; utt.pitch=1;
  if(btn){ btn.classList.add('speaking'); speechBtn = btn; }
  utt.onend = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  utt.onerror = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  window.speechSynthesis.speak(utt);
}
function stopSpeech(){
  try{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    speechBtn = null;
  }catch(e){}
}

function setupModalActions(){
  var bar = document.querySelector('#eduModal .action-bar');
  if(bar){
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('[data-edu-act]');
      if(!btn || !currentItem) return;
      var act = btn.getAttribute('data-edu-act');

      if(act === 'bookmark'){
        toggleBookmark(currentItem.id);
        btn.classList.toggle('active', isBookmarked(currentItem.id));
        updateCounts();
        renderItems();
        showMsg(isBookmarked(currentItem.id) ? 'نشان شد 🔖' : 'نشان حذف شد');
        if (window.bnAnalytics) window.bnAnalytics.track('edu_bookmark', { id: currentItem.id });
        return;
      }
      if(act === 'read'){
        if(isRead(currentItem.id)){
          delete readItems[currentItem.id];
          saveRead();
          updateProgress();
          btn.classList.remove('speaking');
          showMsg('از خوانده‌شده‌ها حذف شد');
        } else {
          markRead(currentItem.id);
          btn.classList.add('speaking');
          showMsg('به عنوان خوانده‌شده ثبت شد ✓');
        }
        renderItems();
        return;
      }

      var fullText = (currentItem.title ? currentItem.title + '\n\n' : '') + (currentItem.content || '');
      var shareUrl = (currentItem.type === 'video') ? currentItem.videoUrl : '';
      if(act === 'copy') copyText(fullText);
      else if(act === 'share'){
        var st = fullText + (shareUrl ? '\n\n🎬 ' + shareUrl : '') + '\n\n— بانوان نور';
        shareText(st, 'بانوان نور');
      }
      else if(act === 'speak') speakText((currentItem.title ? currentItem.title + '. ' : '') + (currentItem.content || ''), btn);
    });
  }
  document.querySelectorAll('.font-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var dir = btn.getAttribute('data-font');
      changeFontSize(dir);
      var cur = getFontSize();
      var labels = {sm:'کوچک',md:'متوسط',lg:'بزرگ',xl:'بزرگ‌تر'};
      showMsg('اندازه متن: ' + labels[cur]);
    });
  });
  var closeBtn = $('modalClose');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  var modal = $('eduModal');
  if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('eduModal').classList.contains('show')) closeModal();
  });
}

function setupSearch(){
  var si = $('searchInput');
  if(!si) return;
  var timer = null;
  si.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      searchQuery = si.value || '';
      renderItems();
    }, 180);
  });
}

function init(){
  loadBookmarks();
  loadRead();
  setupTabs();
  setupSearch();
  setupModalActions();
  loadEducation();

  window.addEventListener('storage', function(e){
    if(e.key === THEME_KEY) applyTheme();
    if(e.key === 'bn_lang') location.reload();
  });

  try{ if('speechSynthesis' in window) window.speechSynthesis.getVoices(); }catch(e){}

  console.log('📚 صفحه آموزش v3 آماده ✅');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else init();

})();
</script>
