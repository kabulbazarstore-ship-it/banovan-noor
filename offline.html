<!doctype html>
<html lang="fa" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#db2777"><title>حالت بدون اینترنت | بانوان نور</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.offline{max-width:440px;text-align:center;background:var(--surface,rgba(255,255,255,.8));border:1px solid var(--border,rgba(219,39,119,.2));border-radius:24px;padding:28px;box-shadow:0 12px 36px #8b5cf622}.offline h1{font-size:1.35rem}.offline p{line-height:1.9;color:var(--text-muted,#776b80)}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions a,.actions button{padding:11px 16px;border-radius:13px;background:#db2777;color:white;font:inherit;text-decoration:none;border:0}.actions a.secondary{background:transparent;color:inherit;border:1px solid #db277755}</style></head><body><main class="offline"><h1>اتصال اینترنت در دسترس نیست</h1><p>ممکن است بعضی صفحه‌ها هنوز روی این دستگاه ذخیره نشده باشند. می‌توانی دوباره تلاش کنی یا یکی از بخش‌های ذخیره‌شده را باز کنی.</p><div class="actions"><button onclick="location.reload()">تلاش دوباره</button><a class="secondary" href="index.html">صفحه آغاز</a><a class="secondary" href="calendar.html">تقویم</a></div></main><script>try{var t=localStorage.getItem('bn_theme');if(t==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script></body></html>
