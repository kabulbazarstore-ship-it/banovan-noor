<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="احکام بانوان — مرکز احکام شرعی بر اساس مذهب و مرجع تقلید">
<title>احکام | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">

<script>
(function(){
  try{
    var t = localStorage.getItem('bn_theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#fdf5ff;--bg-soft:#f6e9ff;
  --surface:rgba(255,255,255,.80);--surface-solid:#fff;
  --text:#2a1740;--text-soft:#5f4a77;--text-muted:#9686a8;

  --primary:#a832d6;--primary-2:#c026d3;--pink:#ec4899;

  --border:rgba(168,50,214,.14);
  --shadow-sm:0 6px 20px rgba(168,50,214,.08);
  --shadow-md:0 14px 34px rgba(168,50,214,.15);
  --shadow-fab:0 14px 36px rgba(219,39,119,.50);

  --nav-bg:rgba(255,255,255,.68);

  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.13),rgba(168,85,247,.10));

  --ig-grad:var(--brand-grad);
  --ig-grad-anim:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --gradient-soft:var(--brand-grad-soft);

  --tab-bg:rgba(168,50,214,.10);
}

html[data-theme="dark"],
body.dark{
  --bg:#000;--bg-soft:#000;
  --surface:rgba(28,28,30,.70);--surface-solid:#1c1c1e;
  --text:#fff;--text-soft:#e4e6eb;--text-muted:#8e8e93;
  --primary:#c084fc;--primary-2:#d8b4fe;--pink:#ec4899;
  --border:rgba(192,132,252,.16);
  --shadow-sm:0 6px 20px rgba(0,0,0,.45);
  --shadow-md:0 14px 34px rgba(0,0,0,.55);
  --shadow-fab:0 14px 36px rgba(219,39,119,.55);
  --nav-bg:rgba(15,10,22,.68);

  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.18),rgba(168,85,247,.14));
  --ig-grad:var(--brand-grad);
  --ig-grad-anim:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --gradient-soft:var(--brand-grad-soft);

  --tab-bg:#1c1c1e;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}
body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;
  direction:rtl;color:var(--text);
  background:
    radial-gradient(circle at 8% 0%,rgba(236,72,153,.15),transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(168,85,247,.17),transparent 32%),
    linear-gradient(160deg,var(--bg),var(--bg-soft));
  min-height:100vh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}

/* ✅ پشتیبانی از LTR */
body.lang-ltr { direction: ltr; }
body.lang-ltr .back-btn svg,
body.lang-ltr .audio-cta-arrow,
body.lang-ltr .section-arrow,
body.lang-ltr .item-row .arrow { transform: none; }
body.lang-ltr .audio-cta::before { right: auto; left: 0; border-radius: 20px 0 0 20px; }
body.lang-ltr .item-row { padding: 12px 22px 12px 16px; }
body.lang-ltr .item-row .arrow { transform: scaleX(-1); }

.app{width:100%;max-width:640px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

.topbar{
  display:flex;align-items:center;gap:10px;
  padding:18px 0 14px;
  position:sticky;top:0;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
  z-index:50;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:linear-gradient(to bottom,#000 70%,transparent)}
.back-btn{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;flex:0 0 42px;
}
.back-btn:active{transform:scale(.9)}
.back-btn svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);
}
.page-title{flex:1;font-size:1.05rem;font-weight:900}
.icon-btn-mini{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 42px;text-decoration:none;
}
.icon-btn-mini:active{transform:scale(.9)}
.icon-btn-mini svg{
  width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.hero-banner{
  border-radius:22px;padding:18px 20px;
  margin-bottom:16px;color:#fff;
  background:var(--ig-grad-anim);
  background-size:200% 100%;
  box-shadow:
    0 18px 42px rgba(219,39,119,.40),
    0 8px 22px rgba(168,85,247,.30);
  animation:heroGrad 7s ease infinite;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
@keyframes heroGrad{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.hero-banner::before{
  content:"";position:absolute;
  width:200px;height:200px;top:-110px;left:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);
  pointer-events:none;
}
.hero-icon{
  width:54px;height:54px;border-radius:17px;
  background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 54px;
  position:relative;z-index:1;
}
.hero-icon svg{
  width:28px;height:28px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.hero-text-wrap{flex:1;min-width:0;position:relative;z-index:1}
.hero-title{font-size:1.05rem;font-weight:900;line-height:1.4;margin-bottom:4px;color:#fff}
.hero-sub{font-size:.7rem;line-height:1.7;opacity:.92;font-weight:600;color:rgba(255,255,255,.95)}

.tabs{
  display:flex;gap:6px;
  background:var(--tab-bg);
  border:1.5px solid var(--border);
  border-radius:18px;
  padding:6px;margin-bottom:16px;
}
.tab-btn{
  flex:1;background:transparent;border:0;
  color:var(--text-soft);
  border-radius:13px;padding:13px 10px;
  font-family:inherit;font-size:.88rem;font-weight:900;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .25s ease;
}
.tab-btn svg{
  width:17px;height:17px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.tab-btn.active{
  background:var(--ig-grad);color:#fff;
  box-shadow:0 6px 18px rgba(219,39,119,.35);
}
.tab-btn.active svg{stroke:#fff}
.tab-btn:active{transform:scale(.97)}

.audio-cta{
  display:flex;align-items:center;gap:13px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:20px;
  padding:14px 16px;margin-bottom:14px;
  cursor:pointer;text-align:right;
  font-family:inherit;color:inherit;
  width:100%;text-decoration:none;
  box-shadow:var(--shadow-sm);
  transition:all .25s;
  position:relative;overflow:hidden;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.audio-cta:active{transform:scale(.98)}
.audio-cta::before{
  content:"";position:absolute;
  top:0;right:0;width:5px;height:100%;
  background:var(--ig-grad);
  border-radius:0 20px 20px 0;
}
.audio-cta-icon{
  width:50px;height:50px;border-radius:15px;
  background:var(--ig-grad);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 50px;
  box-shadow:0 6px 16px rgba(219,39,119,.30);
}
.audio-cta-icon svg{
  width:25px;height:25px;fill:none;stroke:#fff;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.audio-cta-info{flex:1;min-width:0}
.audio-cta-title{font-size:.92rem;font-weight:900;color:var(--text);margin-bottom:3px}
.audio-cta-sub{font-size:.7rem;color:var(--text-muted);font-weight:700}
.audio-cta-arrow{
  width:20px;height:20px;fill:none;stroke:var(--text-muted);
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);flex:0 0 20px;
}

.info-bar{
  background:var(--surface);
  border:1.5px dashed var(--border);
  border-radius:16px;
  padding:12px 14px;margin-bottom:14px;
  display:none;align-items:center;gap:10px;
  font-size:.78rem;font-weight:700;color:var(--text-muted);
}
.info-bar.show{display:flex}
.info-bar svg{
  width:20px;height:20px;flex:0 0 20px;
  fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
}
.info-bar strong{color:var(--text-soft);font-weight:900}
.change-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--ig-grad);border:0;color:#fff;
  padding:8px 14px;border-radius:18px;
  font-family:inherit;font-size:.68rem;font-weight:900;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
}
.change-btn:active{transform:scale(.95)}

.marja-section{margin-bottom:16px}
.marja-header{
  display:flex;align-items:center;gap:11px;
  margin-bottom:8px;padding:0 4px;
}
.marja-header-icon{
  width:40px;height:40px;border-radius:13px;
  background:var(--ig-grad);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 40px;
  box-shadow:0 6px 14px rgba(219,39,119,.25);
}
.marja-header-icon svg{
  width:20px;height:20px;fill:none;stroke:#fff;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.marja-title{font-size:.95rem;font-weight:900;color:var(--text);line-height:1.4;margin-bottom:2px}
.marja-subtitle{font-size:.7rem;color:var(--text-muted);font-weight:700;line-height:1.6}
.marja-grid{display:grid;gap:10px;margin-top:14px}
.marja-card{
  position:relative;
  background:var(--surface);
  border:2px solid var(--border);
  border-radius:20px;padding:15px 16px;
  cursor:pointer;transition:all .3s ease;
  text-align:right;font-family:inherit;
  display:flex;align-items:center;gap:13px;
  box-shadow:var(--shadow-sm);width:100%;color:inherit;
}
.marja-card:active{transform:scale(.98)}
.marja-card.active{
  background:var(--gradient-soft);
  border-color:rgba(219,39,119,.5);
}
.marja-icon{
  width:52px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 52px;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}
.marja-icon svg{
  width:26px;height:26px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.marja-info{flex:1;min-width:0}
.marja-name{font-size:.92rem;font-weight:900;color:var(--text);margin-bottom:3px;line-height:1.4}
.marja-sub{font-size:.7rem;color:var(--text-muted);font-weight:700}

.section-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow-sm);
  margin-bottom:10px;overflow:hidden;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.section-header{
  display:flex;align-items:center;gap:11px;
  padding:14px 15px;cursor:pointer;
}
.section-header:active{background:var(--gradient-soft)}
.section-icon{
  width:44px;height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 44px;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  background:var(--sec-grad,linear-gradient(135deg,#a855f7,#6d28d9));
  position:relative;
}
.section-icon::after{
  content:"";position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 55%);
  pointer-events:none;
}
.section-icon svg{
  width:22px;height:22px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  position:relative;z-index:1;
}
.section-title-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.section-title-text{font-size:.9rem;font-weight:900;color:var(--text);line-height:1.35}
.section-subtitle{
  font-size:.65rem;color:var(--text-muted);font-weight:700;
  line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.section-count{
  font-size:.6rem;font-weight:800;
  padding:4px 10px;border-radius:20px;
  background:var(--gradient-soft);
  color:var(--primary);
  border:1px solid var(--border);flex-shrink:0;
}
.section-arrow{
  width:18px;height:18px;fill:none;
  stroke:var(--text-muted);stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);transition:transform .3s ease;
  flex:0 0 18px;
}
.section-card.open .section-arrow{transform:rotate(-90deg) scaleX(-1)}
.section-items{max-height:0;overflow:hidden;transition:max-height .4s ease}
.section-card.open .section-items{max-height:5000px}

.item-row{
  display:flex;align-items:center;gap:11px;
  padding:12px 16px 12px 22px;cursor:pointer;
  border-top:1px solid var(--border);
  transition:background .2s;
}
.item-row:active{background:var(--gradient-soft)}
.item-row::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--ig-grad);flex:0 0 6px;
}
.item-row-text{flex:1;min-width:0}
.item-row-title{font-size:.84rem;font-weight:800;color:var(--text);margin-bottom:2px;line-height:1.55}
.item-row-sub{font-size:.68rem;color:var(--text-muted);font-weight:700}
.item-row svg.arrow{
  width:16px;height:16px;flex:0 0 16px;
  fill:none;stroke:var(--text-muted);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);
}

.loader{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:50px 20px;
  color:var(--text-muted);font-size:.85rem;font-weight:700;
}
.loader::before{
  content:"";width:20px;height:20px;
  border:2.5px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{
  text-align:center;padding:50px 20px;
  color:var(--text-muted);font-size:.85rem;line-height:2;font-weight:700;
}

.content-modal{
  position:fixed;inset:0;
  background:rgba(15,8,20,.62);
  backdrop-filter:blur(10px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:5000;
}
.content-modal.show{display:flex}
.content-box{
  width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;
  background:var(--surface-solid);
  border-radius:27px 27px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
html[data-theme="dark"] .content-box,
body.dark .content-box{background:#1c1c1e}
.modal-handle{
  width:42px;height:4px;border-radius:10px;
  margin:0 auto 16px;
  background:var(--text-muted);opacity:.25;
}
.content-head{
  display:flex;align-items:flex-start;gap:11px;
  margin-bottom:16px;padding-bottom:14px;
  border-bottom:1.5px solid var(--border);
}
.content-head-text{flex:1;min-width:0}
.content-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.6rem;font-weight:900;
  padding:4px 10px;border-radius:20px;
  background:var(--gradient-soft);
  color:var(--primary);
  border:1px solid var(--border);margin-bottom:8px;
}
.content-badge svg{
  width:11px;height:11px;fill:none;stroke:currentColor;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}
.content-title{font-size:1rem;font-weight:900;color:var(--text);margin-bottom:4px;line-height:1.6}
.content-sub{font-size:.72rem;color:var(--text-muted);font-weight:700}
.content-close{
  width:38px;height:38px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 38px;
}
.content-close:active{transform:scale(.9)}
.content-close svg{
  width:18px;height:18px;fill:none;
  stroke:currentColor;stroke-width:2.5;stroke-linecap:round;
}
.content-body{
  font-size:.9rem;line-height:2.15;
  color:var(--text);font-weight:650;
  white-space:pre-line;margin-bottom:16px;
}
.content-actions{
  display:flex;gap:7px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.act-btn{
  width:40px;height:40px;border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface);color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s;
}
.act-btn:active{transform:scale(.9)}
.act-btn svg{
  width:18px;height:18px;fill:none;
  stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}

.bottom-nav{
  position:fixed;left:50%;bottom:0;
  transform:translateX(-50%);
  width:100%;max-width:640px;z-index:1000;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:1fr 1fr 78px 1fr 1fr;
  gap:4px;align-items:center;
  background:var(--nav-bg);
  border-top:1px solid rgba(255,255,255,.18);
  border-radius:26px 26px 0 0;
  box-shadow:
    0 -10px 28px rgba(225,29,72,.14),
    0 -24px 55px rgba(168,85,247,.10),
    inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(55px) saturate(220%);
  -webkit-backdrop-filter:blur(55px) saturate(220%);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:
    0 -10px 28px rgba(0,0,0,.55),
    0 -24px 55px rgba(219,39,119,.14);
}

.nav-item{
  min-height:56px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;position:relative;
  color:var(--text-muted);text-decoration:none;
  border-radius:14px;font-size:.56rem;font-weight:850;
  transition:color .2s ease,background .2s ease;
  padding:6px 2px;
}
.nav-item svg{
  width:21px;height:21px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .2s ease;
}
.nav-item.active{color:var(--primary);background:var(--gradient-soft)}
.nav-item.active svg{stroke-width:2.3}
.nav-item.active::before{
  content:"";position:absolute;top:-2px;left:50%;
  transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 5px 5px;
  background:var(--brand-grad);
}

.nav-fab-wrap{
  position:relative;
  height:100%;
  display:flex;align-items:center;justify-content:center;
}

.nav-fab{
  position:absolute;
  top:-30px;
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-grad);
  box-shadow:
    0 14px 32px rgba(225,29,72,.48),
    0 6px 16px rgba(168,85,247,.35);
  cursor:pointer;text-decoration:none;
  border:4px solid var(--surface-solid);
  transition:transform .25s ease,box-shadow .25s ease;
  z-index:10;
}
.nav-fab:active{transform:scale(.92)}
.nav-fab::before{
  content:"";position:absolute;

  background:var(--brand-grad);
  z-index:-1;
  animation:fabRipple 3s ease infinite;
  opacity:.45;
}

  0%{transform:scale(1);opacity:.45}
  100%{transform:scale(1.35);opacity:0}
}
.nav-fab svg{
  width:26px;height:26px;fill:none;stroke:#fff;
  stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;
}

.toast{
  position:fixed;left:50%;

}
.toast.show{opacity:1;transform:translate(-50%,0)}

var DEFAULT_SECTION = {
  color:"linear-gradient(135deg,#a855f7,#6d28d9)",
  desc:"",
  svg:'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>'
};
function getSectionStyle(id){ return sectionIcons[id] || DEFAULT_SECTION; }

function loadJSON(path){
  if(dataCache[path]) return Promise.resolve(dataCache[path]);
  return fetch(path)
    .then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function(data){ dataCache[path] = data; return data; })
    .catch(function(){ return null; });
}

function renderMarjaCards(){
  var container = $("ahkamContent");
  $("infoBar").classList.remove("show");
  var cardsHtml = MARJAS.map(function(m){
    return '<button class="marja-card" data-marja="' + m.id + '" type="button">' +
      '<div class="marja-icon" style="background:' + m.color + ';">' + ICON_BOOK + '</div>' +
      '<div class="marja-info">' +
        '<div class="marja-name">' + escapeHtml(m.name) + '</div>' +
        '<div class="marja-sub">' + escapeHtml(m.sub) + '</div>' +
      '</div>' +
    '</button>';
  }).join("");
  container.innerHTML =
    '<div class="marja-section">' +
      '<div class="marja-header">' +
        '<div class="marja-header-icon">' + ICON_BOOK + '</div>' +
        '<div class="marja-header-text">' +
          '<div class="marja-title">' + currentT.select_marja_title + '</div>' +
          '<div class="marja-subtitle">' + currentT.select_marja_sub + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="marja-grid">' + cardsHtml + '</div>' +
    '</div>';
  container.querySelectorAll(".marja-card").forEach(function(card){
    card.addEventListener("click", function(){
      selectMarja(card.getAttribute("data-marja"));
    });
  });
}

function selectMarja(marjaId){
  currentMarja = marjaId;
  try{ localStorage.setItem("bn_marja", marjaId); }catch(e){}
  var info = null;
  for(var i=0; i<MARJAS.length; i++){
    if(MARJAS[i].id === marjaId){ info = MARJAS[i]; break; }
  }
  if(!info) return;
  $("ahkamContent").innerHTML = '<div class="loader">' + currentT.loading + '</div>';
  loadJSON(info.file).then(function(data){
    if(!data){
      $("ahkamContent").innerHTML = '<div class="empty">' + currentT.load_error + '<br><span style="font-size:.7rem;opacity:.7;">' + info.file + '</span></div>';
      return;
    }
    currentData = data;
    currentMarjaInfo = info;
    updateInfoBar();
    renderSections(data);

    if (window.bnAnalytics) window.bnAnalytics.track('marja_selected', { marja: marjaId });
  });
}

function updateInfoBar(){
  var txt = $("infoBarText");
  var btn = $("changeMarjaBtn");
  var bar = $("infoBar");
  if(currentSchool === "hanafi"){
    txt.innerHTML = currentT.source_label + ' <strong>' + currentT.hanafi_source + '</strong>';
    btn.style.display = "none";
    bar.classList.add("show");
  } else if(currentMarjaInfo){
    txt.innerHTML = currentT.source_label + ' <strong>' + escapeHtml(currentMarjaInfo.name) + '</strong>';
    btn.style.display = "inline-flex";
    bar.classList.add("show");
  } else {
    bar.classList.remove("show");
  }
}

function renderSections(data){
  var container = $("ahkamContent");
  if(!data || !data.sections || data.sections.length === 0){
    container.innerHTML = '<div class="empty">' + currentT.no_content + '</div>';
    return;
  }
  var html = data.sections.map(function(sec){
    var style = getSectionStyle(sec.id);
    var count = (sec.items || []).length;
    var description = sec.description || style.desc || "";
    var itemsHtml = (sec.items || []).map(function(item, idx){
      return '<div class="item-row" data-section="' + sec.id + '" data-item="' + idx + '">' +
        '<div class="item-row-text">' +
          '<div class="item-row-title">' + escapeHtml(item.title) + '</div>' +
          (item.subtitle ? '<div class="item-row-sub">' + escapeHtml(item.subtitle) + '</div>' : '') +
        '</div>' +
        '<svg class="arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>' +
      '</div>';
    }).join("");
    return '<div class="section-card" data-section="' + sec.id + '">' +
      '<div class="section-header">' +
        '<div class="section-icon" style="--sec-grad:' + style.color + ';">' + style.svg + '</div>' +
        '<div class="section-title-wrap">' +
          '<div class="section-title-text">' + escapeHtml(sec.title) + '</div>' +
          (description ? '<div class="section-subtitle">' + escapeHtml(description) + '</div>' : '') +
        '</div>' +
        '<span class="section-count">' + count + '</span>' +
        '<svg class="section-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>' +
      '</div>' +
      '<div class="section-items">' + itemsHtml + '</div>' +
    '</div>';
  }).join("");
  container.innerHTML = html;
  container.querySelectorAll(".section-header").forEach(function(h){
    h.addEventListener("click", function(){
      h.parentElement.classList.toggle("open");
    });
  });
  container.querySelectorAll(".item-row").forEach(function(row){
    row.addEventListener("click", function(e){
      e.stopPropagation();
      openContent(row.getAttribute("data-section"), parseInt(row.getAttribute("data-item"), 10));
    });
  });
}

function openContent(secId, itemIdx){
  if(!currentData || !currentData.sections) return;
  var sec = null;
  for(var i=0; i<currentData.sections.length; i++){
    if(currentData.sections[i].id === secId){ sec = currentData.sections[i]; break; }
  }
  if(!sec || !sec.items || !sec.items[itemIdx]) return;
  var item = sec.items[itemIdx];
  currentItem = item;
  $("modalBadge").innerHTML = ICON_BOOK + '<span>' + escapeHtml(sec.title) + '</span>';
  $("modalTitle").textContent = item.title;
  $("modalSub").textContent = item.subtitle || "";
  $("modalBody").textContent = item.content || currentT.no_answer;
  $("contentModal").classList.add("show");

  if (window.bnAnalytics) window.bnAnalytics.track('ahkam_open', { section: secId, title: item.title });
}
function closeContent(){
  $("contentModal").classList.remove("show");
  currentItem = null;
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.top = "-1000px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); showMsg(currentT.copied); }catch(e){}
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg(currentT.copied); })
      .catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}

function switchSchool(school){
  currentSchool = school;
  try{ localStorage.setItem("bn_fiqh", school); }catch(e){}
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-school") === school);
  });
  $("ahkamContent").innerHTML = '<div class="loader">' + currentT.loading + '</div>';
  if(school === "jafari"){
    var saved = null;
    try{ saved = localStorage.getItem("bn_marja"); }catch(e){}
    if(saved && (saved === "sistani" || saved === "shirazi" || saved === "fayyaz")){
      selectMarja(saved);
    } else {
      currentData = null;
      currentMarjaInfo = null;
      renderMarjaCards();
    }
  } else {
    currentMarja = null;
    currentMarjaInfo = null;
    loadJSON(PATH_HANAFI).then(function(data){
      if(!data){
        $("ahkamContent").innerHTML = '<div class="empty">' + currentT.load_error + '</div>';
        return;
      }
      currentData = data;
      updateInfoBar();
      renderSections(data);
    });
  }
  if (window.bnAnalytics) window.bnAnalytics.track('fiqh_switched', { school: school });
}

function init(){
  applyLang(getLang());
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var s = btn.getAttribute("data-school");
      if(s !== currentSchool) switchSchool(s);
    });
  });
  $("changeMarjaBtn").addEventListener("click", function(){
    currentMarja = null;
    currentMarjaInfo = null;
    currentData = null;
    try{ localStorage.removeItem("bn_marja"); }catch(e){}
    renderMarjaCards();
  });
  $("closeModalBtn").addEventListener("click", closeContent);
  $("contentModal").addEventListener("click", function(e){
    if(e.target === this) closeContent();
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeContent();
  });
  document.querySelector(".content-actions").addEventListener("click", function(e){
    var btn = e.target.closest("[data-act]");
    if(!btn || !currentItem) return;
    var act = btn.getAttribute("data-act");
    var fullText = currentItem.title + "\n\n" + (currentItem.content || "");
    if(act === "copy") copyText(fullText);
    else if(act === "share"){
      if(navigator.share) navigator.share({ title: "بانوان نور", text: fullText }).catch(function(){});
      else copyText(fullText);
    }
  });
  window.addEventListener("storage", function(e){
    if(e.key === THEME_KEY) applyTheme(e.newValue || getSystemTheme());
    if(e.key === "bn_lang") applyLang(e.newValue || DEFAULT_LANG);
  });
  window.addEventListener("pageshow", function(){
    var s = getLang();
    if(s !== document.documentElement.getAttribute("lang")) applyLang(s);
  });
  var savedSchool = "jafari";
  try{
    var s = localStorage.getItem("bn_fiqh");
    if(s === "jafari" || s === "hanafi") savedSchool = s;
  }catch(e){}
  switchSchool(savedSchool);
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();
</script>
