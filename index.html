<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4c1d95" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>بانوان نور | BANOVAN NOOR</title>
  <link rel="icon" href="assets/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('assets/fonts/Vazirmatn-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Vazirmatn';
      src: url('assets/fonts/Vazirmatn-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Vazirmatn';
      src: url('assets/fonts/Vazirmatn-Black.woff2') format('woff2');
      font-weight: 900;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; }
    html[dir="ltr"] body { direction: ltr; }

    body {
      font-family: 'Vazirmatn', Tahoma, 'Segoe UI', Arial, sans-serif;
      direction: rtl;
      color: #ffffff;
      background: #1e1b4b;
      background-image:
        radial-gradient(ellipse 700px 500px at 15% 10%, rgba(236, 72, 153, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 600px 500px at 90% 20%, rgba(168, 85, 247, 0.42) 0%, transparent 60%),
        radial-gradient(ellipse 650px 550px at 10% 85%, rgba(139, 92, 246, 0.5) 0%, transparent 55%),
        radial-gradient(ellipse 700px 600px at 95% 95%, rgba(236, 72, 153, 0.32) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.25) 0%, transparent 70%),
        linear-gradient(160deg, #1e1b4b 0%, #3b0764 20%, #4c1d95 45%, #5b21b6 60%, #3b0764 80%, #1e1b4b 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(253, 230, 138, 0.9) 0%, transparent 1.1%),
        radial-gradient(circle at 88% 12%, rgba(253, 230, 138, 0.8) 0%, transparent 0.9%),
        radial-gradient(circle at 78% 88%, rgba(253, 230, 138, 0.7) 0%, transparent 0.9%),
        radial-gradient(circle at 8% 72%, rgba(253, 230, 138, 0.6) 0%, transparent 0.8%),
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9) 0%, transparent 0.6%),
        radial-gradient(circle at 70% 35%, rgba(255, 255, 255, 0.7) 0%, transparent 0.5%),
        radial-gradient(circle at 25% 65%, rgba(255, 255, 255, 0.6) 0%, transparent 0.6%),
        radial-gradient(circle at 82% 65%, rgba(255, 255, 255, 0.7) 0%, transparent 0.5%),
        radial-gradient(circle at 18% 45%, rgba(244, 114, 182, 0.85) 0%, transparent 0.7%),
        radial-gradient(circle at 90% 45%, rgba(244, 114, 182, 0.75) 0%, transparent 0.7%);
      pointer-events: none;
      z-index: 0;
      animation: starTwinkle 5s ease-in-out infinite alternate;
    }
    @keyframes starTwinkle {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .bg-flowers { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .flower { position: absolute; opacity: 0.14; animation: floatFlower 10s ease-in-out infinite; }
    .flower svg { width: 100%; height: 100%; display: block; }
    .flower-1 { top: 4%; left: 2%; width: 120px; height: 120px; }
    .flower-2 { top: 10%; right: 3%; width: 90px; height: 90px; animation-delay: -2s; }
    .flower-3 { bottom: 6%; left: 4%; width: 100px; height: 100px; animation-delay: -4s; }
    .flower-4 { bottom: 12%; right: 3%; width: 130px; height: 130px; animation-delay: -1s; }
    @keyframes floatFlower {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }

    .welcome {
      width: 100%;
      max-width: 480px;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 1s ease-out;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      z-index: 1;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-logo-wrap {
      position: relative;
      margin-bottom: 22px;
      animation: logoEnter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes logoEnter {
      from { opacity: 0; transform: translateY(-25px) scale(0.85); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .welcome-logo-wrap::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, rgba(139, 92, 246, 0.25) 40%, transparent 72%);
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite;
      z-index: -2;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
    .welcome-logo-wrap::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 230px; height: 230px;
      border-radius: 50%;
      border: 2px dashed rgba(253, 230, 138, 0.4);
      pointer-events: none;
      animation: rotateRing 25s linear infinite;
      z-index: -1;
    }
    @keyframes rotateRing {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .welcome-logo {
      width: 185px;
      height: 185px;
      border-radius: 42px;
      overflow: hidden;
      box-shadow:
        0 20px 50px rgba(76, 29, 149, 0.7),
        0 8px 22px rgba(236, 72, 153, 0.4),
        0 0 0 3px rgba(253, 230, 138, 0.5),
        0 0 0 6px rgba(139, 92, 246, 0.4),
        0 0 36px rgba(253, 230, 138, 0.3);
      position: relative;
      background: linear-gradient(135deg, #2d1259 0%, #4c1d95 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .welcome-logo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 42px;
    }
    .logo-fallback {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 6px 18px rgba(253, 230, 138, 0.6));
      user-select: none;
    }

    .welcome-title {
      font-size: 2.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #fde68a 20%, #f9a8d4 45%, #c4b5fd 70%, #fde68a 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin-bottom: 12px;
      line-height: 1.15;
      animation: titleShine 4s ease-in-out infinite;
    }
    @keyframes titleShine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .welcome-sub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
      width: 100%;
    }
    .welcome-sub-en {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.35rem;
      color: #fbcfe8;
      letter-spacing: 0.4em;
      padding-left: 0.4em;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.8), 0 0 40px rgba(236, 72, 153, 0.5);
    }
    .welcome-sub-en.noor {
      font-size: 1.5rem;
      color: #fde68a;
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      text-shadow: 0 0 20px rgba(253, 230, 138, 0.9), 0 0 40px rgba(251, 191, 36, 0.5);
    }

    .welcome-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 22px;
      width: 100%;
      max-width: 260px;
    }
    .welcome-divider::before,
    .welcome-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(253, 230, 138, 0.7) 50%, transparent 100%);
    }
    .welcome-divider-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle, #fde68a 0%, #fbbf24 100%);
      box-shadow: 0 0 12px rgba(253, 230, 138, 1), 0 0 24px rgba(253, 230, 138, 0.7);
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    .welcome-text {
      font-size: 1.45rem;
      line-height: 1.9;
      color: #ffffff;
      max-width: 400px;
      margin: 0 auto 28px;
      font-weight: 800;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .welcome-text strong {
      color: #fde68a;
      font-weight: 900;
      text-shadow: 0 0 24px rgba(253, 230, 138, 0.7);
      display: inline-block;
      padding: 0 6px;
    }

    .btn-start {
      position: relative;
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #6d28d9 100%);
      color: #ffffff;
      border: 1.5px solid rgba(253, 230, 138, 0.55);
      padding: 16px 54px;
      border-radius: 50px;
      font-family: inherit;
      font-weight: 900;
      font-size: 1.05rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(236, 72, 153, 0.55), 0 10px 28px rgba(109, 40, 217, 0.55);
      transition: transform 0.15s ease;
      outline: none;
      letter-spacing: 1.5px;
      overflow: hidden;
      text-decoration: none;
    }
    .btn-start:active { transform: scale(0.96); }
    .btn-start svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round; stroke-linejoin: round;
      transform: scaleX(-1);
      position: relative; z-index: 1;
    }
    html[dir="ltr"] .btn-start svg { transform: scaleX(1); }
    .btn-start span { position: relative; z-index: 1; }

    .lang-row {
      display: flex;
      gap: 10px;
      margin-top: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(244, 114, 182, 0.35);
      color: #fbcfe8;
      border-radius: 30px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      outline: none;
      min-width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .lang-btn .flag { font-size: 1.05rem; line-height: 1; }
    .lang-btn:active { transform: scale(0.95); }
    .lang-btn.active {
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #6d28d9 100%);
      color: #ffffff;
      border-color: rgba(253, 230, 138, 0.75);
      transform: translateY(-2px);
    }

    @media (max-width: 380px) {
      .welcome-title { font-size: 2rem; }
      .welcome-logo { width: 160px; height: 160px; border-radius: 36px; }
      .welcome-logo-wrap::after { width: 200px; height: 200px; }
      .welcome-sub-en { font-size: 1.1rem; letter-spacing: 0.32em; padding-left: 0.32em; }
      .welcome-sub-en.noor { font-size: 1.25rem; letter-spacing: 0.42em; padding-left: 0.42em; }
      .welcome-text { font-size: 1.25rem; }
      .btn-start { padding: 14px 44px; font-size: 1rem; }
    }
  </style>
</head>

<body>

  <div class="bg-flowers" aria-hidden="true">
    <div class="flower flower-1"><svg viewBox="0 0 100 100"><g fill="#f9a8d4"><ellipse cx="50" cy="25" rx="14" ry="22"/><ellipse cx="50" cy="75" rx="14" ry="22"/><ellipse cx="25" cy="50" rx="22" ry="14"/><ellipse cx="75" cy="50" rx="22" ry="14"/></g><circle cx="50" cy="50" r="10" fill="#fde68a"/></svg></div>
    <div class="flower flower-2"><svg viewBox="0 0 100 100"><g fill="#c4b5fd"><ellipse cx="50" cy="25" rx="13" ry="21"/><ellipse cx="50" cy="75" rx="13" ry="21"/><ellipse cx="25" cy="50" rx="21" ry="13"/><ellipse cx="75" cy="50" rx="21" ry="13"/></g><circle cx="50" cy="50" r="9" fill="#fbbf24"/></svg></div>
    <div class="flower flower-3"><svg viewBox="0 0 100 100"><g fill="#f472b6"><ellipse cx="50" cy="28" rx="13" ry="20"/><ellipse cx="50" cy="72" rx="13" ry="20"/><ellipse cx="28" cy="50" rx="20" ry="13"/><ellipse cx="72" cy="50" rx="20" ry="13"/></g><circle cx="50" cy="50" r="8" fill="#fde68a"/></svg></div>
    <div class="flower flower-4"><svg viewBox="0 0 100 100"><g fill="#a78bfa"><ellipse cx="50" cy="22" rx="15" ry="24"/><ellipse cx="50" cy="78" rx="15" ry="24"/><ellipse cx="22" cy="50" rx="24" ry="15"/><ellipse cx="78" cy="50" rx="24" ry="15"/></g><circle cx="50" cy="50" r="11" fill="#fbcfe8"/></svg></div>
  </div>

  <div class="welcome">

    <div class="welcome-logo-wrap">
      <div class="welcome-logo">
        <img id="logoImg" src="assets/logo.png" alt="بانوان نور" />
      </div>
    </div>

    <h1 class="welcome-title" id="titleText">بانوان نور</h1>

    <div class="welcome-sub">
      <span class="welcome-sub-en">BANOVAN</span>
      <span class="welcome-sub-en noor">NOOR</span>
    </div>

    <div class="welcome-divider"><span class="welcome-divider-dot"></span></div>

    <p class="welcome-text">
      <span id="line1Text">به</span>
      <strong id="appNameText">بانوان نور</strong>
      <span id="line2Text">خوش آمدید</span>
    </p>

    <a class="btn-start" id="btnStart" href="home.html">
      <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      <span id="startText">شروع</span>
    </a>

    <div class="lang-row" role="group" aria-label="زبان">
      <button class="lang-btn active" type="button" data-lang="fa"><span class="flag">🇮🇷</span><span>فارسی</span></button>
      <button class="lang-btn" type="button" data-lang="ps"><span class="flag">🇦🇫</span><span>پښتو</span></button>
      <button class="lang-btn" type="button" data-lang="en"><span class="flag">🇬🇧</span><span>English</span></button>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      /* ---------- ترجمه‌های پیش‌فرض (fallback برای file://) ---------- */
      var FALLBACK = {
        fa: { appName: 'بانوان نور', line1: 'به', line2: 'خوش آمدید', start: 'شروع', dir: 'rtl', lang: 'fa' },
        ps: { appName: 'بانوان نور', line1: 'ته', line2: 'ښه راغلاست', start: 'پیل', dir: 'rtl', lang: 'ps' },
        en: { appName: 'Banovan Noor', line1: 'Welcome to', line2: '', start: 'Start', dir: 'ltr', lang: 'en' }
      };

      var SUPPORTED = ['fa', 'ps', 'en'];
      var DEFAULT_LANG = 'fa';
      var cache = {};  // ترجمه‌های لودشده از i18n

      function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      function getLang() {
        var l = safeGet('bn_lang');
        return (l && SUPPORTED.indexOf(l) > -1) ? l : DEFAULT_LANG;
      }

      /* تلاش برای خواندن از i18n/*.json — اگه نشد، fallback */
      function loadTranslation(lang) {
        if (cache[lang]) return Promise.resolve(cache[lang]);

        // اگه روی file:// هستیم، مستقیم fallback بده
        if (location.protocol === 'file:') {
          cache[lang] = FALLBACK[lang];
          return Promise.resolve(FALLBACK[lang]);
        }

        return fetch('i18n/' + lang + '.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            var merged = Object.assign({}, FALLBACK[lang], data || {});
            cache[lang] = merged;
            return merged;
          })
          .catch(function () {
            cache[lang] = FALLBACK[lang];
            return FALLBACK[lang];
          });
      }

      function applyTranslation(t, lang) {
        var setText = function (id, val) {
          var el = document.getElementById(id);
          if (el) el.textContent = val || '';
        };
        setText('titleText', t.appName);
        setText('line1Text', t.line1);
        setText('appNameText', t.appName);
        setText('startText', t.start);

        var l2 = document.getElementById('line2Text');
        if (l2) {
          l2.textContent = t.line2 || '';
          l2.style.display = t.line2 ? '' : 'none';
        }

        var html = document.documentElement;
        html.setAttribute('dir', t.dir || 'rtl');
        html.setAttribute('lang', t.lang || lang);
        document.body.setAttribute('dir', t.dir || 'rtl');
        document.title = (t.appName || 'Banovan Noor') + ' | BANOVAN NOOR';

        var btns = document.querySelectorAll('.lang-btn');
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].getAttribute('data-lang') === lang) btns[i].classList.add('active');
          else btns[i].classList.remove('active');
        }
      }

      function changeLang(lang) {
        if (SUPPORTED.indexOf(lang) === -1) lang = DEFAULT_LANG;
        safeSet('bn_lang', lang);
        loadTranslation(lang).then(function (t) { applyTranslation(t, lang); });
      }

      function initLogo() {
        var img = document.getElementById('logoImg');
        if (!img) return;
        img.addEventListener('error', function () {
          var parent = img.parentNode;
          if (!parent || parent.querySelector('.logo-fallback')) return;
          img.style.display = 'none';
          var fb = document.createElement('div');
          fb.className = 'logo-fallback';
          fb.textContent = '🌸';
          parent.appendChild(fb);
        });
      }

      function registerSW() {
        // فقط روی http/https — روی file:// کار نمی‌کنه
        if (!('serviceWorker' in navigator)) return;
        if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }

      function init() {
        initLogo();
        changeLang(getLang());

        var btns = document.querySelectorAll('.lang-btn');
        for (var i = 0; i < btns.length; i++) {
          (function (btn) {
            btn.addEventListener('click', function (e) {
              e.preventDefault();
              changeLang(btn.getAttribute('data-lang'));
            });
          })(btns[i]);
        }

        registerSW();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
<script src="analy/analytics.js"></script>
</body>
</html>
