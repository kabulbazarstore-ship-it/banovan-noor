<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="بانوان نور — همراه آموزشی، فرهنگی و سلامت بانوان مسلمان">
<title>بانوان نور | BANOVAN NOOR</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">

<script>
(function(){
  try{
    var t = localStorage.getItem('bn_theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'dark') document.body && document.body.classList.add('dark');
  }catch(e){}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   BANOVAN NOOR — INDEX (Welcome) v3 — هماهنگ با برند
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg-1:#fdf5ff;
  --bg-2:#f6e9ff;
  --bg-3:#f0e0ff;
  --bg-4:#e9d5ff;
  --text:#2d1259;
  --text-soft:#4c1d95;
  --text-card:#1f1147;
  --text-muted:#7c6f9a;
  --card:rgba(255,255,255,.85);
  --card-border:rgba(219,39,119,.18);
  --icon-bg:rgba(255,255,255,.85);
  --icon-border:rgba(219,39,119,.25);
  --icon-color:#db2777;
  --accent:#db2777;
  --accent-soft:rgba(219,39,119,.10);
  --accent-2:#a855f7;
  --pink:#f9a8d4;
  --purple:#a78bfa;
  --gold:#fde68a;
  --green:#10b981;
  --shadow-sm:0 4px 12px rgba(219,39,119,.15);
  --shadow-lg:0 14px 34px rgba(219,39,119,.28);

  /* ✅ گرادیان برند اصلی */
  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-anim:linear-gradient(105deg,#e11d48 0%,#db2777 50%,#a855f7 100%);
}

html[data-theme="dark"]{
  --bg-1:#000000;
  --bg-2:#000000;
  --bg-3:#000000;
  --bg-4:#000000;
  --text:#ffffff;
  --text-soft:#e4e6eb;
  --text-card:#ffffff;
  --text-muted:#8e8e93;
  --card:#1c1c1e;
  --card-border:#2c2c2e;
  --icon-bg:#1c1c1e;
  --icon-border:#2c2c2e;
  --icon-color:#ec4899;
  --accent:#ec4899;
  --accent-soft:rgba(236,72,153,.14);
  --accent-2:#a855f7;
  --pink:#f9a8d4;
  --purple:#a78bfa;
  --gold:#fde68a;
  --green:#30d158;
  --shadow-sm:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 4px 16px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}

body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;
  direction:rtl;
  color:var(--text);
  background-color:var(--bg-1);
  background-image:
    radial-gradient(ellipse 500px 400px at 20% 5%,rgba(225,29,72,.12) 0,transparent 60%),
    radial-gradient(ellipse 400px 350px at 85% 15%,rgba(168,85,247,.15) 0,transparent 65%),
    radial-gradient(ellipse 450px 400px at 15% 90%,rgba(219,39,119,.14) 0,transparent 60%),
    linear-gradient(160deg,var(--bg-1) 0,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%,var(--bg-4) 100%);
  background-attachment:fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:background-color .5s ease,color .4s ease;
  -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body{
  background-image:none;
  background-color:#000;
}

.bg-orb{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  filter:blur(10px);
  z-index:0;
  will-change:transform;
}
.orb-one{
  width:190px;height:190px;
  top:5%;left:-70px;
  background:radial-gradient(circle,rgba(225,29,72,.32),transparent 70%);
  animation:orbOne 12s ease-in-out infinite;
}
.orb-two{
  width:250px;height:250px;
  right:-100px;top:28%;
  background:radial-gradient(circle,rgba(168,85,247,.30),transparent 70%);
  animation:orbTwo 15s ease-in-out infinite;
}
.orb-three{
  width:190px;height:190px;
  left:22%;bottom:-100px;
  background:radial-gradient(circle,rgba(252,176,69,.18),transparent 70%);
  animation:orbThree 13s ease-in-out infinite;
}
html[data-theme="dark"] .bg-orb{opacity:.15}
@keyframes orbOne{50%{transform:translate(35px,35px) scale(1.12)}}
@keyframes orbTwo{50%{transform:translate(-35px,-25px) scale(.9)}}
@keyframes orbThree{50%{transform:translate(45px,-35px) scale(1.1)}}

body::before{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;
  background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.15) 100%);
  z-index:0;
}
html[data-theme="dark"] body::before{
  background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.5) 100%);
}

.topbar{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top, 0px));
  left:16px;right:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  z-index:20;
  pointer-events:none;
}
.topbar > *{pointer-events:auto}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 14px;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--card-border);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow-sm);
  font-size:.78rem;
  font-weight:900;
  color:var(--text);
  transition:all .4s ease;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:55vw;
}
html[data-theme="dark"] .brand{backdrop-filter:none}
.brand-dot{
  width:9px;height:9px;
  border-radius:50%;
  background:var(--brand-grad);
  box-shadow:0 0 14px rgba(219,39,119,.70);
  flex-shrink:0;
  animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.15);opacity:.7}
}

.theme-button{
  width:46px;height:46px;
  border-radius:15px;
  border:1px solid var(--card-border);
  background:var(--card);
  color:var(--text);
  display:grid;
  place-items:center;
  cursor:pointer;
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:var(--shadow-sm);
  transition:all .3s ease;
  flex-shrink:0;
}
html[data-theme="dark"] .theme-button{backdrop-filter:none}
.theme-button:active{transform:scale(.9)}
.theme-button svg{
  width:21px;height:21px;
  fill:none;stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
  transition:transform .5s cubic-bezier(.16,1,.3,1);
}
.theme-button.spin svg{transform:rotate(360deg)}
.theme-button .icon-moon{display:block}
.theme-button .icon-sun{display:none}
html[data-theme="dark"] .theme-button .icon-moon{display:none}
html[data-theme="dark"] .theme-button .icon-sun{display:block}

.welcome{
  width:min(100%,500px);
  max-height:100vh;
  max-height:100dvh;
  padding:78px 18px 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:2;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
}
.welcome::-webkit-scrollbar{display:none}

.card{
  width:100%;
  padding:30px 22px 25px;
  border-radius:32px;
  border:1px solid var(--card-border);
  background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.7));
  backdrop-filter:blur(30px) saturate(145%);
  -webkit-backdrop-filter:blur(30px) saturate(145%);
  box-shadow:var(--shadow-lg);
  position:relative;
  overflow:hidden;
  transition:all .4s ease;
}
html[data-theme="dark"] .card{
  background:#1c1c1e;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  backdrop-filter:none;
}
.card::before{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:linear-gradient(125deg,
    rgba(225,29,72,.07),
    transparent 32%,
    rgba(168,85,247,.07) 70%,
    rgba(252,176,69,.04));
}
html[data-theme="dark"] .card::before{display:none}

.content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.logo-wrapper{
  width:158px;height:158px;
  margin:0 auto 21px;
  position:relative;
  display:grid;
  place-items:center;
}
.logo-wrapper::before{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  background:conic-gradient(from 210deg,
    #e11d48,#db2777,#a855f7,#e11d48);
  filter:blur(18px);
  opacity:.5;
  animation:logoGlow 9s linear infinite;
  z-index:0;
}
html[data-theme="dark"] .logo-wrapper::before{opacity:.35}
@keyframes logoGlow{to{transform:rotate(360deg)}}

.logo-ring{
  width:158px;height:158px;
  padding:4px;
  border-radius:50%;
  background:conic-gradient(from 210deg,
    #e11d48,#db2777,#a855f7,#e11d48);
  box-shadow:
    0 0 35px rgba(219,39,119,.32),
    0 20px 55px rgba(0,0,0,.2);
  position:relative;
  z-index:1;
  animation:ringRotate 18s linear infinite;
}
html[data-theme="dark"] .logo-ring{
  box-shadow:0 0 35px rgba(219,39,119,.4),0 20px 55px rgba(0,0,0,.6);
}
@keyframes ringRotate{to{transform:rotate(-360deg)}}

.logo-inner{
  width:100%;height:100%;
  padding:6px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--card-border);
  transition:background .4s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
html[data-theme="dark"] .logo-inner{background:#000}

.logo{
  width:100%;height:100%;
  display:block;
  object-fit:cover;
  border-radius:50%;
  background:var(--brand-grad);
  animation:ringRotateReverse 18s linear infinite;
}
@keyframes ringRotateReverse{to{transform:rotate(360deg)}}

.logo-fallback{
  display:none;
  position:absolute;
  width:80px;height:80px;
  inset:0;margin:auto;
  z-index:3;
  filter:drop-shadow(0 4px 12px rgba(252,176,69,.5));
  animation:fallbackFloat 4s ease-in-out infinite;
}
@keyframes fallbackFloat{
  0%,100%{transform:translateY(0) rotate(-1deg)}
  50%{transform:translateY(-4px) rotate(1deg)}
}

.logo-wrapper.no-logo .logo{display:none}
.logo-wrapper.no-logo .logo-fallback{display:block}
.logo-wrapper.no-logo .logo-inner{
  background:radial-gradient(circle at 50% 40%,#db2777 0,#a855f7 70%,#1a0b3d 100%);
}
html[data-theme="dark"] .logo-wrapper.no-logo .logo-inner{
  background:radial-gradient(circle at 50% 40%,#a855f7 0,#1c1c1e 70%,#000 100%);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:99px;
  color:var(--text);
  font-size:.72rem;
  font-weight:800;
  background:linear-gradient(90deg,rgba(225,29,72,.15),rgba(168,85,247,.15));
  border:1px solid var(--card-border);
  margin-bottom:14px;
  transition:all .4s ease;
}
html[data-theme="dark"] .badge{
  background:var(--accent-soft);
  color:var(--accent);
  border-color:rgba(236,72,153,.3);
}
.badge-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  flex-shrink:0;
  animation:badgeBlink 1.5s ease-in-out infinite;
}
@keyframes badgeBlink{
  0%,100%{opacity:1}
  50%{opacity:.4}
}

.title{
  font-size:clamp(2.1rem,9vw,3.1rem);
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.5px;
  margin-bottom:9px;
  background:linear-gradient(90deg,
    #a855f7 0%,#db2777 25%,#e11d48 50%,#db2777 75%,#a855f7 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  animation:titleMove 6s ease-in-out infinite;
  text-align:center;
}
html[data-theme="dark"] .title{
  background:linear-gradient(90deg,#fff 0,#a855f7 30%,#ec4899 55%,#a855f7 80%,#fff 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
}
@keyframes titleMove{50%{background-position:100% center}}

.english{
  font-family:Georgia,serif;
  font-size:1rem;
  letter-spacing:.45em;
  padding-left:.45em;
  color:var(--accent);
  font-weight:700;
  margin-bottom:17px;
  text-align:center;
  transition:color .4s ease;
}
html[data-theme="dark"] .english{color:var(--purple)}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  width:76%;
  margin:0 auto 18px;
}
.divider span{
  height:1px;flex:1;
  background:linear-gradient(90deg,transparent,var(--card-border),transparent);
}
.divider i{
  width:8px;height:8px;
  transform:rotate(45deg);
  background:var(--brand-grad);
  box-shadow:0 0 16px rgba(219,39,119,.65);
  animation:dividerSpin 3s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dividerSpin{
  0%,100%{transform:rotate(45deg) scale(1)}
  50%{transform:rotate(225deg) scale(1.3)}
}

.description{
  color:var(--text-muted);
  font-size:1rem;
  line-height:1.95;
  max-width:380px;
  margin:0 auto 24px;
  text-align:center;
  transition:color .4s ease;
}
.description strong{
  color:var(--text);
  font-weight:900;
}

.start-button{
  width:100%;
  max-width:310px;
  min-height:57px;
  margin:auto;
  border:0;
  border-radius:19px;
  color:#fff;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  font-family:inherit;
  font-size:1rem;
  font-weight:900;
  background:var(--brand-grad-anim);
  background-size:200% 100%;
  box-shadow:
    0 18px 40px rgba(219,39,119,.35),
    0 8px 23px rgba(168,85,247,.24),
    inset 0 1px rgba(255,255,255,.45);
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s ease;
  animation:gradientMove 5s ease infinite;
  -webkit-tap-highlight-color:transparent;
  opacity:1 !important;
}
@keyframes gradientMove{50%{background-position:100% 0}}

.start-button::before{
  content:"";
  position:absolute;
  top:0;bottom:0;
  width:45%;
  left:-65%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-22deg);
  animation:buttonShine 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes buttonShine{
  0%,55%{left:-65%}
  80%,100%{left:125%}
}
.start-button:active{transform:scale(.97)}

.start-button span,
.start-button svg{position:relative;z-index:2}

.start-button svg{
  width:20px;height:20px;
  fill:none;stroke:currentColor;
  stroke-width:2.5;
  stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s ease;
}
.start-button:hover svg{transform:translateX(-3px)}
[dir="ltr"] .start-button svg{transform:scaleX(-1)}

.start-button.loading{pointer-events:none;opacity:.9}
.start-button.loading svg{
  animation:spin 1s linear infinite;
  transform:none !important;
}
@keyframes spin{to{transform:rotate(360deg)}}

.languages{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  width:100%;
  max-width:310px;
  margin:15px auto 0;
}
.language{
  min-height:43px;
  border-radius:14px;
  border:1px solid var(--card-border);
  color:var(--text-muted);
  background:var(--accent-soft);
  font-family:inherit;
  font-size:.78rem;
  font-weight:800;
  cursor:pointer;
  transition:.25s ease;
  -webkit-tap-highlight-color:transparent;
}
.language:hover{border-color:var(--accent);color:var(--text)}
.language.active{
  color:#fff;
  border-color:transparent;
  background:var(--brand-grad);
  box-shadow:0 8px 22px rgba(219,39,119,.22);
}
html[data-theme="dark"] .language.active{
  background:var(--brand-grad);
  box-shadow:0 8px 22px rgba(219,39,119,.3);
}
.language:active{transform:scale(.95)}

/* ═══ FOOTER ═══ */
.footer{
  margin-top:22px;
  padding:8px 4px 2px;
  text-align:center;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-top:1px solid transparent;
  border-image:linear-gradient(90deg,transparent,rgba(225,29,72,.35),rgba(168,85,247,.35),transparent) 1;
}

.footer::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  width:55%;
  height:2px;
  border-radius:2px;
  background:linear-gradient(90deg,
    transparent 0%,
    #db2777 20%,
    #a855f7 50%,
    #e11d48 80%,
    transparent 100%);
  background-size:200% 100%;
  animation:footerBar 4s ease-in-out infinite;
  opacity:.85;
}
@keyframes footerBar{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

.footer-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--brand-grad);
  box-shadow:0 0 10px rgba(219,39,119,.65);
  flex-shrink:0;
  animation:dotPulse 2s ease-in-out infinite;
}

.footer-text{
  position:relative;
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.2px;
  background:linear-gradient(90deg,
    #db2777 0%,
    #a855f7 20%,
    #e11d48 40%,
    #db2777 60%,
    #a855f7 80%,
    #db2777 100%);
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  animation:footerTextFlow 5s linear infinite;
  filter:drop-shadow(0 1px 2px rgba(219,39,119,.15));
  padding:2px 4px;
}
html[data-theme="dark"] .footer-text{
  background:linear-gradient(90deg,
    #ec4899 0%,
    #a855f7 20%,
    #e11d48 40%,
    #ec4899 60%,
    #a855f7 80%,
    #ec4899 100%);
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  filter:drop-shadow(0 1px 3px rgba(168,85,247,.25));
}
@keyframes footerTextFlow{
  0%{background-position:0% center}
  100%{background-position:300% center}
}

.footer-text::before{
  content:"";
  position:absolute;
  top:0;bottom:0;
  left:-30%;
  width:30%;
  background:linear-gradient(90deg,
    transparent,
    rgba(255,255,255,.9),
    transparent);
  transform:skewX(-20deg);
  animation:footerShine 4s ease-in-out infinite;
  mix-blend-mode:overlay;
  pointer-events:none;
  border-radius:6px;
}
@keyframes footerShine{
  0%,60%{left:-30%}
  85%,100%{left:130%}
}

/* ═══ ANIMATIONS ═══ */
.fade{
  opacity:0;
  transform:translateY(18px);
  animation:fadeIn .75s cubic-bezier(.16,1,.3,1) forwards;
}
.delay-1{animation-delay:.08s}
.delay-2{animation-delay:.18s}
.delay-3{animation-delay:.28s}
.delay-4{animation-delay:.38s}
.delay-5{animation-delay:.48s}
.delay-6{animation-delay:.58s}
@keyframes fadeIn{to{opacity:1;transform:none}}

.ripple{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  transform:scale(0);
  animation:rippleAnim .65s ease-out;
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

@media(max-width:370px){
  .welcome{padding:70px 13px 18px}
  .card{padding:20px 14px;border-radius:28px}
  .logo-wrapper,.logo-ring{width:116px;height:116px}
  .logo-wrapper{margin-bottom:15px}
  .logo-wrapper .logo-fallback{width:60px;height:60px}
  .title{font-size:1.9rem}
  .description{font-size:.87rem}
  .start-button{min-height:52px;font-size:.9rem}
  .language{font-size:.7rem}
  .brand{font-size:.7rem;padding:7px 10px;max-width:50vw}

<script src="js/bn-analytics.js"></script>
<script src="js/bn-app.js"></script>

<script>
(function(){
"use strict";

/* ═══ THEME MANAGER — هماهنگ با bn-app.js ═══ */
var THEME_KEY = 'bn_theme';

function getSystemTheme(){
  try{ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  catch(e){ return 'light'; }
}
function getSavedTheme(){
  try{
    var t = localStorage.getItem(THEME_KEY);
    if (t === 'dark' || t === 'light') return t;
  }catch(e){}
  return getSystemTheme();
}
function applyTheme(theme){
  if (theme !== 'dark') theme = 'light';
  document.documentElement.setAttribute('data-theme', theme);
  document.body.classList.toggle('dark', theme === 'dark'); // ✅ هماهنگ با bn-app.js
  var meta = document.getElementById('themeMeta');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#db2777');
}
function setTheme(theme){
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  applyTheme(theme);
  if (window.bnAnalytics) window.bnAnalytics.track('theme_changed', { theme: theme });
}
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  var btn = document.getElementById('themeButton');
  if (btn){
    btn.classList.add('spin');
    setTimeout(function(){ btn.classList.remove('spin'); }, 500);
  }
  setTheme(next);
}

applyTheme(getSavedTheme());

try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
    try{
      if (!localStorage.getItem(THEME_KEY)){
        applyTheme(e.matches ? 'dark' : 'light');
      }
    }catch(err){}
  });
}catch(e){}

window.addEventListener('storage', function(e){
  if (e.key === THEME_KEY) applyTheme(e.newValue || getSystemTheme());
});

/* ═══ SMART LOGO LOADER ═══ */
(function(){
  var sources = [
    'assets/icon-512.png','assets/logo.png','assets/icon-192.png',
    'assets/icon-72.png','logo.png','icon-512.png'
  ];
  var img = document.getElementById('logoImg');
  var wrap = document.getElementById('logoWrapper');
  if (!img || !wrap) return;
  var i = 0;
  function next(){
    if (i >= sources.length){ wrap.classList.add('no-logo'); return; }
    img.src = sources[i]; i++;
  }
  img.addEventListener('load', function(){
    if (img.naturalWidth > 0) wrap.classList.remove('no-logo');
    else next();
  });
  img.addEventListener('error', next);
  next();
})();

/* ═══ THEME BUTTON ═══ */
var themeBtn = document.getElementById('themeButton');
if (themeBtn) themeBtn.addEventListener('click', toggleTheme);

/* ═══ TRANSLATIONS ═══ */
var T = {
  fa: {
    appName:'بانوان نور',
    badge:'همراه آموزشی، فرهنگی و سلامت بانوان',
    line1:'به',
    line2:'خوش آمدید؛ دانایی، آرامش و آگاهی را همراه خود داشته باشید.',
    start:'ورود به برنامه',
    footer:'تهیه کننده: سید مقدس حسینی',
    dir:'rtl', lang:'fa'
  },
  ps: {
    appName:'بانوان نور',
    badge:'د ښځو لپاره ښوونیز، فرهنګي او روغتیايي ملګری',
    line1:'',
    line2:'ته ښه راغلاست؛ پوهه، آرامتیا او پوهاوی له ځان سره ولرئ.',
    start:'پروګرام ته ننوتل',
    footer:'چمتو کوونکی: سید مقدس حسینی',
    dir:'rtl', lang:'ps'
  },
  en: {
    appName:'Banovan Noor',
    badge:'Educational, cultural and wellness companion for women',
    line1:'Welcome to',
    line2:'Your companion for knowledge, wellbeing and awareness.',
    start:'Enter the app',
    footer:'Produced by: Sayed Moghaddas Hosseini',
    dir:'ltr', lang:'en'
  }
};
var SUPPORTED = ['fa','ps','en'];
var DEFAULT_LANG = 'fa';

function getLang(){
  try{ var l = localStorage.getItem('bn_lang'); if (l && SUPPORTED.indexOf(l)>-1) return l; }catch(e){}
  return DEFAULT_LANG;
}
function setLang(l){ try{ localStorage.setItem('bn_lang', l); }catch(e){} }

function applyLang(lang){
  if (SUPPORTED.indexOf(lang) === -1) lang = DEFAULT_LANG;
  setLang(lang);
  var t = T[lang] || T.fa;

  var el;
  el = document.getElementById('titleText');   if(el) el.textContent = t.appName;
  el = document.getElementById('miniBrand');    if(el) el.textContent = t.appName;
  el = document.getElementById('badgeText');    if(el) el.textContent = t.badge;
  el = document.getElementById('welcomeLine');  if(el) el.textContent = t.line1;
  el = document.getElementById('appName');      if(el) el.textContent = t.appName;
  el = document.getElementById('welcomeEnd');   if(el) el.textContent = t.line2;
  el = document.getElementById('startText');    if(el) el.textContent = t.start;
  el = document.getElementById('footerText');   if(el) el.textContent = t.footer;

  document.documentElement.setAttribute('dir', t.dir);
  document.documentElement.setAttribute('lang', t.lang);
  document.title = t.appName + ' | BANOVAN NOOR';

  var btns = document.querySelectorAll('.language');
  for (var i=0; i<btns.length; i++){
    if (btns[i].getAttribute('data-lang') === lang) btns[i].classList.add('active');
    else btns[i].classList.remove('active');
  }

  // ثبت رویداد آنالیتیکس
  if (window.bnAnalytics) {
    window.bnAnalytics.track('language_changed', { lang: lang });
  }
}

applyLang(getLang());

var langButtons = document.querySelectorAll('.language');
for (var i=0; i<langButtons.length; i++){
  (function(btn){
    btn.addEventListener('click', function(){
      applyLang(btn.getAttribute('data-lang'));
    });
  })(langButtons[i]);
}

window.addEventListener('storage', function(e){
  if (e.key === 'bn_lang') applyLang(e.newValue || DEFAULT_LANG);
});

/* ═══ RIPPLE + START ═══ */
function createRipple(event, element){
  var rect = element.getBoundingClientRect();
  var size = Math.max(rect.width, rect.height);
  var clientX = (event.touches && event.touches[0]) ? event.touches[0].clientX : event.clientX;
  var clientY = (event.touches && event.touches[0]) ? event.touches[0].clientY : event.clientY;
  if (clientX == null) clientX = rect.left + rect.width/2;
  if (clientY == null) clientY = rect.top + rect.height/2;
  var x = clientX - rect.left - size/2;
  var y = clientY - rect.top - size/2;
  var ripple = document.createElement("span");
  ripple.className = "ripple";
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = x + "px";
  ripple.style.top = y + "px";
  element.appendChild(ripple);
  setTimeout(function(){ ripple.remove(); }, 700);
}

var startBtn = document.getElementById("startButton");
if (startBtn){
  startBtn.addEventListener("click", function(event){
    event.preventDefault();
    var href = startBtn.getAttribute("href") || "home.html";

    // ثبت رویداد
    if (window.bnAnalytics) window.bnAnalytics.track('app_started');

    createRipple(event, startBtn);
    startBtn.classList.add("loading");
    var svg = startBtn.querySelector("svg");
    if (svg){
      svg.innerHTML = '<circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10"/>';
      svg.style.animation = "spin 1s linear infinite";
    }
    document.body.style.transition = "opacity .5s ease";
    document.body.style.opacity = "0";
    setTimeout(function(){ window.location.href = href; }, 450);
  });
}

/* ═══ ثبت Service Worker ═══ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('SW register failed:', e.message);
    });
  });
}

console.log('🌸 index.html ready — theme:', getSavedTheme());
})();
</script>
