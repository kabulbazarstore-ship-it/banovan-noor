<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="پزشکان — لیست پزشکان متخصص بانوان در کابل با اطلاعات تماس">
<title>پزشکان | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#fbf8ff;--bg2:#f5ecfb;
  --card:rgba(255,255,255,.84);--card-solid:#fff;
  --text:#25152d;--muted:#776b80;
  --line:rgba(112,55,140,.12);
  --primary:#a832d6;--pink:#ec4899;--rose:#e11d48;
  --green:#25d366;--green-dark:#128c7e;
  --brand:linear-gradient(110deg,#e11d48 0%,#db2777 43%,#a855f7 100%);
  --soft:rgba(168,50,214,.09);
  --shadow2:0 8px 25px rgba(88,37,111,.10);
  --nav-h:78px;
}
html[data-theme="dark"],
body.dark{
  --bg:#000;--bg2:#000;
  --card:rgba(28,28,30,.72);--card-solid:#1c1c1e;
  --text:#f9effd;--muted:#8e8e93;
  --line:rgba(192,132,252,.16);
  --soft:rgba(192,132,252,.12);
  --shadow2:0 10px 30px rgba(0,0,0,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 100% 0%,rgba(236,72,153,.08),transparent 30%),
    radial-gradient(circle at 0% 30%,rgba(139,92,246,.08),transparent 28%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
  font-family:"Vazirmatn","Noto Naskh Arabic",Tahoma,Arial,sans-serif;
  transition:background .25s,color .25s;
}
html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}
/* ✅ LTR */
body.lang-ltr { direction: ltr; }
body.lang-ltr #backBtn svg { transform: none; }
body.lang-ltr .doc-card:before { right: auto; left: 0; }
body.lang-ltr .back-cat-btn svg { transform: none; }
body.lang-ltr .doc-about { border-right: 0; border-left: 3px solid var(--pink); }
body.lang-ltr .search-box svg { right: auto; left: 14px; }
body.lang-ltr .search-box input { padding: 0 14px 0 42px; }

button,input{font:inherit}
button{border:0;cursor:pointer;background:transparent;color:inherit}
a{color:inherit;text-decoration:none}
svg{width:21px;height:21px;display:block}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:60;min-height:64px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex;align-items:center;gap:8px;
  background:rgba(251,248,255,.76);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:rgba(0,0,0,.78)}
.top-side{
  width:40px;height:40px;flex:0 0 40px;
  border-radius:13px;display:grid;place-items:center;
  color:var(--text);background:var(--card);border:1px solid var(--line);
  transition:transform .15s;
}
.top-side:active{transform:scale(.93)}
.top-side svg{width:19px;height:19px}
.brand-title{flex:1;min-width:0;text-align:center}
.brand-title strong{display:block;font-size:15px;font-weight:900}
.brand-title span{display:block;margin-top:1px;font-size:10px;color:var(--muted)}

main{
  width:min(720px,100%);margin:auto;
  padding:14px 12px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));
}

.hero{
  position:relative;overflow:hidden;min-height:150px;padding:18px;
  border-radius:24px;color:#fff;background:var(--brand);
  box-shadow:0 14px 32px rgba(178,43,130,.22);
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero:before{width:150px;height:150px;left:-60px;bottom:-80px;background:rgba(255,255,255,.12)}
.hero:after{width:200px;height:200px;right:-100px;top:-110px;border:1px solid rgba(255,255,255,.15);box-shadow:0 0 0 25px rgba(255,255,255,.035),0 0 0 50px rgba(255,255,255,.025)}
.hero-content{position:relative;z-index:2}
.hero-badge{
  width:max-content;display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:100px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);
  font-size:10px;font-weight:800;
}
.hero-badge svg{width:14px;height:14px}
.hero h1{margin:11px 0 5px;font-size:20px;line-height:1.3;font-weight:950}
.hero p{margin:0;max-width:400px;font-size:11px;line-height:1.9;opacity:.92}

.search-box{position:relative;margin-top:12px}
.search-box svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;width:18px;height:18px}
.search-box input{
  width:100%;height:46px;padding:0 42px 0 14px;
  border:1px solid var(--line);border-radius:15px;outline:0;
  color:var(--text);background:var(--card);
  box-shadow:var(--shadow2);transition:.2s;font-size:13px;
}
.search-box input:focus{border-color:rgba(168,50,214,.4);box-shadow:0 0 0 4px rgba(168,50,214,.08)}
.search-box input::placeholder{color:var(--muted)}

.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.cat-card{
  position:relative;overflow:hidden;padding:14px;
  border-radius:20px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow2);
  text-align:right;transition:transform .18s;cursor:pointer;
}
.cat-card:active{transform:scale(.97)}
.cat-icon{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;color:#fff;background:var(--brand);
  box-shadow:0 6px 16px rgba(185,40,130,.22);margin-bottom:10px;
}
.cat-icon svg{width:22px;height:22px}
.cat-title{font-size:14px;font-weight:900;line-height:1.4}
.cat-count{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700}

.list-header{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 10px;gap:8px}
.list-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900}
.list-title svg{width:20px;height:20px;color:var(--primary)}
.back-cat-btn{
  height:34px;padding:0 12px;display:flex;align-items:center;gap:5px;
  border-radius:11px;color:var(--primary);background:var(--soft);
  font-size:11px;font-weight:800;
}
.back-cat-btn svg{width:14px;height:14px;transform:scaleX(-1)}
.list-meta{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;gap:8px}
.result-count{color:var(--muted);font-size:11px;font-weight:700}

.doc-list{display:grid;gap:10px}
.doc-card{
  position:relative;overflow:hidden;padding:13px;
  border-radius:20px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow2);
  transition:transform .18s;cursor:pointer;
}
.doc-card:before{content:"";position:absolute;top:0;right:0;width:3.5px;height:100%;background:var(--brand);opacity:.85}
.doc-card:active{transform:scale(.988)}

.doc-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.doc-avatar{
  width:54px;height:54px;flex:0 0 54px;
  border-radius:16px;display:grid;place-items:center;
  background:var(--brand);color:#fff;
  font-size:1.5rem;font-weight:900;
  box-shadow:0 6px 16px rgba(185,40,130,.25);
  overflow:hidden;position:relative;
}
.doc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:14px;font-weight:950;line-height:1.5;margin-bottom:4px}
.doc-specialty{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:800;
  padding:3px 9px;border-radius:9px;
  background:var(--soft);color:var(--primary);
}
.doc-specialty svg{width:11px;height:11px}

.doc-meta{
  display:flex;flex-direction:column;gap:5px;
  padding-top:10px;border-top:1px dashed var(--line);
  margin-bottom:10px;
}
.doc-meta-item{
  display:flex;align-items:flex-start;gap:7px;
  font-size:10.5px;font-weight:700;color:var(--muted);
  line-height:1.8;
}
.doc-meta-item svg{
  width:14px;height:14px;flex:0 0 14px;margin-top:3px;
  color:var(--primary);
}
.doc-meta-item strong{color:var(--text);font-weight:900}

.doc-actions{display:flex;gap:6px}
.doc-btn{
  flex:1;padding:9px 10px;border-radius:11px;
  font-size:10.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .18s;
  cursor:pointer;text-decoration:none;
}
.doc-btn:active{transform:scale(.96)}
.doc-btn svg{width:14px;height:14px;flex:0 0 14px}
.doc-btn-call{background:var(--brand);color:#fff;box-shadow:0 5px 14px rgba(185,40,130,.28)}
.doc-btn-whats{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;box-shadow:0 5px 14px rgba(18,140,126,.3)}
.doc-btn-map{background:var(--soft);color:var(--primary);border:1px solid var(--line)}

.state{padding:36px 16px;text-align:center;color:var(--muted);font-size:12px}
.loader{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(168,50,214,.15);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-icon{width:52px;height:52px;margin:0 auto 10px;display:grid;place-items:center;border-radius:17px;color:var(--muted);background:var(--soft)}
.empty-icon svg{width:24px;height:24px}

.modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(16,6,20,.58);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .25s,visibility .25s;
}
.modal.show{opacity:1;visibility:visible;pointer-events:auto}
.sheet{
  width:min(760px,100%);max-height:94vh;overflow:hidden;
  border-radius:26px 26px 0 0;background:var(--card-solid);
  box-shadow:0 -20px 70px rgba(0,0,0,.28);
  transform:translateY(35px);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.modal.show .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;flex:0 0 4px;margin:8px auto 4px;border-radius:20px;background:rgba(120,100,130,.25)}
.sheet-head{
  min-height:60px;padding:8px 13px 9px;display:flex;align-items:center;gap:9px;
  background:var(--card-solid);border-bottom:1px solid var(--line);
}
.sheet-close{
  width:38px;height:38px;flex:0 0 38px;
  display:grid;place-items:center;border-radius:12px;
  color:var(--text);background:var(--soft);
}
.sheet-close svg{width:18px;height:18px}
.sheet-title{flex:1;min-width:0}
.sheet-title strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
.sheet-title span{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.sheet-scroll{
  overflow-y:auto;overscroll-behavior:contain;
  padding:14px 14px 26px;-webkit-overflow-scrolling:touch;
}

.doc-profile{
  display:flex;align-items:center;gap:14px;
  padding:14px;border-radius:18px;
  background:var(--brand);color:#fff;
  margin-bottom:14px;position:relative;overflow:hidden;
}
.doc-profile:before{content:"";position:absolute;width:180px;height:180px;right:-80px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);pointer-events:none}
.doc-profile .doc-avatar{
  width:70px;height:70px;flex:0 0 70px;
  border-radius:20px;
  background:rgba(255,255,255,.22);
  border:1.5px solid rgba(255,255,255,.3);
  box-shadow:0 8px 20px rgba(0,0,0,.2);
  font-size:1.8rem;
}
.doc-profile-info{flex:1;min-width:0;position:relative;z-index:1}
.doc-profile-name{font-size:16px;font-weight:950;line-height:1.4;margin-bottom:5px;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.doc-profile-spec{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:800;
  padding:4px 10px;border-radius:20px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);
}
.doc-profile-spec svg{width:12px;height:12px}

.info-block{
  padding:12px 14px;border-radius:14px;
  background:var(--soft);border:1px solid var(--line);
  margin-bottom:10px;
}
.info-block-title{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:900;color:var(--primary);
  margin-bottom:8px;
}
.info-block-title svg{width:15px;height:15px}
.info-row{
  display:flex;align-items:flex-start;gap:8px;
  padding:6px 0;font-size:12px;line-height:1.9;
  font-weight:700;color:var(--text);
}
.info-row + .info-row{border-top:1px solid var(--line)}
.info-row-icon{width:16px;height:16px;flex:0 0 16px;color:var(--primary);margin-top:3px}
.info-row-text{flex:1;min-width:0}
.info-row-text strong{color:var(--primary);font-weight:900}

.doc-about{
  padding:12px 14px;border-radius:14px;
  background:rgba(236,72,153,.06);
  border-right:3px solid var(--pink);
  font-size:12.5px;line-height:2;font-weight:700;color:var(--text);
  margin-bottom:10px;
}

.modal-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.modal-tag{
  padding:5px 10px;border-radius:8px;
  color:var(--primary);background:var(--soft);
  font-size:10px;font-weight:700;
}

.modal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.modal-actions .doc-btn{min-width:100px}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.action{
  min-height:40px;display:flex;align-items:center;justify-content:center;gap:5px;
  border-radius:12px;color:var(--muted);background:var(--card);
  border:1px solid var(--line);font-size:10px;font-weight:800;
  transition:transform .18s;
}
.action:active{transform:scale(.95)}
.action svg{width:15px;height:15px}
.action.speaking{color:var(--primary);background:var(--soft);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.toast{
  position:fixed;z-index:300;right:50%;
  bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translate(50%,20px);max-width:calc(100% - 30px);
  padding:10px 14px;border-radius:12px;
  color:#fff;background:#24162a;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  font-size:11px;font-weight:800;
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(50%,0)}

.bottom-nav{
  position:fixed;z-index:70;right:0;bottom:0;left:0;
  min-height:var(--nav-h);
  padding:6px max(10px,env(safe-area-inset-left))
          calc(6px + env(safe-area-inset-bottom))
          max(10px,env(safe-area-inset-right));
  display:grid;grid-template-columns:1fr 1fr 68px 1fr 1fr;
  align-items:end;gap:2px;
  background:rgba(251,248,255,.86);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--line);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{background:rgba(0,0,0,.88)}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);border-radius:13px;background:transparent;
  font-size:9px;font-weight:800;padding:6px 2px;
  transition:color .18s;
}
.nav-item svg{width:20px;height:20px}
.nav-item.active{color:var(--primary)}
.nav-item:active{transform:scale(.92)}
.nav-fab-slot{position:relative;display:flex;justify-content:center;align-items:flex-end}
.nav-home{
  position:absolute;bottom:0;width:54px;height:54px;border-radius:18px;
  display:grid;place-items:center;color:#fff;background:var(--brand);
  box-shadow:0 10px 24px rgba(185,40,130,.3);
  border:4px solid var(--bg);
}
.nav-home svg{width:23px;height:23px}

button:focus-visible,input:focus-visible{outline:3px solid rgba(168,50,214,.25);outline-offset:2px}
@media (min-width:700px){
  .bottom-nav{width:500px;right:50%;left:auto;transform:translateX(50%);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
  .modal{align-items:center}
  .sheet{max-height:90vh;border-radius:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>

<script>
"use strict";

const DOCTORS_PATH = "data/doctors/doctors.json";
const CACHE_VERSION = "v1";
const THEME_KEY = "bn_theme";

let allDoctors = [];
let currentDoc = null;
let currentSpecialty = null;
let currentView = "categories";
let searchQuery = "";
let speechActive = false;
let toastTimer = null;

const $ = id => document.getElementById(id);
const docList = $("docList");
const searchInput = $("searchInput");
const resultCount = $("resultCount");
const catGrid = $("catGrid");
const categoriesView = $("categoriesView");
const listView = $("listView");
const listTitle = $("listTitle");
const pageTitle = $("pageTitle");
const modal = $("docModal");
const modalTitle = $("modalTitle");
const modalSubtitle = $("modalSubtitle");
const modalScroll = $("modalScroll");
const profileArea = $("profileArea");
const infoArea = $("infoArea");
const aboutArea = $("aboutArea");
const modalTags = $("modalTags");
const modalActions = $("modalActions");
const toastEl = $("toast");

/* THEME */
function getSystemTheme(){
  try{ return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch(e){ return "light"; }
}
function getSavedTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    if(t === "dark" || t === "light") return t;
  }catch(e){}
  return getSystemTheme();
}
function applyTheme(){
  const t = getSavedTheme();
  document.documentElement.setAttribute("data-theme", t);
  document.body.classList.toggle("dark", t === "dark");
  const m = $("themeMeta");
  if(m) m.setAttribute("content", t === "dark" ? "#000000" : "#db2777");
}
applyTheme();

/* HELPERS */
function escapeHTML(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function faNum(n){ return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]); }
function normalizeSearch(v){
  return String(v || "").toLowerCase()
    .replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک")
    .replace(/ۀ/g,"ه").replace(/ة/g,"ه").replace(/ؤ/g,"و")
    .replace(/إ/g,"ا").replace(/أ/g,"ا").replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"").replace(/\s+/g," ").trim();
}
function showToast(msg){
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
}
function cleanPhone(p){
  if(!p) return "";
  let s = String(p).replace(/[^\d+]/g, "");
  if(s.indexOf("+") === 0) return s;
  if(s.indexOf("00") === 0) return "+" + s.slice(2);
  if(s.charAt(0) === "0") return "+93" + s.slice(1);
  return s;
}
function firstLetter(name){
  if(!name) return "؟";
  let n = String(name).trim();
  n = n.replace(/^دکتر\s+/,"").replace(/^استاد\s+/,"").replace(/^خانم\s+/,"").replace(/^آیت\s+الله\s+/,"");
  return n.charAt(0) || "؟";
}

/* NORMALIZE */
function normalizeDoctor(d, idx){
  if(!d || typeof d !== "object") return null;
  return {
    id: String(d.id || ("dr_" + (idx + 1))),
    name: d.name || "پزشک",
    gender: d.gender || "",
    specialty: d.specialty || "عمومی",
    clinic: d.clinic || d.hospital || "",
    city: d.city || "",
    address: d.address || "",
    phone: d.phone || d.tel || "",
    whatsapp: d.whatsapp || d.wa || "",
    hours: d.hours || d.schedule || "",
    experience: d.experience || "",
    education: d.education || "",
    about: d.about || d.bio || "",
    tags: Array.isArray(d.tags) ? d.tags : [],
    photo: d.photo || d.image || "",
    website: d.website || ""
  };
}
function extractDoctors(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.doctors)) return data.doctors;
  if(Array.isArray(data.items)) return data.items;
  if(Array.isArray(data.list)) return data.list;
  if(data.doctors) return [data.doctors];
  if(data.name) return [data];
  return [];
}

/* LOAD */
async function loadDoctors(){
  catGrid.innerHTML = '<div class="state" style="grid-column:span 2"><div class="loader"></div>در حال بارگذاری...</div>';
  try{
    const r = await fetch(DOCTORS_PATH + "?v=" + CACHE_VERSION, {cache:"no-cache"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const arr = extractDoctors(data);
    allDoctors = arr.map(normalizeDoctor).filter(Boolean);
    renderCategories();
    if (window.bnAnalytics) window.bnAnalytics.track("doctors_loaded", { count: allDoctors.length });
  }catch(err){
    console.warn("doctors.json:", err.message);
    allDoctors = [];
    catGrid.innerHTML =
      '<div class="state" style="grid-column:span 2">' +
        '<div class="empty-icon"><svg><use href="#i-stethoscope"></use></svg></div>' +
        '<strong>هنوز پزشکی اضافه نشده</strong>' +
        '<div style="margin-top:6px;font-size:10px">' +
          'فایل: <b>data/doctors/doctors.json</b>' +
        '</div>' +
      '</div>';
  }
}

/* CATEGORIES */
function renderCategories(){
  const counts = {};
  allDoctors.forEach(d => {
    counts[d.specialty] = (counts[d.specialty] || 0) + 1;
  });

  let html = `
    <button class="cat-card" data-cat="__all__" type="button">
      <div class="cat-icon"><svg><use href="#i-stethoscope"></use></svg></div>
      <div class="cat-title">همه پزشکان</div>
      <span class="cat-count">${faNum(allDoctors.length)} پزشک</span>
    </button>
  `;

  Object.keys(counts).sort().forEach(sp => {
    html += `
      <button class="cat-card" data-cat="${escapeHTML(sp)}" type="button">
        <div class="cat-icon"><svg><use href="#i-medal"></use></svg></div>
        <div class="cat-title">${escapeHTML(sp)}</div>
        <span class="cat-count">${faNum(counts[sp])} پزشک</span>
      </button>
    `;
  });

  catGrid.innerHTML = html;
}

/* VIEW */
function openSpecialty(catId){
  currentSpecialty = catId === "__all__" ? null : catId;
  currentView = "list";
  categoriesView.classList.add("hidden");
  listView.classList.remove("hidden");
  const title = catId === "__all__" ? "همه پزشکان" : catId;
  pageTitle.textContent = title;
  listTitle.innerHTML = '<svg><use href="#i-stethoscope"></use></svg><span>' + escapeHTML(title) + '</span>';
  applyFilters();
  window.scrollTo({top:0,behavior:"smooth"});

  if (window.bnAnalytics) window.bnAnalytics.track("doctors_specialty", { specialty: title });
}

function backToCategories(){
  currentSpecialty = null;
  currentView = "categories";
  listView.classList.add("hidden");
  categoriesView.classList.remove("hidden");
  pageTitle.textContent = "پزشکان";
  searchInput.value = "";
  searchQuery = "";
  window.scrollTo({top:0,behavior:"smooth"});
}

/* FILTER */
function applyFilters(){
  const q = normalizeSearch(searchQuery);
  let filtered = allDoctors.slice();

  if(currentSpecialty){
    filtered = filtered.filter(d => d.specialty === currentSpecialty);
  }
  if(q){
    filtered = filtered.filter(d => {
      const hay = normalizeSearch([
        d.name, d.specialty, d.clinic, d.city, d.address,
        d.experience, d.education, d.about, (d.tags || []).join(" ")
      ].join(" "));
      return hay.includes(q);
    });
  }
  renderDoctors(filtered);
}

function renderDoctors(list){
  if(!list.length){
    docList.innerHTML =
      '<div class="state">' +
        '<div class="empty-icon"><svg><use href="#i-search"></use></svg></div>' +
        '<strong>موردی پیدا نشد</strong>' +
      '</div>';
    resultCount.textContent = "۰ پزشک";
    return;
  }
  resultCount.textContent = faNum(list.length) + " پزشک";

  docList.innerHTML = list.map(d => {
    const phone = cleanPhone(d.phone);
    const whats = cleanPhone(d.whatsapp || d.phone);
    const avatarContent = d.photo
      ? '<img src="' + escapeHTML(d.photo) + '" alt="' + escapeHTML(d.name) + '" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + escapeHTML(firstLetter(d.name)) + '\'">'
      : escapeHTML(firstLetter(d.name));

    const metaBits = [];
    if(d.clinic || d.city) metaBits.push(
      '<div class="doc-meta-item">' +
        '<svg><use href="#i-hospital"></use></svg>' +
        '<div><strong>' + escapeHTML(d.clinic || "") + '</strong>' +
        (d.city ? (d.clinic ? ' — ' : '') + escapeHTML(d.city) : "") + '</div>' +
      '</div>'
    );
    if(d.address) metaBits.push(
      '<div class="doc-meta-item">' +
        '<svg><use href="#i-map"></use></svg>' +
        '<div>' + escapeHTML(d.address) + '</div>' +
      '</div>'
    );
    if(d.hours) metaBits.push(
      '<div class="doc-meta-item">' +
        '<svg><use href="#i-clock"></use></svg>' +
        '<div>' + escapeHTML(d.hours) + '</div>' +
      '</div>'
    );

    return `
      <article class="doc-card" data-id="${escapeHTML(d.id)}" role="button" tabindex="0">
        <div class="doc-head">
          <div class="doc-avatar">${avatarContent}</div>
          <div class="doc-info">
            <div class="doc-name">${escapeHTML(d.name)}</div>
            <span class="doc-specialty">
              <svg><use href="#i-stethoscope"></use></svg>
              ${escapeHTML(d.specialty)}
            </span>
          </div>
        </div>
        ${metaBits.length ? '<div class="doc-meta">' + metaBits.join("") + '</div>' : ''}
        <div class="doc-actions">
          ${phone ? '<a class="doc-btn doc-btn-call" href="tel:' + escapeHTML(phone) + '" data-stop="1"><svg><use href="#i-phone"></use></svg>تماس</a>' : ''}
          ${whats ? '<a class="doc-btn doc-btn-whats" href="https://wa.me/' + escapeHTML(whats.replace("+","")) + '" target="_blank" rel="noopener" data-stop="1"><svg><use href="#i-whatsapp"></use></svg>واتساپ</a>' : ''}
          <button class="doc-btn doc-btn-map" data-open="${escapeHTML(d.id)}" type="button"><svg><use href="#i-info"></use></svg>جزئیات</button>
        </div>
      </article>
    `;
  }).join("");
}

/* OPEN DOCTOR */
function findDoctor(id){ return allDoctors.find(d => d.id === String(id)); }

function openDoctor(id){
  const d = findDoctor(id);
  if(!d) return;
  currentDoc = d;

  modalTitle.textContent = d.name;
  modalSubtitle.textContent = d.specialty || "پزشک";

  const phone = cleanPhone(d.phone);
  const whats = cleanPhone(d.whatsapp || d.phone);

  const avatarContent = d.photo
    ? '<img src="' + escapeHTML(d.photo) + '" alt="' + escapeHTML(d.name) + '" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + escapeHTML(firstLetter(d.name)) + '\'">'
    : escapeHTML(firstLetter(d.name));

  profileArea.innerHTML = `
    <div class="doc-profile">
      <div class="doc-avatar">${avatarContent}</div>
      <div class="doc-profile-info">
        <div class="doc-profile-name">${escapeHTML(d.name)}</div>
        <span class="doc-profile-spec">
          <svg><use href="#i-stethoscope"></use></svg>
          ${escapeHTML(d.specialty)}
        </span>
      </div>
    </div>
  `;

  const rows = [];
  if(d.clinic) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-hospital"></use></svg>
      <div class="info-row-text"><strong>کلینیک:</strong> ${escapeHTML(d.clinic)}</div>
    </div>
  `);
  if(d.city) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-map"></use></svg>
      <div class="info-row-text"><strong>شهر:</strong> ${escapeHTML(d.city)}</div>
    </div>
  `);
  if(d.address) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-map"></use></svg>
      <div class="info-row-text"><strong>آدرس:</strong> ${escapeHTML(d.address)}</div>
    </div>
  `);
  if(d.hours) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-clock"></use></svg>
      <div class="info-row-text"><strong>ساعات کاری:</strong> ${escapeHTML(d.hours)}</div>
    </div>
  `);
  if(d.experience) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-medal"></use></svg>
      <div class="info-row-text"><strong>سابقه:</strong> ${escapeHTML(d.experience)}</div>
    </div>
  `);
  if(d.education) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-medal"></use></svg>
      <div class="info-row-text"><strong>تحصیلات:</strong> ${escapeHTML(d.education)}</div>
    </div>
  `);
  if(d.phone) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-phone"></use></svg>
      <div class="info-row-text"><strong>تلفن:</strong> ${escapeHTML(d.phone)}</div>
    </div>
  `);
  if(d.whatsapp) rows.push(`
    <div class="info-row">
      <svg class="info-row-icon"><use href="#i-whatsapp"></use></svg>
      <div class="info-row-text"><strong>واتساپ:</strong> ${escapeHTML(d.whatsapp)}</div>
    </div>
  `);

  if(rows.length){
    infoArea.innerHTML = `
      <div class="info-block">
        <div class="info-block-title"><svg><use href="#i-info"></use></svg>اطلاعات تماس</div>
        ${rows.join("")}
      </div>
    `;
  } else {
    infoArea.innerHTML = "";
  }

  aboutArea.innerHTML = d.about
    ? '<div class="doc-about">' + escapeHTML(d.about).replace(/\n/g, "<br>") + '</div>'
    : '';

  if(d.tags && d.tags.length){
    modalTags.innerHTML = d.tags.map(t => '<span class="modal-tag">' + escapeHTML(t) + '</span>').join("");
    modalTags.style.display = "flex";
  } else {
    modalTags.innerHTML = "";
    modalTags.style.display = "none";
  }

  let actions = "";
  if(phone) actions += '<a class="doc-btn doc-btn-call" href="tel:' + escapeHTML(phone) + '"><svg><use href="#i-phone"></use></svg>تماس</a>';
  if(whats) actions += '<a class="doc-btn doc-btn-whats" href="https://wa.me/' + escapeHTML(whats.replace("+","")) + '" target="_blank" rel="noopener"><svg><use href="#i-whatsapp"></use></svg>واتساپ</a>';
  if(d.address) actions += '<a class="doc-btn doc-btn-map" href="https://www.google.com/maps/search/' + encodeURIComponent(d.address) + '" target="_blank" rel="noopener"><svg><use href="#i-map"></use></svg>نقشه</a>';
  if(d.website) actions += '<a class="doc-btn doc-btn-map" href="' + escapeHTML(d.website) + '" target="_blank" rel="noopener"><svg><use href="#i-globe"></use></svg>وب‌سایت</a>';
  modalActions.innerHTML = actions;

  modal.classList.add("show");
  document.body.style.overflow = "hidden";
  modalScroll.scrollTop = 0;

  if (window.bnAnalytics) window.bnAnalytics.track("doctor_open", { id: d.id, specialty: d.specialty });
}

function closeModal(){
  stopSpeech();
  modal.classList.remove("show");
  document.body.style.overflow = "";
  currentDoc = null;
  profileArea.innerHTML = "";
  infoArea.innerHTML = "";
  aboutArea.innerHTML = "";
  modalTags.innerHTML = "";
  modalActions.innerHTML = "";
}

/* COPY / SHARE / SPEAK */
function doctorText(d){
  const lines = [d.name];
  if(d.specialty) lines.push("تخصص: " + d.specialty);
  if(d.clinic) lines.push("کلینیک: " + d.clinic);
  if(d.city) lines.push("شهر: " + d.city);
  if(d.address) lines.push("آدرس: " + d.address);
  if(d.hours) lines.push("ساعات کاری: " + d.hours);
  if(d.experience) lines.push("سابقه: " + d.experience);
  if(d.education) lines.push("تحصیلات: " + d.education);
  if(d.phone) lines.push("تلفن: " + d.phone);
  if(d.whatsapp) lines.push("واتساپ: " + d.whatsapp);
  if(d.about) lines.push("", d.about);
  return lines.join("\n");
}
async function copyDoctor(){
  if(!currentDoc) return;
  const text = doctorText(currentDoc);
  try{ await navigator.clipboard.writeText(text); showToast("متن کپی شد"); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); showToast("متن کپی شد"); }
    catch(x){ showToast("کپی نشد"); }
    ta.remove();
  }
}
async function shareDoctor(){
  if(!currentDoc) return;
  const text = doctorText(currentDoc) + "\n\n— بانوان نور";
  try{
    if(navigator.share) await navigator.share({title: currentDoc.name, text});
    else { await navigator.clipboard.writeText(text); showToast("متن کپی شد"); }
  }catch(e){}
}
function speakDoctor(){
  if(!currentDoc) return;
  if(!("speechSynthesis" in window)){ showToast("پشتیبانی نمی‌شود"); return; }
  const btn = $("speakBtn");
  if(speechActive){
    speechSynthesis.cancel();
    speechActive = false;
    btn.classList.remove("speaking");
    btn.innerHTML = '<svg><use href="#i-speak"></use></svg>خواندن';
    return;
  }
  const text = doctorText(currentDoc);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fa-IR"; u.rate = .95; u.pitch = 1;
  u.onstart = () => {
    speechActive = true;
    btn.classList.add("speaking");
    btn.innerHTML = '<svg><use href="#i-speak"></use></svg>توقف';
  };
  u.onend = u.onerror = () => {
    speechActive = false;
    btn.classList.remove("speaking");
    btn.innerHTML = '<svg><use href="#i-speak"></use></svg>خواندن';
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function stopSpeech(){
  if("speechSynthesis" in window) speechSynthesis.cancel();
  speechActive = false;
  const btn = $("speakBtn");
  if(btn){
    btn.classList.remove("speaking");
    btn.innerHTML = '<svg><use href="#i-speak"></use></svg>خواندن';
  }
}

/* EVENTS */
catGrid.addEventListener("click", e => {
  const c = e.target.closest("[data-cat]");
  if(c) openSpecialty(c.dataset.cat);
});

docList.addEventListener("click", e => {
  if(e.target.closest("[data-stop]")) return;
  const openBtn = e.target.closest("[data-open]");
  if(openBtn){ e.stopPropagation(); openDoctor(openBtn.dataset.open); return; }
  const card = e.target.closest("[data-id]");
  if(card) openDoctor(card.dataset.id);
});

$("backCatBtn").addEventListener("click", backToCategories);
$("backBtn").addEventListener("click", () => {
  if(modal.classList.contains("show")){ closeModal(); return; }
  if(currentView === "list"){ backToCategories(); return; }
  if(document.referrer && document.referrer.indexOf(location.origin) === 0){
    history.back();
  } else {
    location.href = "home.html";
  }
});

let searchTimer = null;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchInput.value || "";
    if(searchQuery.trim() && currentView === "categories"){
      currentView = "list";
      currentSpecialty = null;
      categoriesView.classList.add("hidden");
      listView.classList.remove("hidden");
      pageTitle.textContent = "نتایج جستجو";
      listTitle.innerHTML = '<svg><use href="#i-search"></use></svg><span>نتایج جستجو</span>';
    } else if(!searchQuery.trim() && currentView === "list" && !currentSpecialty){
      backToCategories();
      return;
    }
    applyFilters();
  }, 180);
});

$("topSearchBtn").addEventListener("click", () => { searchInput.focus(); window.scrollTo({top:0,behavior:"smooth"}); });
$("navSearch").addEventListener("click", () => { searchInput.focus(); window.scrollTo({top:0,behavior:"smooth"}); });
$("navHome").addEventListener("click", () => { location.href = "home.html"; });
$("navHamraz").addEventListener("click", () => { location.href = "hamraz.html"; });
$("navAhkam").addEventListener("click", () => { location.href = "ahkam.html"; });
$("navMore").addEventListener("click", () => { location.href = "settings.html"; });

$("closeModal").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
$("copyBtn").addEventListener("click", copyDoctor);
$("shareBtn").addEventListener("click", shareDoctor);
$("speakBtn").addEventListener("click", speakDoctor);

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && modal.classList.contains("show")) closeModal();
});

window.addEventListener("storage", e => {
  if(e.key === THEME_KEY) applyTheme();
  if(e.key === "bn_lang") location.reload();
});

/* START */
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", loadDoctors);
else loadDoctors();
