<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ec4899" />
<title>پزشکان | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
:root{
  --bg-1:#fdf2f8;--bg-2:#fce7f3;--bg-3:#fbcfe8;--bg-4:#f9a8d4;
  --text:#831843;--text-soft:#9d174d;--text-card:#831843;--text-muted:#9d174d;
  --card:rgba(255,255,255,.85);--card-border:rgba(236,72,153,.2);
  --card-shadow:0 8px 22px rgba(190,24,93,.12);
  --icon-bg:rgba(255,255,255,.85);--icon-border:rgba(236,72,153,.25);--icon-color:#be185d;
  --nav-bg:rgba(255,255,255,.94);--nav-border:rgba(236,72,153,.2);
  --nav-color:#9d174d;--nav-active:#be185d;
  --star:.2;
  --search-bg:rgba(255,255,255,.92);
  --chip-bg:rgba(255,255,255,.7);
  --chip-border:rgba(236,72,153,.25);
  --accent:#ec4899;
  --accent-dark:#be185d;
  --pink-soft:rgba(236,72,153,.1);
}
body.dark{
  --bg-1:#500724;--bg-2:#831843;--bg-3:#9d174d;--bg-4:#4c0519;
  --text:#fff;--text-soft:#fbcfe8;--text-card:#fff;--text-muted:#f9a8d4;
  --card:rgba(255,255,255,.08);--card-border:rgba(244,114,182,.3);
  --card-shadow:0 8px 22px rgba(0,0,0,.3);
  --icon-bg:rgba(255,255,255,.08);--icon-border:rgba(244,114,182,.3);--icon-color:#fbcfe8;
  --nav-bg:rgba(58,7,29,.94);--nav-border:rgba(244,114,182,.25);
  --nav-color:#f9a8d4;--nav-active:#fbcfe8;
  --star:.7;
  --search-bg:rgba(255,255,255,.08);
  --chip-bg:rgba(255,255,255,.06);
  --chip-border:rgba(244,114,182,.3);
  --pink-soft:rgba(244,114,182,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%}
body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl;font-size:17px;
  line-height:1.8;font-weight:600;color:var(--text);background-color:var(--bg-1);
  background-image:
    radial-gradient(ellipse 500px 400px at 20% 5%,rgba(236,72,153,.15) 0,transparent 60%),
    radial-gradient(ellipse 400px 350px at 85% 15%,rgba(244,114,182,.18) 0,transparent 65%),
    linear-gradient(160deg,var(--bg-1) 0,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%,var(--bg-4) 100%);
  background-attachment:fixed;min-height:100vh;padding:0 0 110px;position:relative;overflow-x:hidden;
  transition:background-color .4s,color .3s;
}
body::before{
  content:"";position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 12% 8%,rgba(253,230,138,var(--star)) 0,transparent 1.2%),
    radial-gradient(circle at 88% 6%,rgba(253,230,138,var(--star)) 0,transparent 1%),
    radial-gradient(circle at 78% 45%,rgba(253,230,138,var(--star)) 0,transparent 1%);
  pointer-events:none;z-index:0;
}
.app{max-width:520px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

.page-header{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
.back-btn{
  width:44px;height:44px;border-radius:14px;background:var(--icon-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--icon-border);color:var(--icon-color);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex:0 0 44px;text-decoration:none;box-shadow:0 4px 12px rgba(236,72,153,.15);
}
.back-btn:active{transform:scale(.94)}
.back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
.page-header h1{font-size:1.35rem;font-weight:900;color:var(--text);flex:1;text-align:center;padding-right:44px}

.hero{
  background:linear-gradient(135deg,#f9a8d4 0,#be185d 100%);
  border-radius:20px;padding:22px;margin-bottom:16px;color:#fff;
  position:relative;overflow:hidden;
  box-shadow:0 12px 30px rgba(190,24,93,.35);
  display:flex;align-items:center;gap:14px;
}
.hero::before{
  content:"";position:absolute;top:-40px;right:-40px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);
  pointer-events:none;
}
.hero-icon{
  width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;flex:0 0 56px;
  backdrop-filter:blur(10px);
}
.hero-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero-text{flex:1}
.hero-title{font-size:1.1rem;font-weight:900;margin-bottom:5px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero-sub{font-size:.85rem;opacity:.95;font-weight:700;line-height:1.7}

.search-wrap{position:relative;margin-bottom:12px}
.search-input{
  width:100%;padding:14px 48px 14px 18px;border-radius:16px;
  border:1.5px solid var(--card-border);background:var(--search-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);font-family:inherit;font-size:.95rem;font-weight:700;
  outline:none;transition:border-color .25s;
}
.search-input:focus{border-color:rgba(236,72,153,.7)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--text-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

.chips{
  display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;
  scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 16px;border-radius:20px;
  background:var(--chip-bg);border:1.5px solid var(--chip-border);
  color:var(--text-soft);font-family:inherit;font-size:.8rem;
  font-weight:800;cursor:pointer;transition:all .22s;white-space:nowrap;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:6px;
}
.chip:active{transform:scale(.96)}
.chip.active{
  background:linear-gradient(135deg,#ec4899,#be185d);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(236,72,153,.4);
}
.chip .chip-count{
  font-size:.68rem;background:rgba(255,255,255,.25);
  padding:1px 7px;border-radius:10px;font-weight:900;
}

.filter-count{
  font-size:.82rem;font-weight:800;color:var(--text-muted);
  margin:0 4px 14px;
}

.doc-list{display:flex;flex-direction:column;gap:12px}
.doc-card{
  background:var(--card);backdrop-filter:blur(20px);
  border:1.5px solid var(--card-border);border-radius:18px;
  padding:16px;box-shadow:var(--card-shadow);
  transition:all .22s;position:relative;overflow:hidden;
}
.doc-card:active{transform:scale(.99)}
.doc-head{
  display:flex;align-items:center;gap:12px;
  margin-bottom:12px;
}
.doc-avatar{
  width:56px;height:56px;border-radius:16px;flex:0 0 56px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#f9a8d4,#be185d);
  color:#fff;font-weight:900;
  font-size:1.5rem;
  box-shadow:0 6px 14px rgba(190,24,93,.3);
  overflow:hidden;position:relative;
}
.doc-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.doc-info{flex:1;min-width:0}
.doc-name{
  font-size:1.02rem;font-weight:900;color:var(--text-card);
  line-height:1.4;margin-bottom:4px;
}
.doc-specialty{
  font-size:.78rem;font-weight:800;color:var(--accent);
  display:inline-flex;align-items:center;gap:5px;
  background:var(--pink-soft);padding:3px 10px;border-radius:12px;
}
.doc-specialty svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.doc-meta{
  display:flex;flex-direction:column;gap:8px;
  padding-top:12px;border-top:1px dashed var(--card-border);
  margin-bottom:12px;
}
.doc-meta-item{
  display:flex;align-items:flex-start;gap:8px;
  font-size:.84rem;font-weight:700;color:var(--text-card);
  line-height:1.7;
}
.doc-meta-item svg{
  width:16px;height:16px;flex:0 0 16px;margin-top:3px;
  fill:none;stroke:var(--accent);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
}
.doc-meta-item strong{color:var(--text);font-weight:900}

.doc-actions{
  display:flex;gap:8px;
}
.doc-btn{
  flex:1;padding:11px 12px;border-radius:12px;border:0;
  font-family:inherit;font-size:.82rem;font-weight:900;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  text-decoration:none;
}
.doc-btn:active{transform:scale(.96)}
.doc-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px}
.doc-btn-call{
  background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;
  box-shadow:0 4px 12px rgba(190,24,93,.3);
}
.doc-btn-whats{
  background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;
  box-shadow:0 4px 12px rgba(18,140,126,.3);
}
.doc-btn-map{
  background:var(--chip-bg);color:var(--text-soft);
  border:1.5px solid var(--chip-border);
}

.loader,.empty{
  text-align:center;padding:50px 20px;
  color:var(--text-muted);font-size:.95rem;font-weight:700;line-height:2;
}
.loader::before{
  content:"";display:block;width:32px;height:32px;
  border:3px solid rgba(236,72,153,.2);border-top-color:#ec4899;
  border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:10000;padding:0;
}
.modal.show{display:flex;animation:mFade .3s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--bg-1);border-radius:28px 28px 0 0;
  padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));
  animation:mSlide .35s ease;
}
@keyframes mSlide{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:18px;padding-bottom:14px;
  border-bottom:1.5px solid var(--card-border);gap:12px;
}
.modal-head-text{flex:1;min-width:0}
.modal-badge{
  display:inline-block;font-size:.75rem;font-weight:900;
  padding:4px 14px;border-radius:20px;
  background:linear-gradient(135deg,#ec4899,#be185d);
  color:#fff;margin-bottom:10px;box-shadow:0 4px 12px rgba(190,24,93,.35);
}
.modal-q{font-size:1.15rem;font-weight:900;color:var(--text);line-height:1.7}
.modal-close{
  width:44px;height:44px;border-radius:14px;
  background:var(--card);border:1px solid var(--card-border);
  color:var(--text-soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 44px;
}
.modal-close:active{transform:scale(.9)}
.modal-close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.modal-content{
  background:var(--pink-soft);
  border:1px solid var(--card-border);border-radius:18px;
  padding:18px;margin-top:6px;
}
.answer-text{
  font-size:.95rem;line-height:2.1;color:var(--text-card);
  font-weight:700;white-space:pre-line;
}
.answer-text strong{color:var(--accent);font-weight:900}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.modal-tag{
  font-size:.72rem;font-weight:800;padding:4px 12px;
  border-radius:20px;background:rgba(236,72,153,.12);
  color:var(--text-soft);border:1px solid var(--card-border);
}
.modal-actions{
  display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
}
.modal-actions .doc-btn{flex:1;min-width:100px}

.action-bar{
  display:flex;gap:4px;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--card-border);flex-wrap:wrap;
}
.act-btn{
  width:40px;height:40px;border-radius:11px;
  background:transparent;border:1px solid transparent;
  color:var(--text-muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .18s;
}
.act-btn:hover{background:var(--icon-bg);border-color:var(--icon-border);color:var(--icon-color)}
.act-btn:active{transform:scale(.88)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act-btn.speaking{color:#be185d;background:rgba(190,24,93,.12);animation:pulse 1.1s infinite}
body.dark .act-btn.speaking{color:#fbcfe8;background:rgba(251,207,232,.15)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(24px);
  border-top:1px solid var(--nav-border);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;
  box-shadow:0 -8px 30px rgba(190,24,93,.15);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--nav-color);padding:8px 2px;font-size:.68rem;font-weight:800;
  text-decoration:none;cursor:pointer;border-radius:12px;position:relative;
}
.nav-item.active{color:var(--nav-active)}
.nav-item.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,#ec4899,#a855f7,#fde68a);
  box-shadow:0 0 12px rgba(236,72,153,.8);
}
.nav-item svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke-width:2.4}

.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#be185d,#ec4899);color:#fff;
  padding:14px 26px;border-radius:30px;font-size:.95rem;font-weight:900;
  z-index:10002;opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:0 12px 30px rgba(236,72,153,.5);max-width:90vw;text-align:center;
  white-space:pre-line;line-height:1.7;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:380px){
  body{font-size:16px}
  .app{padding:0 12px}
  .page-header h1{font-size:1.2rem}
  .hero{padding:18px}
  .hero-icon{width:48px;height:48px;flex:0 0 48px}
  .hero-icon svg{width:24px;height:24px}
  .doc-avatar{width:48px;height:48px;flex:0 0 48px;font-size:1.3rem}
  .doc-name{font-size:.95rem}
  .doc-btn{font-size:.75rem;padding:10px 8px}
  .nav-item{font-size:.62rem}
  .nav-item svg{width:21px;height:21px}
}
</style>
</head>

<body>

<script>
(function(){
  try{ if(localStorage.getItem('bn_theme')==='dark') document.body.classList.add('dark'); }catch(e){}
})();
</script>

<div class="app">

  <header class="page-header">
    <a class="back-btn" href="home.html" aria-label="بازگشت">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <h1>پزشکان</h1>
  </header>

  <div class="hero">
    <div class="hero-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2v20M5 7l7-5 7 5"/><circle cx="12" cy="12" r="3" fill="#fff" opacity="0.6"/></svg>
    </div>
    <div class="hero-text">
      <div class="hero-title">پزشکان متخصص بانوان</div>
      <div class="hero-sub">۲۰ پزشک در کابل 💗</div>
    </div>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" class="search-input" id="searchInput" placeholder="جستجوی نام، تخصص یا کلینیک..." />
  </div>

  <div class="chips" id="chips"></div>

  <div class="filter-count" id="filterCount">—</div>

  <div class="doc-list" id="docList">
    <div class="loader">در حال بارگذاری...</div>
  </div>

  <div style="height:20px"></div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="home.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>خانه</span>
  </a>
  <a class="nav-item" href="search.html">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <span>جستجو</span>
  </a>
  <a class="nav-item" href="hamraz.html">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>همراز</span>
  </a>
  <a class="nav-item" href="ahkam.html">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>احکام</span>
  </a>
  <a class="nav-item" href="settings.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>بیشتر</span>
  </a>
</nav>

<div class="modal" id="docModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-head-text">
        <span class="modal-badge" id="modalBadge">پزشک</span>
        <div class="modal-q" id="modalTitle">—</div>
      </div>
      <button class="modal-close" id="modalClose" type="button" aria-label="بستن">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-content">
      <div class="answer-text" id="modalContent">—</div>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-actions" id="modalActions"></div>
      <div class="action-bar">
        <button class="act-btn" data-doc-act="copy" title="کپی">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="act-btn" data-doc-act="share" title="اشتراک‌گذاری">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
        </button>
        <button class="act-btn" data-doc-act="speak" title="خواندن صوتی">
          <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var DOCTORS_PATH = 'data/doctors/doctors.json';

var allDoctors = [];
var currentDoc = null;
var currentSpecialty = 'all';
var searchQuery = '';
var speechBtn = null;
var toastTimer = null;

/* ═══ HELPERS ═══ */
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function faNum(n){ return String(n).replace(/\d/g,function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
function showMsg(msg,dur){
  dur=dur||2200;
  var t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },dur);
}
function getTheme(){ try{ return localStorage.getItem('bn_theme')||'light'; }catch(e){ return 'light'; } }
function applyTheme(){
  if(getTheme()==='dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}

function firstLetter(name){
  if(!name) return '؟';
  var n = String(name).trim();
  n = n.replace(/^دکتر\s+/, '').replace(/^استاد\s+/, '').replace(/^خانم\s+/, '');
  return n.charAt(0) || '؟';
}

function cleanPhone(p){
  if(!p) return '';
  var s = String(p).replace(/[^\d+]/g, '');
  if(s.indexOf('+') === 0) return s;
  if(s.indexOf('00') === 0) return '+' + s.slice(2);
  if(s.charAt(0) === '0') return '+93' + s.slice(1);
  return s;
}

/* ═══ LOAD ═══ */
function fetchJSON(path){
  return fetch(path).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function normalizeDoctor(d, idx){
  if(!d) return null;
  return {
    id: String(d.id || ('dr_'+(idx+1))),
    name: d.name || 'پزشک',
    gender: d.gender || '',
    specialty: d.specialty || 'عمومی',
    clinic: d.clinic || '',
    city: d.city || '',
    address: d.address || '',
    phone: d.phone || '',
    whatsapp: d.whatsapp || '',
    hours: d.hours || '',
    experience: d.experience || '',
    education: d.education || '',
    about: d.about || '',
    tags: Array.isArray(d.tags) ? d.tags : [],
    photo: d.photo || '',
    website: d.website || '',
    instagram: d.instagram || ''
  };
}

function extractDoctors(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.doctors)) return data.doctors;
  if(Array.isArray(data.items)) return data.items;
  if(Array.isArray(data.list)) return data.list;
  if(Array.isArray(data.data)) return data.data;
  if(data.doctors) return [data.doctors];
  if(data.name) return [data];
  return [];
}

function loadDoctors(){
  return fetchJSON(DOCTORS_PATH)
    .then(function(data){
      var arr = extractDoctors(data);
      allDoctors = arr.map(function(d,i){ return normalizeDoctor(d,i); }).filter(Boolean);
      renderChips();
      renderDoctors();
      return allDoctors;
    })
    .catch(function(err){
      console.warn('doctors.json:', err.message);
      allDoctors = [];
      $('docList').innerHTML = '<div class="empty">هنوز پزشکی اضافه نشده<br><br><span style="font-size:.85rem;opacity:.8">فایل: <strong>data/doctors/doctors.json</strong></span></div>';
      return [];
    });
}

/* ═══ CHIPS ═══ */
function renderChips(){
  var wrap = $('chips');
  if(!wrap) return;
  var specialties = {};
  allDoctors.forEach(function(d){
    specialties[d.specialty] = (specialties[d.specialty] || 0) + 1;
  });

  var html = '<button class="chip active" data-spec="all">' +
    '<span>همه</span>' +
    '<span class="chip-count">' + faNum(allDoctors.length) + '</span>' +
  '</button>';

  Object.keys(specialties).sort().forEach(function(sp){
    html += '<button class="chip" data-spec="' + escapeHtml(sp) + '">' +
      '<span>' + escapeHtml(sp) + '</span>' +
      '<span class="chip-count">' + faNum(specialties[sp]) + '</span>' +
    '</button>';
  });

  wrap.innerHTML = html;
  wrap.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      wrap.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      currentSpecialty = chip.getAttribute('data-spec');
      renderDoctors();
    });
  });
}

/* ═══ RENDER DOCTORS ═══ */
function renderDoctors(){
  var list = $('docList');
  if(!list) return;
  var filtered = allDoctors.slice();

  if(currentSpecialty !== 'all'){
    filtered = filtered.filter(function(d){ return d.specialty === currentSpecialty; });
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase().trim();
    filtered = filtered.filter(function(d){
      return d.name.toLowerCase().indexOf(q) > -1 ||
             d.specialty.toLowerCase().indexOf(q) > -1 ||
             d.clinic.toLowerCase().indexOf(q) > -1 ||
             d.city.toLowerCase().indexOf(q) > -1 ||
             d.address.toLowerCase().indexOf(q) > -1 ||
             d.tags.some(function(t){ return String(t).toLowerCase().indexOf(q) > -1; });
    });
  }

  var cnt = $('filterCount');
  if(cnt) cnt.textContent = faNum(filtered.length) + ' پزشک یافت شد';

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">' +
      (searchQuery ? 'برای «' + escapeHtml(searchQuery) + '» پزشکی یافت نشد' : 'پزشکی در این تخصص یافت نشد') +
    '</div>';
    return;
  }

  var html = '';
  filtered.forEach(function(d){
    var phone = cleanPhone(d.phone);
    var whats = cleanPhone(d.whatsapp || d.phone);
    var avatarContent = d.photo
      ? '<img src="' + escapeHtml(d.photo) + '" alt="' + escapeHtml(d.name) + '" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + escapeHtml(firstLetter(d.name)) + '\'" />'
      : escapeHtml(firstLetter(d.name));

    html += '<div class="doc-card" data-id="' + escapeHtml(d.id) + '">' +
      '<div class="doc-head">' +
        '<div class="doc-avatar">' + avatarContent + '</div>' +
        '<div class="doc-info">' +
          '<div class="doc-name">' + escapeHtml(d.name) + '</div>' +
          '<span class="doc-specialty">' +
            '<svg viewBox="0 0 24 24"><path d="M12 2v20M5 7l7-5 7 5"/></svg>' +
            escapeHtml(d.specialty) +
          '</span>' +
        '</div>' +
      '</div>' +

      '<div class="doc-meta">' +
        (d.clinic ? '<div class="doc-meta-item">' +
          '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>' +
          '<div><strong>' + escapeHtml(d.clinic) + '</strong>' +
          (d.city ? ' — ' + escapeHtml(d.city) : '') + '</div>' +
        '</div>' : '') +
        (d.address ? '<div class="doc-meta-item">' +
          '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
          '<div>' + escapeHtml(d.address) + '</div>' +
        '</div>' : '') +
        (d.hours ? '<div class="doc-meta-item">' +
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
          '<div>' + escapeHtml(d.hours) + '</div>' +
        '</div>' : '') +
        (d.experience ? '<div class="doc-meta-item">' +
          '<svg viewBox="0 0 24 24"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>' +
          '<div>سابقه: <strong>' + escapeHtml(d.experience) + '</strong></div>' +
        '</div>' : '') +
      '</div>' +

      '<div class="doc-actions">' +
        (phone ? '<a class="doc-btn doc-btn-call" href="tel:' + escapeHtml(phone) + '">' +
          '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
          'تماس' +
        '</a>' : '') +
        (whats ? '<a class="doc-btn doc-btn-whats" href="https://wa.me/' + escapeHtml(whats.replace('+','')) + '" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
          'واتساپ' +
        '</a>' : '') +
        '<button class="doc-btn doc-btn-map" data-detail="' + escapeHtml(d.id) + '" type="button">' +
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>' +
          'جزئیات' +
        '</button>' +
      '</div>' +
    '</div>';
  });

  list.innerHTML = html;

  list.querySelectorAll('[data-detail]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      openDoctor(btn.getAttribute('data-detail'));
    });
  });

  list.querySelectorAll('.doc-card').forEach(function(card){
    card.addEventListener('click', function(e){
      if(e.target.closest('a')) return;
      if(e.target.closest('[data-detail]')) return;
      openDoctor(card.getAttribute('data-id'));
    });
  });
}

/* ═══ OPEN MODAL ═══ */
function openDoctor(id){
  var d = null;
  for(var i=0; i<allDoctors.length; i++){
    if(allDoctors[i].id === id){ d = allDoctors[i]; break; }
  }
  if(!d) return;
  currentDoc = d;

  $('modalBadge').textContent = d.specialty || 'پزشک';
  $('modalTitle').textContent = d.name;

  var lines = [];
  if(d.clinic) lines.push('<strong>کلینیک:</strong> ' + escapeHtml(d.clinic));
  if(d.city) lines.push('<strong>شهر:</strong> ' + escapeHtml(d.city));
  if(d.address) lines.push('<strong>آدرس:</strong> ' + escapeHtml(d.address));
  if(d.hours) lines.push('<strong>ساعات کاری:</strong> ' + escapeHtml(d.hours));
  if(d.experience) lines.push('<strong>سابقه:</strong> ' + escapeHtml(d.experience));
  if(d.education) lines.push('<strong>تحصیلات:</strong> ' + escapeHtml(d.education));
  if(d.phone) lines.push('<strong>تلفن:</strong> ' + escapeHtml(d.phone));
  if(d.whatsapp) lines.push('<strong>واتساپ:</strong> ' + escapeHtml(d.whatsapp));
  if(d.about) lines.push('\n<strong>درباره:</strong>\n' + escapeHtml(d.about));
  $('modalContent').innerHTML = lines.join('<br>');

  var tagsEl = $('modalTags');
  if(d.tags && d.tags.length){
    tagsEl.innerHTML = d.tags.map(function(t){
      return '<span class="modal-tag">' + escapeHtml(t) + '</span>';
    }).join('');
    tagsEl.style.display = 'flex';
  } else { tagsEl.innerHTML = ''; tagsEl.style.display = 'none'; }

  var phone = cleanPhone(d.phone);
  var whats = cleanPhone(d.whatsapp || d.phone);
  var actionsHtml = '';
  if(phone){
    actionsHtml += '<a class="doc-btn doc-btn-call" href="tel:' + escapeHtml(phone) + '">' +
      '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
      'تماس' +
    '</a>';
  }
  if(whats){
    actionsHtml += '<a class="doc-btn doc-btn-whats" href="https://wa.me/' + escapeHtml(whats.replace('+','')) + '" target="_blank" rel="noopener">' +
      '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
      'واتساپ' +
    '</a>';
  }
  if(d.address){
    actionsHtml += '<a class="doc-btn doc-btn-map" href="https://www.google.com/maps/search/' + encodeURIComponent(d.address) + '" target="_blank" rel="noopener">' +
      '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
      'نقشه' +
    '</a>';
  }
  if(d.website){
    actionsHtml += '<a class="doc-btn doc-btn-map" href="' + escapeHtml(d.website) + '" target="_blank" rel="noopener">' +
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>' +
      'وب‌سایت' +
    '</a>';
  }
  $('modalActions').innerHTML = actionsHtml;

  $('docModal').classList.add('show');
}

function closeModal(){
  stopSpeech();
  $('docModal').classList.remove('show');
  currentDoc = null;
}

/* ═══ COPY / SHARE / SPEAK ═══ */
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showMsg('متن کپی شد ✓'); }
  catch(e){ showMsg('...'); }
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg('متن کپی شد ✓'); })
      .catch(function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function shareText(text,title){
  if(!text) return;
  if(navigator.share){
    navigator.share({title:title||'بانوان نور',text:text}).catch(function(){});
  } else { copyText(text); showMsg('متن کپی شد'); }
}
function speakText(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window)){ showMsg('خواندن صوتی پشتیبانی نمی‌شود'); return; }
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    if(speechBtn === btn){ speechBtn = null; return; }
  }
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang='fa-IR'; utt.rate=0.95; utt.pitch=1;
  try{
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf('fa')===0){ utt.voice=voices[i]; break; }
    }
  }catch(e){}
  if(btn){ btn.classList.add('speaking'); speechBtn = btn; }
  utt.onend = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  utt.onerror = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  window.speechSynthesis.speak(utt);
}
function stopSpeech(){
  try{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    speechBtn = null;
  }catch(e){}
}

/* ═══ MODAL ACTIONS ═══ */
function setupModalActions(){
  var bar = document.querySelector('.action-bar');
  if(bar){
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('[data-doc-act]');
      if(!btn || !currentDoc) return;
      var act = btn.getAttribute('data-doc-act');
      var d = currentDoc;
      var fullText = d.name + '\n' +
        (d.specialty ? 'تخصص: ' + d.specialty + '\n' : '') +
        (d.clinic ? 'کلینیک: ' + d.clinic + '\n' : '') +
        (d.city ? 'شهر: ' + d.city + '\n' : '') +
        (d.address ? 'آدرس: ' + d.address + '\n' : '') +
        (d.hours ? 'ساعات کاری: ' + d.hours + '\n' : '') +
        (d.phone ? 'تلفن: ' + d.phone + '\n' : '') +
        (d.whatsapp ? 'واتساپ: ' + d.whatsapp + '\n' : '') +
        (d.about ? '\n' + d.about : '');
      if(act === 'copy') copyText(fullText);
      else if(act === 'share') shareText(fullText + '\n\n— بانوان نور', 'بانوان نور');
      else if(act === 'speak') speakText(d.name + '. ' + (d.specialty ? d.specialty + '. ' : '') + (d.about || ''), btn);
    });
  }
  var closeBtn = $('modalClose');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  var modal = $('docModal');
  if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('docModal').classList.contains('show')) closeModal();
  });
}

/* ═══ SEARCH ═══ */
function setupSearch(){
  var si = $('searchInput');
  if(!si) return;
  var timer = null;
  si.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      searchQuery = si.value || '';
      renderDoctors();
    }, 180);
  });
}

/* ═══ INIT ═══ */
function init(){
  applyTheme();
  setupSearch();
  setupModalActions();
  loadDoctors();

  window.addEventListener('storage', function(e){
    if(e.key === 'bn_theme') applyTheme();
  });

  try{
    if('speechSynthesis' in window) window.speechSynthesis.getVoices();
  }catch(e){}

  console.log('💗 صفحه پزشکان آماده');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else init();

})();
</script>
