<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4c1d95" />
<title>بانوان نور | BANOVAN NOOR</title>
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl;color:#fff;
  background:#1e1b4b;
  background-image:
    radial-gradient(ellipse 700px 500px at 15% 10%,rgba(236,72,153,.35) 0,transparent 55%),
    radial-gradient(ellipse 600px 500px at 90% 20%,rgba(168,85,247,.42) 0,transparent 60%),
    radial-gradient(ellipse 650px 550px at 10% 85%,rgba(139,92,246,.5) 0,transparent 55%),
    radial-gradient(ellipse 700px 600px at 95% 95%,rgba(236,72,153,.32) 0,transparent 55%),
    linear-gradient(160deg,#1e1b4b 0,#3b0764 20%,#4c1d95 45%,#5b21b6 60%,#3b0764 80%,#1e1b4b 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
body::before{
  content:"";position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(253,230,138,.9) 0,transparent 1.1%),
    radial-gradient(circle at 88% 12%,rgba(253,230,138,.8) 0,transparent .9%),
    radial-gradient(circle at 78% 88%,rgba(253,230,138,.7) 0,transparent .9%),
    radial-gradient(circle at 8% 72%,rgba(253,230,138,.6) 0,transparent .8%),
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.9) 0,transparent .6%),
    radial-gradient(circle at 70% 35%,rgba(255,255,255,.7) 0,transparent .5%),
    radial-gradient(circle at 25% 65%,rgba(255,255,255,.6) 0,transparent .6%),
    radial-gradient(circle at 82% 65%,rgba(255,255,255,.7) 0,transparent .5%),
    radial-gradient(circle at 18% 45%,rgba(244,114,182,.85) 0,transparent .7%),
    radial-gradient(circle at 90% 45%,rgba(244,114,182,.75) 0,transparent .7%);
  pointer-events:none;z-index:0;
  animation:starTwinkle 5s ease-in-out infinite alternate;
}
@keyframes starTwinkle{0%{opacity:.5;transform:scale(.98)}100%{opacity:1;transform:scale(1.02)}}

.bg-flowers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flower{position:absolute;opacity:.14;animation:floatFlower 10s ease-in-out infinite}
.flower svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.flower-1{top:4%;left:2%;width:120px;height:120px}
.flower-2{top:10%;right:3%;width:90px;height:90px;animation-delay:-2s}
.flower-3{bottom:6%;left:4%;width:100px;height:100px;animation-delay:-4s}
.flower-4{bottom:12%;right:3%;width:130px;height:130px;animation-delay:-1s}
.flower-5{top:45%;left:-3%;width:70px;height:70px;animation-delay:-6s;opacity:.1}
.flower-6{top:55%;right:-3%;width:80px;height:80px;animation-delay:-3s;opacity:.1}
@keyframes floatFlower{0%,100%{transform:translateY(0) rotate(0) scale(1)}50%{transform:translateY(-20px) rotate(10deg) scale(1.05)}}

.welcome{
  width:100%;max-width:480px;padding:24px 26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;animation:fadeIn 1s ease-out;
  min-height:100vh;min-height:100dvh;position:relative;z-index:1;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.welcome-logo-wrap{position:relative;margin-bottom:22px;animation:logoEnter 1.4s cubic-bezier(.16,1,.3,1)}
@keyframes logoEnter{from{opacity:0;transform:translateY(-30px) scale(.85)}to{opacity:1;transform:translateY(0) scale(1)}}
.welcome-logo-wrap::before{
  content:"";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(236,72,153,.4) 0,rgba(139,92,246,.35) 30%,rgba(139,92,246,.15) 50%,transparent 75%);
  pointer-events:none;animation:pulseGlow 4s ease-in-out infinite;z-index:-2;
}
@keyframes pulseGlow{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
.welcome-logo-wrap::after{
  content:"";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:240px;height:240px;border-radius:50%;
  border:2px dashed rgba(253,230,138,.4);pointer-events:none;
  animation:rotateRing 25s linear infinite;z-index:-1;
}
@keyframes rotateRing{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.welcome-logo{
  width:190px;height:190px;border-radius:42px;overflow:hidden;
  box-shadow:
    0 25px 60px rgba(76,29,149,.7),
    0 10px 25px rgba(236,72,153,.4),
    inset 0 1px 0 rgba(255,255,255,.2),
    0 0 0 3px rgba(253,230,138,.5),
    0 0 0 6px rgba(139,92,246,.4),
    0 0 40px rgba(253,230,138,.3);
  position:relative;
  background:linear-gradient(135deg,#2d1259 0,#4c1d95 100%);
  padding:3px;
}
.welcome-logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:39px;position:relative;z-index:1}

.corner-ornament{
  position:absolute;width:40px;height:40px;pointer-events:none;color:#fde68a;
  filter:drop-shadow(0 0 8px rgba(253,230,138,.6));
}
.corner-ornament svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5}
.corner-tl{top:-10px;left:-10px}
.corner-tr{top:-10px;right:-10px;transform:scaleX(-1)}
.corner-bl{bottom:-10px;left:-10px;transform:scaleY(-1)}
.corner-br{bottom:-10px;right:-10px;transform:scale(-1)}

.welcome-title{
  font-size:2.5rem;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,#fff 0,#fde68a 20%,#f9a8d4 45%,#c4b5fd 70%,#fde68a 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:14px;line-height:1.15;
  filter:drop-shadow(0 4px 20px rgba(236,72,153,.5));
  animation:titleShine 4s ease-in-out infinite;
}
@keyframes titleShine{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}

.welcome-sub{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-bottom:12px;width:100%;text-align:center}
.welcome-sub-en{
  display:block;font-family:Arial,Helvetica,sans-serif;font-size:1.4rem;
  color:#fbcfe8;letter-spacing:.42em;padding-left:.42em;font-weight:900;
  line-height:1.3;text-transform:uppercase;text-align:center;
  text-shadow:0 0 20px rgba(244,114,182,.8),0 0 40px rgba(236,72,153,.5),0 2px 8px rgba(0,0,0,.4);
}
.welcome-sub-en.noor{font-size:1.55rem;color:#fde68a;letter-spacing:.52em;padding-left:.52em;
  text-shadow:0 0 20px rgba(253,230,138,.9),0 0 40px rgba(251,191,36,.5),0 2px 8px rgba(0,0,0,.4)}

.welcome-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0 26px;width:100%;max-width:260px}
.welcome-divider::before,.welcome-divider::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent 0,rgba(253,230,138,.7) 50%,transparent 100%);
}
.welcome-divider-dot{
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,#fde68a 0,#fbbf24 100%);
  box-shadow:0 0 12px rgba(253,230,138,1),0 0 24px rgba(253,230,138,.7),0 0 40px rgba(251,191,36,.4);
  animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

.welcome-text{
  font-size:1.5rem;line-height:1.9;color:#fff;max-width:400px;
  margin:0 auto 30px;font-weight:800;
  text-shadow:0 2px 14px rgba(0,0,0,.5),0 0 30px rgba(168,85,247,.3);
  text-align:center;
}
.welcome-text strong{
  color:#fde68a;font-weight:900;
  text-shadow:0 0 24px rgba(253,230,138,.7),0 2px 12px rgba(0,0,0,.5);
  display:inline-block;padding:0 6px;
}

.btn-start{
  position:relative;background:linear-gradient(135deg,#ec4899 0,#a855f7 50%,#6d28d9 100%);
  background-size:200% 200%;color:#fff;border:0;
  padding:17px 58px;border-radius:50px;font-family:inherit;font-weight:900;font-size:1.1rem;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:
    0 16px 40px rgba(236,72,153,.55),
    0 10px 28px rgba(109,40,217,.55),
    0 4px 12px rgba(0,0,0,.35),
    inset 0 1.5px 0 rgba(255,255,255,.4),
    inset 0 -2px 0 rgba(0,0,0,.15);
  transition:transform .15s ease,box-shadow .3s ease;
  outline:none;letter-spacing:1.5px;overflow:hidden;
  border:1.5px solid rgba(253,230,138,.55);
  user-select:none;text-decoration:none;
  animation:btnBreath 3s ease-in-out infinite;
}
@keyframes btnBreath{
  0%,100%{box-shadow:0 16px 40px rgba(236,72,153,.55),0 10px 28px rgba(109,40,217,.55),0 4px 12px rgba(0,0,0,.35),inset 0 1.5px 0 rgba(255,255,255,.4)}
  50%{box-shadow:0 20px 48px rgba(236,72,153,.7),0 12px 32px rgba(109,40,217,.7),0 6px 16px rgba(0,0,0,.4),inset 0 1.5px 0 rgba(255,255,255,.4)}
}
.btn-start::before{
  content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.5) 45%,rgba(255,255,255,.75) 50%,rgba(255,255,255,.5) 55%,transparent 100%);
  transform:skewX(-25deg);
  animation:shineSlide 3.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shineSlide{0%,60%{left:-80%}80%,100%{left:130%}}
.btn-start:active{transform:scale(.96)}
.btn-start svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1);position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.btn-start span{position:relative;z-index:1}

.lang-row{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.lang-btn{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1.5px solid rgba(244,114,182,.35);color:#fbcfe8;border-radius:30px;
  padding:10px 22px;font-family:inherit;font-size:.88rem;font-weight:800;cursor:pointer;
  transition:all .3s cubic-bezier(.16,1,.3,1);outline:none;min-width:92px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 14px rgba(0,0,0,.2);
  user-select:none;display:flex;align-items:center;justify-content:center;gap:8px;
}
.lang-btn .flag{font-size:1.05rem;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.lang-btn:active{transform:scale(.95)}
.lang-btn.active{
  background:linear-gradient(135deg,#ec4899 0,#a855f7 50%,#6d28d9 100%);
  color:#fff;border-color:rgba(253,230,138,.75);
  box-shadow:0 10px 26px rgba(236,72,153,.65),0 6px 16px rgba(109,40,217,.55),inset 0 1px 0 rgba(255,255,255,.35);
  transform:translateY(-2px);
}

@media (max-width:380px){
  .welcome-title{font-size:2.1rem}
  .welcome-logo{width:165px;height:165px;border-radius:36px}
  .welcome-logo-wrap::after{width:210px;height:210px}
  .welcome-sub-en{font-size:1.15rem;letter-spacing:.34em;padding-left:.34em}
  .welcome-sub-en.noor{font-size:1.3rem;letter-spacing:.44em;padding-left:.44em}
  .welcome-text{font-size:1.3rem}
  .btn-start{padding:15px 46px;font-size:1rem}
  .lang-btn{padding:9px 16px;font-size:.8rem;min-width:78px;gap:6px}
  .lang-btn .flag{font-size:.95rem}
}
</style>
</head>
<body>

<div class="bg-flowers">
  <div class="flower flower-1"><svg viewBox="0 0 100 100"><g fill="#f9a8d4"><ellipse cx="50" cy="25" rx="14" ry="22"/><ellipse cx="50" cy="75" rx="14" ry="22"/><ellipse cx="25" cy="50" rx="22" ry="14"/><ellipse cx="75" cy="50" rx="22" ry="14"/></g><circle cx="50" cy="50" r="10" fill="#fde68a"/></svg></div>
  <div class="flower flower-2"><svg viewBox="0 0 100 100"><g fill="#c4b5fd"><ellipse cx="50" cy="25" rx="13" ry="21"/><ellipse cx="50" cy="75" rx="13" ry="21"/><ellipse cx="25" cy="50" rx="21" ry="13"/><ellipse cx="75" cy="50" rx="21" ry="13"/></g><circle cx="50" cy="50" r="9" fill="#fbbf24"/></svg></div>
  <div class="flower flower-3"><svg viewBox="0 0 100 100"><g fill="#f472b6"><ellipse cx="50" cy="28" rx="13" ry="20"/><ellipse cx="50" cy="72" rx="13" ry="20"/><ellipse cx="28" cy="50" rx="20" ry="13"/><ellipse cx="72" cy="50" rx="20" ry="13"/></g><circle cx="50" cy="50" r="8" fill="#fde68a"/></svg></div>
  <div class="flower flower-4"><svg viewBox="0 0 100 100"><g fill="#a78bfa"><ellipse cx="50" cy="22" rx="15" ry="24"/><ellipse cx="50" cy="78" rx="15" ry="24"/><ellipse cx="22" cy="50" rx="24" ry="15"/><ellipse cx="78" cy="50" rx="24" ry="15"/></g><circle cx="50" cy="50" r="11" fill="#fbcfe8"/></svg></div>
  <div class="flower flower-5"><svg viewBox="0 0 100 100"><g fill="#fda4af"><ellipse cx="50" cy="30" rx="12" ry="18"/><ellipse cx="50" cy="70" rx="12" ry="18"/><ellipse cx="30" cy="50" rx="18" ry="12"/><ellipse cx="70" cy="50" rx="18" ry="12"/></g><circle cx="50" cy="50" r="7" fill="#fde68a"/></svg></div>
  <div class="flower flower-6"><svg viewBox="0 0 100 100"><g fill="#ddd6fe"><ellipse cx="50" cy="26" rx="12" ry="20"/><ellipse cx="50" cy="74" rx="12" ry="20"/><ellipse cx="26" cy="50" rx="20" ry="12"/><ellipse cx="74" cy="50" rx="20" ry="12"/></g><circle cx="50" cy="50" r="8" fill="#fbbf24"/></svg></div>
</div>

<div class="welcome">

  <div class="welcome-logo-wrap">
    <div class="corner-ornament corner-tl"><svg viewBox="0 0 40 40"><path d="M2 20 Q2 2 20 2" fill="none"/><path d="M2 12 Q2 2 12 2" fill="none" opacity="0.6"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg></div>
    <div class="corner-ornament corner-tr"><svg viewBox="0 0 40 40"><path d="M2 20 Q2 2 20 2" fill="none"/><path d="M2 12 Q2 2 12 2" fill="none" opacity="0.6"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg></div>
    <div class="corner-ornament corner-bl"><svg viewBox="0 0 40 40"><path d="M2 20 Q2 2 20 2" fill="none"/><path d="M2 12 Q2 2 12 2" fill="none" opacity="0.6"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg></div>
    <div class="corner-ornament corner-br"><svg viewBox="0 0 40 40"><path d="M2 20 Q2 2 20 2" fill="none"/><path d="M2 12 Q2 2 12 2" fill="none" opacity="0.6"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg></div>

    <div class="welcome-logo">
      <img src="assets/logo.png" alt="بانوان نور" onerror="this.style.display='none'" />
    </div>
  </div>

  <h1 class="welcome-title" id="titleText">بانوان نور</h1>

  <div class="welcome-sub">
    <span class="welcome-sub-en">BANOVAN</span>
    <span class="welcome-sub-en noor">NOOR</span>
  </div>

  <div class="welcome-divider"><span class="welcome-divider-dot"></span></div>

  <p class="welcome-text">
    <span id="line1Text">به</span>
    <strong id="appNameText">بانوان نور</strong>
    <span id="line2Text">خوش آمدید</span>
  </p>

  <a class="btn-start" id="btnStart" href="home.html">
    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    <span id="startText">شروع</span>
  </a>

  <div class="lang-row" role="group" aria-label="زبان">
    <button class="lang-btn active" type="button" data-lang="fa"><span class="flag">🇮🇷</span><span>فارسی</span></button>
    <button class="lang-btn" type="button" data-lang="ps"><span class="flag">🇦🇫</span><span>پښتو</span></button>
    <button class="lang-btn" type="button" data-lang="en"><span class="flag">🇬🇧</span><span>English</span></button>
  </div>

</div>

<script>
(function(){
  'use strict';

  // ═══ UNREGISTER ALL SERVICE WORKERS ═══
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs){
      for (var i = 0; i < regs.length; i++) {
        regs[i].unregister();
      }
    }).catch(function(){});
  }

  // ═══ CLEAR OLD LOCALSTORAGE FLAGS ═══
  try {
    localStorage.removeItem('bn_entered');
    localStorage.removeItem('noor_entered');
    localStorage.removeItem('banovan_entered');
  } catch(e){}

  var TRANSLATIONS = {
    fa: { appName: 'بانوان نور', line1: 'به', line2: 'خوش آمدید', start: 'شروع', dir: 'rtl' },
    ps: { appName: 'بانوان نور', line1: 'ته', line2: 'ښه راغلاست', start: 'پیل', dir: 'rtl' },
    en: { appName: 'Banovan Noor', line1: 'Welcome to', line2: '', start: 'Start', dir: 'ltr' }
  };
  var SUPPORTED = ['fa', 'ps', 'en'];
  var DEFAULT_LANG = 'fa';

  function getLang(){
    try {
      var l = localStorage.getItem('bn_lang');
      if (l && SUPPORTED.indexOf(l) > -1) return l;
    } catch(e){}
    return DEFAULT_LANG;
  }

  function setLang(l){
    try { localStorage.setItem('bn_lang', l); } catch(e){}
  }

  function applyLang(lang){
    if (SUPPORTED.indexOf(lang) === -1) lang = DEFAULT_LANG;
    setLang(lang);
    var t = TRANSLATIONS[lang] || TRANSLATIONS.fa;

    var el;
    el = document.getElementById('titleText');   if(el) el.textContent = t.appName;
    el = document.getElementById('line1Text');    if(el) el.textContent = t.line1;
    el = document.getElementById('appNameText');  if(el) el.textContent = t.appName;
    el = document.getElementById('line2Text');    if(el) el.textContent = t.line2;
    el = document.getElementById('startText');    if(el) el.textContent = t.start;

    document.documentElement.setAttribute('dir', t.dir);
    document.documentElement.setAttribute('lang', lang);
    document.title = t.appName + ' | BANOVAN NOOR';

    var btns = document.querySelectorAll('.lang-btn');
    for (var i = 0; i < btns.length; i++){
      if (btns[i].getAttribute('data-lang') === lang) btns[i].classList.add('active');
      else btns[i].classList.remove('active');
    }
  }

  function init(){
    applyLang(getLang());

    var langButtons = document.querySelectorAll('.lang-btn');
    for (var i = 0; i < langButtons.length; i++){
      (function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          applyLang(btn.getAttribute('data-lang'));
        });
      })(langButtons[i]);
    }

    console.log('🌸 start.html آماده');
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script src="analytics.js"></script>
</body>
</html>
