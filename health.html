<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="سلامت بانوان — اطلاعات پزشکی و بهداشتی معتبر ویژه بانوان">
<title>سلامت بانوان | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<script>
(function(){
  try{
    var t = localStorage.getItem('bn_theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'dark') document.body.classList.add('dark');
  }catch(e){}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   BANOVAN NOOR — HEALTH PAGE
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#fdf5ff;--bg-soft:#f6e9ff;
  --surface:rgba(255,255,255,.85);--surface-solid:#fff;
  --text:#2a1740;--text-soft:#5f4a77;--text-muted:#9686a8;
  --primary:#a832d6;--pink:#ec4899;--red:#ed4956;
  --border:rgba(168,50,214,.14);
  --shadow-sm:0 6px 20px rgba(168,50,214,.08);
  --shadow-lg:0 14px 34px rgba(168,50,214,.15);
  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.13),rgba(168,85,247,.10));
}

html[data-theme="dark"],
body.dark{
  --bg:#000;--bg-soft:#000;
  --surface:rgba(28,28,30,.85);--surface-solid:#1c1c1e;
  --text:#fff;--text-soft:#e4e6eb;--text-muted:#8e8e93;
  --primary:#c084fc;
  --border:rgba(192,132,252,.16);
  --shadow-sm:0 6px 20px rgba(0,0,0,.45);
  --shadow-lg:0 14px 34px rgba(0,0,0,.55);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.18),rgba(168,85,247,.14));
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}

body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;
  direction:rtl;color:var(--text);
  background:
    radial-gradient(circle at 8% 0%,rgba(236,72,153,.15),transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(168,85,247,.17),transparent 32%),
    linear-gradient(160deg,var(--bg),var(--bg-soft));
  min-height:100vh;
  padding-bottom:calc(210px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}
html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}

body.lang-ltr { direction: ltr; }
body.lang-ltr .back-btn svg { transform: none; }
body.lang-ltr .article::before { right: auto; left: 0; }
body.lang-ltr .article-main { padding-left: 0; padding-right: 4px; }
body.lang-ltr .back-cat-btn svg { transform: none; }
body.lang-ltr .open-btn svg { transform: none; }
body.lang-ltr .search-box svg { right: auto; left: 14px; }
body.lang-ltr .search-box input { padding: 0 14px 0 42px; }

.app{width:100%;max-width:640px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:18px 0 14px;
  position:sticky;top:0;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
  z-index:50;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:linear-gradient(to bottom,#000 70%,transparent)}
.back-btn{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;flex:0 0 42px;
  transition:transform .2s;
}
.back-btn:active{transform:scale(.9)}
.back-btn svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);
}
.page-title{flex:1;font-size:1.05rem;font-weight:900}
.top-icon{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;flex:0 0 42px;
  transition:transform .2s;
}
.top-icon:active{transform:scale(.9)}
.top-icon svg{
  width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

/* HERO */
.hero{
  border-radius:22px;padding:20px 18px;margin-bottom:16px;
  color:#fff;background:var(--brand-grad);
  background-size:200% 100%;
  box-shadow:0 14px 35px rgba(219,39,119,.25);
  animation:heroGrad 7s ease infinite;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
@keyframes heroGrad{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.hero::before{
  content:"";position:absolute;
  width:200px;height:200px;top:-110px;left:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);
  pointer-events:none;
}
.hero-icon{
  width:54px;height:54px;border-radius:17px;
  background:rgba(255,255,255,.18);
  border:1.5px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 54px;
  position:relative;z-index:1;
}
.hero-icon svg{
  width:28px;height:28px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.hero-text{flex:1;min-width:0;position:relative;z-index:1}
.hero-title{font-size:1.05rem;font-weight:900;line-height:1.4;margin-bottom:4px;color:#fff}
.hero-sub{font-size:.7rem;line-height:1.7;opacity:.92;font-weight:600;color:rgba(255,255,255,.95)}

/* SEARCH */
.search-box{position:relative;margin-bottom:14px}
.search-box svg{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);pointer-events:none;width:18px;height:18px;
  fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.search-box input{
  width:100%;height:48px;padding:0 42px 0 14px;
  border:1.5px solid var(--border);border-radius:15px;outline:0;
  color:var(--text);background:var(--surface);
  box-shadow:var(--shadow-sm);transition:.2s;font-size:.88rem;
  font-family:inherit;
}
.search-box input:focus{border-color:rgba(168,50,214,.5);box-shadow:0 0 0 4px rgba(168,50,214,.08)}
.search-box input::placeholder{color:var(--text-muted)}

/* CATEGORIES VIEW */
.categories-view{display:block}
.cat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.cat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px 14px;
  cursor:pointer;
  text-align:right;
  font-family:inherit;color:inherit;
  box-shadow:var(--shadow-sm);
  transition:transform .2s,box-shadow .2s;
  display:flex;flex-direction:column;gap:10px;
  position:relative;overflow:hidden;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.cat-card:active{transform:scale(.97)}
.cat-card::after{
  content:"";position:absolute;
  width:80px;height:80px;right:-30px;bottom:-30px;border-radius:50%;
  background:var(--cat-color,#a855f7);opacity:.08;pointer-events:none;
}
.cat-icon{
  width:44px;height:44px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--cat-grad,linear-gradient(135deg,#a855f7,#6d28d9));
  color:#fff;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
  position:relative;z-index:1;
}
.cat-icon svg{
  width:22px;height:22px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.cat-info{position:relative;z-index:1}
.cat-title{font-size:.85rem;font-weight:900;color:var(--text);line-height:1.4;margin-bottom:3px}
.cat-count{font-size:.65rem;color:var(--text-muted);font-weight:700}

/* LIST VIEW */
.list-view{display:none}
.list-view.active{display:block}
.categories-view.hidden{display:none}

.list-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;gap:8px;
}
.list-title{
  display:flex;align-items:center;gap:8px;
  font-size:.95rem;font-weight:900;color:var(--text);
}
.list-title svg{
  width:20px;height:20px;fill:none;stroke:var(--primary);
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.back-cat-btn{
  height:34px;padding:0 12px;display:flex;align-items:center;gap:5px;
  border-radius:11px;color:var(--primary);background:var(--brand-grad-soft);
  font-family:inherit;font-size:.72rem;font-weight:900;
  cursor:pointer;border:0;
}
.back-cat-btn svg{
  width:14px;height:14px;fill:none;stroke:currentColor;
  stroke-width:2.4;transform:scaleX(-1);
}
.back-cat-btn:active{transform:scale(.95)}

.list-meta{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;gap:8px;
}
.result-count{
  color:var(--text-muted);font-size:.72rem;font-weight:800;
}

/* ARTICLE CARDS */
.list{display:grid;gap:9px}
.article{
  position:relative;overflow:hidden;
  padding:14px;border-radius:18px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  transition:transform .18s;
  cursor:pointer;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.article::before{
  content:"";position:absolute;top:0;right:0;
  width:3.5px;height:100%;
  background:var(--brand-grad);opacity:.85;
  border-radius:0 0 18px 18px;
}
.article:active{transform:scale(.988)}
.article-title{
  font-size:.88rem;font-weight:950;color:var(--text);
  line-height:1.6;margin:0 0 6px;
}
.article-excerpt{
  margin:0;color:var(--text-muted);font-size:.72rem;line-height:1.8;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.article-meta{
  display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;
}
.meta-tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:8px;
  background:var(--brand-grad-soft);
  color:var(--primary);font-size:.6rem;font-weight:800;
  border:1px solid var(--border);
}
.article-footer{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;gap:8px;
}
.article-source{
  font-size:.6rem;color:var(--text-muted);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.open-btn{
  height:30px;padding:0 12px;display:flex;align-items:center;gap:5px;
  border-radius:10px;color:#fff;background:var(--brand-grad);
  font-size:.65rem;font-weight:900;flex-shrink:0;
}
.open-btn svg{
  width:13px;height:13px;fill:none;stroke:#fff;
  stroke-width:2.4;transform:scaleX(-1);
}

/* STATES */
.state{
  padding:50px 20px;text-align:center;
  color:var(--text-muted);font-size:.85rem;
  line-height:1.9;font-weight:700;
}
.state-icon{
  width:60px;height:60px;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  border-radius:20px;background:var(--brand-grad-soft);
}
.state-icon svg{
  width:28px;height:28px;fill:none;stroke:var(--primary);
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.loader{
  width:32px;height:32px;margin:0 auto 14px;
  border-radius:50%;
  border:3px solid rgba(168,50,214,.15);
  border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.modal{
  position:fixed;inset:0;z-index:5000;
  display:none;align-items:flex-end;justify-content:center;
  padding:15px;
  background:rgba(15,8,20,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.modal.show{display:flex;animation:mFade .25s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:680px;max-height:92vh;
  overflow:hidden;border-radius:26px 26px 22px 22px;
  background:var(--surface-solid);border:1px solid var(--border);
  box-shadow:0 -10px 55px rgba(219,39,119,.28);
  display:flex;flex-direction:column;
  animation:mSlide .3s ease;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes mSlide{from{transform:translateY(45px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{
  width:42px;height:4px;border-radius:10px;
  margin:9px auto 4px;background:var(--text-muted);opacity:.25;
}
.sheet-head{
  display:flex;align-items:center;gap:9px;
  padding:8px 14px 12px;
  border-bottom:1px solid var(--border);
  background:var(--surface-solid);
}
.sheet-close{
  width:38px;height:38px;flex:0 0 38px;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--text);background:var(--brand-grad-soft);
  cursor:pointer;border:0;
}
.sheet-close svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}
.sheet-title{flex:1;min-width:0}
.sheet-title strong{
  display:block;font-size:.88rem;font-weight:950;color:var(--text);
  line-height:1.5;
}
.sheet-title span{
  display:block;margin-top:3px;color:var(--text-muted);
  font-size:.65rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sheet-scroll{
  overflow-y:auto;overscroll-behavior:contain;
  padding:16px 16px 30px;
  -webkit-overflow-scrolling:touch;
}
.content-panel{
  padding:18px 16px;
  border-radius:16px;
  background:var(--brand-grad-soft);
  border:1px solid var(--border);
  line-height:2.1;
  font-size:.85rem;
  color:var(--text);
  white-space:pre-line;
  font-weight:600;
}
.content-tags{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--border);
}
.content-tag{
  padding:4px 10px;border-radius:8px;
  background:var(--brand-grad-soft);
  color:var(--primary);font-size:.65rem;font-weight:800;
  border:1px solid var(--border);
}
.content-source{
  margin-top:12px;padding:10px 12px;
  border-radius:12px;
  background:var(--surface);
  border:1px dashed var(--border);
  color:var(--text-muted);font-size:.7rem;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.content-source svg{
  width:14px;height:14px;fill:none;stroke:currentColor;
  stroke-width:2;flex-shrink:0;
}
.content-actions{
  display:flex;gap:8px;margin-top:16px;
}
.act-btn{
  flex:1;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-size:.72rem;font-weight:900;
  cursor:pointer;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  transition:transform .15s;
}
.act-btn:active{transform:scale(.96)}
.act-btn svg{
  width:16px;height:16px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.act-btn.primary{
  background:var(--brand-grad);color:#fff;
  border-color:transparent;
  box-shadow:0 8px 20px rgba(219,39,119,.32);
}

/* TOAST */
.toast{
  position:fixed;left:50%;
  bottom:calc(230px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;pointer-events:none;z-index:7000;
  max-width:90%;padding:11px 20px;border-radius:30px;
  background:#21142e;color:#fff;
  font-size:.72rem;font-weight:850;
  box-shadow:0 14px 38px rgba(219,39,119,.30);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  transition:opacity .25s ease,transform .25s ease;
  text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;z-index:70;right:0;bottom:0;left:0;
  padding:6px max(10px,env(safe-area-inset-left))
          calc(6px + env(safe-area-inset-bottom))
          max(10px,env(safe-area-inset-right));
  display:grid;grid-template-columns:1fr 1fr 68px 1fr 1fr;
  align-items:end;gap:2px;
  background:rgba(251,248,255,.86);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid var(--border);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{background:rgba(0,0,0,.88)}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--text-muted);border-radius:13px;background:transparent;
  font-family:inherit;font-size:.6rem;font-weight:800;
  padding:8px 2px;cursor:pointer;border:0;
  transition:color .18s;
  text-decoration:none;
}
.nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--primary)}
.nav-item:active{transform:scale(.92)}
.nav-fab-slot{position:relative;display:flex;justify-content:center;align-items:flex-end}
.nav-home{
  position:absolute;bottom:0;width:54px;height:54px;border-radius:18px;
  display:grid;place-items:center;color:#fff;background:var(--brand-grad);
  box-shadow:0 10px 24px rgba(185,40,130,.3);
  border:4px solid var(--bg);
  text-decoration:none;
}
.nav-home svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:390px){
  .app{padding:0 12px}
  .hero{padding:16px 14px;gap:11px}
  .hero-icon{width:46px;height:46px;flex-basis:46px}
  .hero-icon svg{width:24px;height:24px}
  .hero-title{font-size:.95rem}
  .cat-grid{gap:8px}
  .cat-card{padding:14px 12px}
  .cat-title{font-size:.8rem}
  .article{padding:12px}
  .article-title{font-size:.84rem}
}
</style>
</head>
<body>

<!-- SVG SPRITE -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.2 16.2L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.8L12 3l9 7.8v9a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 19.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 21v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 017.5 2H20v17H7.5A2.5 2.5 0 015 16.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 16.5A2.5 2.5 0 017.5 14H20M8 6h8M8 9h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.3-8.8 10.1-8.8 10.1S3.2 14 3.2 8.7A4.7 4.7 0 017.9 4c1.7 0 3.2.9 4.1 2.2A4.8 4.8 0 0116.1 4a4.7 4.7 0 014.7 4.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

  <symbol id="i-ribbon" viewBox="0 0 24 24"><path d="M12 15c-3 0-5-2-5-5s2-5 5-5 5 2 5 5-2 5-5 5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 14l-3 8M15 14l3 8M12 15v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bone" viewBox="0 0 24 24"><path d="M6 4a3 3 0 100 6 3 3 0 100 6 3 3 0 000 4 3 3 0 006 0 3 3 0 100-6 3 3 0 100-6 3 3 0 000-4 3 3 0 00-6 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════ */
var BASE_PATH = "data/medical/";
var CACHE_VERSION = "v1";

var CATEGORIES = [
  { id:"general",           title:"سلامت عمومی",     file:"general-health.json",    icon:"heart-pulse", color:"#a855f7", grad:"linear-gradient(135deg,#a855f7,#6d28d9)" },
  { id:"menstruation",      title:"قاعدگی",          file:"menstruation.json",      icon:"water",       color:"#ec4899", grad:"linear-gradient(135deg,#ec4899,#be185d)" },
  { id:"pregnancy",         title:"بارداری",         file:"pregnancy.json",         icon:"baby",        color:"#f472b6", grad:"linear-gradient(135deg,#f472b6,#db2777)" },
  { id:"childbirth",        title:"زایمان",          file:"childbirth.json",        icon:"baby",        color:"#c084fc", grad:"linear-gradient(135deg,#c084fc,#9333ea)" },
  { id:"breast",            title:"سلامت سینه",       file:"breast-health.json",     icon:"ribbon",      color:"#ec4899", grad:"linear-gradient(135deg,#f472b6,#ec4899)" },
  { id:"vaginal",           title:"سلامت واژن",       file:"vaginal-health.json",    icon:"shield-check",color:"#8b5cf6", grad:"linear-gradient(135deg,#a78bfa,#7c3aed)" },
  { id:"anal",              title:"سلامت مقعد",       file:"anal-health.json",       icon:"shield-check",color:"#6366f1", grad:"linear-gradient(135deg,#6366f1,#4338ca)" },
  { id:"nutrition",         title:"تغذیه",           file:"nutrition.json",         icon:"apple",       color:"#f59e0b", grad:"linear-gradient(135deg,#fbbf24,#d97706)" },
  { id:"hygiene",           title:"بهداشت شخصی",      file:"personal-hygiene.json",  icon:"sparkle",     color:"#10b981", grad:"linear-gradient(135deg,#34d399,#059669)" }
];

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
var allArticles = [];
var filteredArticles = [];
var currentCategory = null;
var currentView = "categories";
var currentArticle = null;
var toastTimer = null;

/* ═══════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }

function escapeHTML(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(msg){
  var el = $("toast");
  if(!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

function normalizeSearch(v){
  return String(v || "").toLowerCase()
    .replace(/ي/g,"ی").replace(/ى/g,"ی").replace(/ك/g,"ک")
    .replace(/ۀ/g,"ه").replace(/ة/g,"ه").replace(/ؤ/g,"و")
    .replace(/إ/g,"ا").replace(/أ/g,"ا").replace(/ـ/g,"")
    .replace(/[\u064B-\u065F\u0670]/g,"").replace(/\s+/g," ").trim();
}

function iconUse(name){
  var valid = ["heart-pulse","water","baby","ribbon","shield-check","apple","sparkle","book","heart"];
  if(valid.indexOf(name) === -1) name = "book";
  return '<svg viewBox="0 0 24 24"><use href="#i-'+name+'"></use></svg>';
}

/* ═══════════════════════════════════════════════════════════
   LOAD DATA
   ═══════════════════════════════════════════════════════════ */
async function loadAllData(){
  $("catGrid").innerHTML = '<div class="state" style="grid-column:span 2"><div class="loader"></div>در حال بارگذاری...</div>';

  var loaded = [];
  for(var i=0; i<CATEGORIES.length; i++){
    var cat = CATEGORIES[i];
    try{
      var res = await fetch(BASE_PATH + cat.file + "?v=" + CACHE_VERSION, { cache: "no-cache" });
      if(!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var articles = extractArticles(data, cat);
      loaded = loaded.concat(articles);
    }catch(err){
      console.warn("Load failed:", cat.file, err.message);
    }
  }

  allArticles = loaded;
  renderCategories();
}

function extractArticles(data, cat){
  var result = [];
  if(!data || !data.articles || !Array.isArray(data.articles)) return result;

  data.articles.forEach(function(item){
    if(!item || typeof item !== "object") return;
    result.push({
      id: String(item.id || (cat.id + "_" + Math.random().toString(36).slice(2,8))),
      title: item.title || "بدون عنوان",
      excerpt: item.excerpt || "",
      content: item.content || "",
      tags: Array.isArray(item.tags) ? item.tags : [],
      source: item.source || "",
      category: cat.id,
      categoryTitle: cat.title,
      categoryIcon: cat.icon,
      categoryColor: cat.color
    });
  });

  return result;
}

/* ═══════════════════════════════════════════════════════════
   RENDER CATEGORIES
   ═══════════════════════════════════════════════════════════ */
function renderCategories(){
  var counts = {};
  allArticles.forEach(function(a){
    counts[a.category] = (counts[a.category] || 0) + 1;
  });

  var html = CATEGORIES.map(function(c){
    var count = counts[c.id] || 0;
    return '<button class="cat-card" data-cat="' + c.id + '" type="button" ' +
             'style="--cat-color:' + c.color + ';--cat-grad:' + c.grad + '">' +
      '<div class="cat-icon">' + iconUse(c.icon) + '</div>' +
      '<div class="cat-info">' +
        '<div class="cat-title">' + escapeHTML(c.title) + '</div>' +
        '<div class="cat-count">' + count + ' مقاله</div>' +
      '</div>' +
    '</button>';
  }).join("");

  $("catGrid").innerHTML = html;

  $("catGrid").querySelectorAll(".cat-card").forEach(function(card){
    card.addEventListener("click", function(){
      openCategory(card.getAttribute("data-cat"));
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   VIEW MANAGEMENT
   ═══════════════════════════════════════════════════════════ */
function openCategory(catId){
  currentCategory = catId;
  currentView = "list";

  $("categoriesView").classList.add("hidden");
  $("listView").classList.add("active");

  var cat = null;
  for(var i=0; i<CATEGORIES.length; i++){
    if(CATEGORIES[i].id === catId){ cat = CATEGORIES[i]; break; }
  }
  if(!cat) return;

  $("pageTitle").textContent = cat.title;
  $("listTitle").innerHTML = iconUse(cat.icon) + '<span>' + escapeHTML(cat.title) + '</span>';

  applyFilters();
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (window.bnAnalytics) window.bnAnalytics.track("health_category", { cat: catId });
}

function backToCategories(){
  currentCategory = null;
  currentView = "categories";

  $("listView").classList.remove("active");
  $("categoriesView").classList.remove("hidden");

  $("pageTitle").textContent = "سلامت بانوان";
  $("searchInput").value = "";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ═══════════════════════════════════════════════════════════
   FILTER & RENDER
   ═══════════════════════════════════════════════════════════ */
function applyFilters(){
  var q = normalizeSearch($("searchInput").value);

  filteredArticles = allArticles.filter(function(a){
    if(currentCategory && a.category !== currentCategory) return false;
    if(!q) return true;

    var hay = normalizeSearch([
      a.title, a.excerpt, a.content,
      (a.tags || []).join(" "),
      a.source, a.categoryTitle
    ].join(" "));

    return hay.indexOf(q) > -1;
  });

  renderArticles();
}

function renderArticles(){
  var list = $("articleList");

  if(!filteredArticles.length){
    list.innerHTML =
      '<div class="state">' +
        '<div class="state-icon"><svg viewBox="0 0 24 24"><use href="#i-search"></use></svg></div>' +
        '<strong>موردی پیدا نشد</strong>' +
        '<div style="margin-top:6px;font-size:.7rem;opacity:.7">عبارت دیگری را جستجو کن</div>' +
      '</div>';
    $("resultCount").textContent = "۰ مطلب";
    return;
  }

  $("resultCount").textContent = filteredArticles.length + " مطلب";

  var html = filteredArticles.map(function(a){
    var tagsHtml = "";
    if(a.tags && a.tags.length){
      tagsHtml = a.tags.slice(0, 3).map(function(t){
        return '<span class="meta-tag">' + escapeHTML(t) + '</span>';
      }).join("");
    }

    return '<article class="article" data-open="' + escapeHTML(a.id) + '" role="button" tabindex="0">' +
      '<h2 class="article-title">' + escapeHTML(a.title) + '</h2>' +
      '<p class="article-excerpt">' + escapeHTML(a.excerpt) + '</p>' +
      (tagsHtml ? '<div class="article-meta">' + tagsHtml + '</div>' : '') +
      '<div class="article-footer">' +
        '<span class="article-source">' + escapeHTML(a.source || a.categoryTitle) + '</span>' +
        '<span class="open-btn">مطالعه<svg viewBox="0 0 24 24"><use href="#i-arrow-right"></use></svg></span>' +
      '</div>' +
    '</article>';
  }).join("");

  list.innerHTML = html;

  list.querySelectorAll(".article").forEach(function(card){
    card.addEventListener("click", function(){
      openArticle(card.getAttribute("data-open"));
    });
    card.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){
        e.preventDefault();
        openArticle(card.getAttribute("data-open"));
      }
    });
  });
}

/* ═══════════════════════════════════════════════════════════
   OPEN ARTICLE
   ═══════════════════════════════════════════════════════════ */
function findArticle(id){
  for(var i=0; i<allArticles.length; i++){
    if(allArticles[i].id === String(id)) return allArticles[i];
  }
  return null;
}

function openArticle(id){
  var a = findArticle(id);
  if(!a) return;

  currentArticle = a;

  $("modalTitle").textContent = a.title;
  $("modalSub").textContent = a.source || a.categoryTitle || "بانوان نور";
  $("modalBody").textContent = a.content || "متنی برای نمایش وجود ندارد.";

  /* Tags */
  var tagsEl = $("modalTags");
  if(a.tags && a.tags.length){
    tagsEl.innerHTML = a.tags.map(function(t){
      return '<span class="content-tag">' + escapeHTML(t) + '</span>';
    }).join("");
    tagsEl.style.display = "flex";
  } else {
    tagsEl.style.display = "none";
  }

  /* Source */
  var sourceEl = $("modalSource");
  if(a.source){
    $("modalSourceText").textContent = "منبع: " + a.source;
    sourceEl.style.display = "flex";
  } else {
    sourceEl.style.display = "none";
  }

  $("modal").classList.add("show");
  document.body.style.overflow = "hidden";
  $("modalScroll").scrollTop = 0;

  if (window.bnAnalytics) window.bnAnalytics.track("health_article_open", { id: a.id, cat: a.category });
}

function closeModal(){
  $("modal").classList.remove("show");
  document.body.style.overflow = "";
  currentArticle = null;
}

/* ═══════════════════════════════════════════════════════════
   COPY / SHARE
   ═══════════════════════════════════════════════════════════ */
function getArticleText(a){
  if(!a) return "";
  return a.title + "\n\n" + a.content + (a.source ? "\n\n— " + a.source : "");
}

async function copyArticle(){
  if(!currentArticle) return;
  var text = getArticleText(currentArticle);

  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      showToast("متن کپی شد");
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("متن کپی شد");
    }
  }catch(e){
    showToast("کپی نشد");
  }
}

async function shareArticle(){
  if(!currentArticle) return;
  var text = getArticleText(currentArticle) + "\n\n— از برنامه بانوان نور";

  try{
    if(navigator.share){
      await navigator.share({
        title: currentArticle.title,
        text: text
      });
    } else {
      await navigator.clipboard.writeText(text);
      showToast("متن کپی شد");
    }
  }catch(e){ /* کاربر انصراف داد */ }
}

/* ═══════════════════════════════════════════════════════════

$("backCatBtn").addEventListener("click", backToCategories);

$("searchInput").addEventListener("input", function(){
  var val = $("searchInput").value.trim();

  if(val && currentView === "categories"){
    currentView = "list";
    currentCategory = null;
    $("categoriesView").classList.add("hidden");
    $("listView").classList.add("active");
    $("pageTitle").textContent = "نتایج جستجو";
    $("listTitle").innerHTML = '<svg viewBox="0 0 24 24"><use href="#i-search"></use></svg><span>نتایج جستجو</span>';
  } else if(!val && currentView === "list" && !currentCategory){
    backToCategories();
    return;
  }

  applyFilters();
});

$("closeModal").addEventListener("click", closeModal);
$("modal").addEventListener("click", function(e){
  if(e.target === $("modal")) closeModal();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && $("modal").classList.contains("show")) closeModal();
});

$("copyBtn").addEventListener("click", copyArticle);
$("shareBtn").addEventListener("click", shareArticle);

} else {

}
