<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#db2777" id="themeMeta">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بانوان نور">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="سلامت بانوان — مقالات تخصصی سلامت جسم و روان بانوان">
<title>سلامت بانوان | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">

<script>
(function(){
  try{
    var t = localStorage.getItem('bn_theme');
    if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   BANOVAN NOOR — HEALTH v3
   ═══════════════════════════════════════════════════════════ */

:root{
  --bg:#fdf5ff;
  --bg-soft:#f6e9ff;
  --surface:rgba(255,255,255,.78);
  --surface-solid:#ffffff;
  --text:#2a1740;
  --text-soft:#5f4a77;
  --text-muted:#9686a8;

  --primary:#a832d6;
  --primary-2:#c026d3;
  --pink:#ec4899;

  --border:rgba(168,50,214,.14);
  --shadow-sm:0 6px 20px rgba(168,50,214,.08);
  --shadow-md:0 14px 34px rgba(168,50,214,.15);
  --shadow-fab:0 14px 36px rgba(219,39,119,.50);

  --nav-bg:rgba(255,255,255,.68);

  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.13),rgba(168,85,247,.10));
}

html[data-theme="dark"],
body.dark{
  --bg:#000000;
  --bg-soft:#000000;
  --surface:rgba(28,28,30,.70);
  --surface-solid:#1c1c1e;
  --text:#ffffff;
  --text-soft:#e4e6eb;
  --text-muted:#8e8e93;
  --primary:#c084fc;
  --primary-2:#d8b4fe;
  --pink:#ec4899;
  --border:rgba(192,132,252,.16);
  --shadow-sm:0 6px 20px rgba(0,0,0,.45);
  --shadow-md:0 14px 34px rgba(0,0,0,.55);
  --shadow-fab:0 14px 36px rgba(219,39,119,.55);
  --nav-bg:rgba(15,10,22,.68);

  --brand-grad:linear-gradient(105deg,#e11d48 0%,#db2777 42%,#a855f7 100%);
  --brand-grad-soft:linear-gradient(135deg,rgba(225,29,72,.18),rgba(168,85,247,.14));
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}

body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;
  direction:rtl;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 0%,rgba(236,72,153,.15),transparent 30%),
    radial-gradient(circle at 100% 10%,rgba(168,85,247,.17),transparent 32%),
    linear-gradient(160deg,var(--bg),var(--bg-soft));
  min-height:100vh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  transition:background .35s ease,color .35s ease;
  -webkit-font-smoothing:antialiased;
}

html[data-theme="dark"] body,
body.dark{
  background:
    radial-gradient(circle at 10% 0%,rgba(168,85,247,.13),transparent 30%),
    radial-gradient(circle at 100% 20%,rgba(236,72,153,.08),transparent 30%),
    #000;
}

/* ✅ پشتیبانی از LTR */
body.lang-ltr { direction: ltr; }
body.lang-ltr .back-btn svg { transform: none; }
body.lang-ltr .search-icon { left: auto; right: 14px; }
body.lang-ltr .search-input { padding: 14px 18px 14px 48px; }
body.lang-ltr .art-card::before { right: auto; left: 0; border-radius: 18px 0 0 18px; }
body.lang-ltr .art-card-body { padding-left: 0; padding-right: 34px; }
body.lang-ltr .art-card-bookmark { left: auto; right: 12px; }

.app{width:100%;max-width:640px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

/* ═══ HEADER ═══ */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:18px 0 14px;
  position:sticky;top:0;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
  z-index:50;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] .topbar,
body.dark .topbar{background:linear-gradient(to bottom,#000 70%,transparent)}

.back-btn{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;text-decoration:none;flex:0 0 42px;
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow-sm);
  transition:transform .2s;
}
.back-btn:active{transform:scale(.9)}
.back-btn svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);
}

.page-title{
  flex:1;font-size:1.05rem;font-weight:900;text-align:center;
}

.icon-btn-mini{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 42px;text-decoration:none;
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow-sm);
  transition:transform .2s;
}
.icon-btn-mini:active{transform:scale(.9)}
.icon-btn-mini svg{
  width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

/* ═══ HERO ═══ */
.hero{
  border-radius:24px;padding:20px;
  margin-bottom:16px;color:#fff;
  background:var(--brand-grad);
  background-size:180% 180%;
  box-shadow:
    0 18px 42px rgba(219,39,119,.38),
    0 8px 22px rgba(168,85,247,.28),
    inset 0 1px 0 rgba(255,255,255,.20);
  animation:heroShift 14s ease infinite;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
  isolation:isolate;
}
@keyframes heroShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.hero::before{
  content:"";position:absolute;
  width:200px;height:200px;top:-110px;left:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;
  width:160px;height:160px;right:-85px;bottom:-95px;border-radius:50%;
  border:1px solid rgba(255,255,255,.15);pointer-events:none;
}

.hero-icon{
  width:54px;height:54px;border-radius:17px;
  background:rgba(255,255,255,.20);
  border:1.5px solid rgba(255,255,255,.30);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 54px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:relative;z-index:1;
}
.hero-icon svg{
  width:28px;height:28px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.hero-text-wrap{flex:1;min-width:0;position:relative;z-index:1}
.hero-title{
  font-size:1rem;font-weight:900;line-height:1.4;
  margin-bottom:4px;
  text-shadow:0 1px 3px rgba(0,0,0,.2);
}
.hero-sub{
  font-size:.7rem;line-height:1.75;
  opacity:.95;font-weight:600;
}

/* ═══ SEARCH ═══ */
.search-wrap{position:relative;margin-bottom:12px}
.search-input{
  width:100%;padding:14px 48px 14px 18px;
  border-radius:16px;
  border:1.5px solid var(--border);
  background:var(--surface);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  color:var(--text);
  font-family:inherit;font-size:.9rem;font-weight:700;
  outline:none;
  transition:border-color .25s,box-shadow .25s;
  box-shadow:var(--shadow-sm);
}
.search-input:focus{
  border-color:rgba(219,39,119,.6);
  box-shadow:0 0 0 4px var(--brand-grad-soft);
}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{
  position:absolute;left:14px;top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;fill:none;
  stroke:var(--text-muted);stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  pointer-events:none;
}

/* ═══ CHIPS ═══ */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding:4px 0 14px;
  scrollbar-width:none;-ms-overflow-style:none;
  scroll-behavior:smooth;
}
.chips::-webkit-scrollbar{display:none}

.chip{
  flex:0 0 auto;
  padding:8px 14px;border-radius:20px;
  background:var(--surface);
  border:1.5px solid var(--border);
  color:var(--text-soft);
  font-family:inherit;font-size:.74rem;
  font-weight:800;cursor:pointer;
  transition:all .22s;white-space:nowrap;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:6px;
}
.chip:active{transform:scale(.96)}
.chip.active{
  background:var(--brand-grad);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(219,39,119,.35);
}
.chip-count{
  font-size:.62rem;
  background:rgba(255,255,255,.25);
  padding:1px 7px;border-radius:10px;
}
.chip.active .chip-count{background:rgba(255,255,255,.28)}

/* ═══ FILTER ROW ═══ */
.filter-row{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 4px 14px;gap:10px;
}
.filter-count{
  font-size:.75rem;font-weight:800;
  color:var(--text-muted);
}
.filter-bm{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);
  border:1.5px solid var(--border);
  color:var(--text-soft);
  padding:7px 14px;border-radius:20px;
  font-family:inherit;font-size:.72rem;
  font-weight:800;cursor:pointer;
  transition:all .22s;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.filter-bm:active{transform:scale(.95)}
.filter-bm.active{
  background:linear-gradient(135deg,#fbbf24,#d97706);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(217,119,6,.35);
}
.filter-bm svg{
  width:14px;height:14px;fill:none;stroke:currentColor;
  stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
}
.filter-bm.active svg{fill:currentColor}

/* ═══ ARTICLE CARDS ═══ */
.art-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}

.art-card{
  background:var(--surface);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid var(--border);
  border-radius:18px;
  padding:14px 14px 14px 12px;
  cursor:pointer;
  transition:all .22s;
  display:flex;align-items:flex-start;gap:12px;
  box-shadow:var(--shadow-sm);
  width:100%;text-align:right;
  font-family:inherit;position:relative;overflow:hidden;
}
.art-card::before{
  content:"";position:absolute;
  top:0;right:0;
  width:4px;height:100%;
  background:var(--card-accent,var(--brand-grad));
  border-radius:0 18px 18px 0;
  opacity:.75;
}
.art-card:active{transform:scale(.985)}
.art-card:hover{border-color:rgba(219,39,119,.4)}

.art-card-icon{
  width:46px;height:46px;border-radius:14px;flex:0 0 46px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card-accent,var(--brand-grad));
  box-shadow:0 6px 16px rgba(0,0,0,.18);
  position:relative;
}
.art-card-icon::after{
  content:"";position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 60%);
  pointer-events:none;
}
.art-card-icon svg{
  width:22px;height:22px;fill:none;stroke:#fff;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  position:relative;z-index:1;
}

.art-card-body{flex:1;min-width:0;padding-left:34px}
.art-card-cat{
  display:inline-block;font-size:.6rem;font-weight:800;
  padding:2px 9px;border-radius:10px;
  background:var(--brand-grad-soft);
  color:var(--primary);
  border:1px solid var(--border);
  margin-bottom:6px;
}
.art-card-title{
  font-size:.9rem;font-weight:900;color:var(--text);
  line-height:1.55;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.art-card-excerpt{
  font-size:.73rem;font-weight:700;color:var(--text-muted);
  line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}

.art-card-bookmark{
  position:absolute;top:12px;left:12px;
  width:30px;height:30px;border-radius:10px;
  background:transparent;border:1px solid transparent;
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;padding:0;
}
.art-card-bookmark:hover{background:rgba(251,191,36,.15);color:#d97706}
.art-card-bookmark.active{color:#d97706}
.art-card-bookmark.active svg{fill:currentColor}
.art-card-bookmark svg{
  width:16px;height:16px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}

/* ═══ LOADER / EMPTY ═══ */
.loader,.empty{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);font-size:.9rem;
  font-weight:700;line-height:2;
}
.loader::before{
  content:"";display:block;
  width:32px;height:32px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  margin:0 auto 16px;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ MODAL ═══ */
.modal{
  position:fixed;inset:0;
  background:rgba(15,8,20,.65);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:5000;padding:15px;
}
.modal.show{display:flex;animation:mFade .25s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}

.modal-box{
  width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;
  background:var(--surface-solid);
  border:1px solid var(--border);
  border-radius:28px 28px 22px 22px;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));
  animation:mSlide .3s ease;
  box-shadow:0 -10px 55px rgba(219,39,119,.28);
}
@keyframes mSlide{
  from{transform:translateY(45px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modal-handle{
  width:44px;height:4px;border-radius:10px;
  margin:0 auto 16px;
  background:var(--text-muted);opacity:.25;
}

.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:16px;padding-bottom:14px;
  border-bottom:1.5px solid var(--border);gap:12px;
}
.modal-head-text{flex:1;min-width:0}
.modal-badge{
  display:inline-block;font-size:.62rem;font-weight:900;
  padding:4px 12px;border-radius:20px;
  background:var(--brand-grad);
  color:#fff;margin-bottom:8px;
  box-shadow:0 4px 12px rgba(219,39,119,.32);
}
.modal-q{
  font-size:1rem;font-weight:900;
  color:var(--text);line-height:1.7;
}
.modal-close{
  width:42px;height:42px;border-radius:14px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-soft);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 42px;
}
.modal-close:active{transform:scale(.9)}
.modal-close svg{
  width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
}

.modal-content{
  background:var(--brand-grad-soft);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;margin-top:6px;
}
.answer-text{
  font-size:.9rem;line-height:2.15;
  color:var(--text);font-weight:650;
  white-space:pre-line;
}

.modal-tags{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;
}
.modal-tag{
  font-size:.64rem;font-weight:800;
  padding:4px 10px;border-radius:20px;
  background:var(--brand-grad-soft);
  color:var(--primary);
  border:1px solid var(--border);
}

.modal-source{
  font-size:.7rem;font-weight:800;
  color:var(--text-muted);
  margin-top:14px;padding-top:12px;
  border-top:1px dashed var(--border);
  display:flex;align-items:center;gap:6px;
}
.modal-source svg{
  width:13px;height:13px;fill:none;
  stroke:currentColor;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round;
}

.action-bar{
  display:flex;gap:6px;margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--border);
  flex-wrap:wrap;
}
.act-btn{
  width:40px;height:40px;border-radius:13px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .18s;
  font-family:inherit;
}
.act-btn:hover{
  background:var(--brand-grad-soft);
  color:var(--primary);
  border-color:rgba(219,39,119,.3);
}
.act-btn:active{transform:scale(.88)}
.act-btn svg{
  width:19px;height:19px;fill:none;
  stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
.act-btn.active{color:#d97706;background:rgba(251,191,36,.15)}
.act-btn.active svg{fill:currentColor}
.act-btn.speaking{
  color:#fff;
  background:var(--brand-grad);
  animation:pulse 1.1s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ═══ BOTTOM NAV ═══ */
.bottom-nav{
  position:fixed;left:50%;bottom:0;
  transform:translateX(-50%);
  width:100%;max-width:640px;z-index:1000;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:1fr 1fr 78px 1fr 1fr;
  gap:4px;align-items:center;
  background:var(--nav-bg);
  border-top:1px solid rgba(255,255,255,.18);
  border-radius:26px 26px 0 0;
  box-shadow:
    0 -10px 28px rgba(225,29,72,.14),
    0 -24px 55px rgba(168,85,247,.10),
    inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(55px) saturate(220%);
  -webkit-backdrop-filter:blur(55px) saturate(220%);
}
html[data-theme="dark"] .bottom-nav,
body.dark .bottom-nav{
  border-top:1px solid rgba(255,255,255,.06);
  box-shadow:
    0 -10px 28px rgba(0,0,0,.55),
    0 -24px 55px rgba(219,39,119,.14);
}

.nav-item{
  min-height:56px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;position:relative;
  color:var(--text-muted);text-decoration:none;
  border-radius:14px;font-size:.56rem;font-weight:850;
  transition:color .2s ease,background .2s ease;
  padding:6px 2px;
}
.nav-item svg{
  width:21px;height:21px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .2s ease;
}
.nav-item.active{color:var(--primary);background:var(--brand-grad-soft)}
.nav-item.active svg{stroke-width:2.3}
.nav-item.active::before{
  content:"";position:absolute;top:-2px;left:50%;
  transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 5px 5px;
  background:var(--brand-grad);
}

.nav-fab-wrap{
  position:relative;height:100%;
  display:flex;align-items:center;justify-content:center;
}

.nav-fab{
  position:absolute;top:-30px;
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-grad);
  box-shadow:
    0 14px 32px rgba(225,29,72,.48),
    0 6px 16px rgba(168,85,247,.35);
  cursor:pointer;text-decoration:none;
  border:4px solid var(--surface-solid);
  transition:transform .25s ease,box-shadow .25s ease;
  z-index:10;
}
.nav-fab:active{transform:scale(.92)}
.nav-fab::before{
  content:"";position:absolute;
  width:100%;height:100%;border-radius:50%;

    return Array.isArray(arr)?arr:[];
  }catch(e){ return []; }
}
function setBookmarks(arr){
  try{ localStorage.setItem(BM_KEY,JSON.stringify(arr)); }catch(e){}
}
function isBookmarked(id){ return getBookmarks().indexOf(id)>-1; }
function toggleBookmark(id){
  var arr=getBookmarks();
  var i=arr.indexOf(id);
  if(i>-1){ arr.splice(i,1); setBookmarks(arr); return false; }
  else { arr.push(id); setBookmarks(arr); return true; }
}

/* ═══ Copy / Share / Speak ═══ */
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showMsg(currentT.copied); }
  catch(e){ showMsg('...'); }
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg(currentT.copied); })
      .catch(function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function shareText(text,title){
  if(!text) return;
  if(navigator.share){
    navigator.share({title:title||currentT.page_title,text:text}).catch(function(){});
  } else { copyText(text); showMsg(currentT.share_fallback); }
}
function speakText(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window)){ showMsg(currentT.speech_unsupported); return; }
  if(window.speechSynthesis.speaking||window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    if(speechBtn===btn){ speechBtn=null; return; }
  }
  var utt=new SpeechSynthesisUtterance(text);
  utt.lang = currentT.lang === 'en' ? 'en-US' : (currentT.lang === 'ps' ? 'ps-AF' : 'fa-IR');
  utt.rate=0.95; utt.pitch=1;
  try{
    var voices=window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang&&voices[i].lang.toLowerCase().indexOf(currentT.lang)===0){ utt.voice=voices[i]; break; }
    }
  }catch(e){}
  if(btn){ btn.classList.add('speaking'); speechBtn=btn; }
  utt.onend=function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  utt.onerror=function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  window.speechSynthesis.speak(utt);
}
function stopSpeech(){
  try{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    speechBtn=null;
  }catch(e){}
}

/* ═══ LOAD ═══ */
function fetchJSON(path){
  return fetch(path).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function normalizeArticle(a, catId, idx){
  if(!a) return null;
  if(typeof a === 'string') a = { content: a };
  var id = a.id || (catId+'_'+(idx+1));
  var title = a.title || a.q || a.question || a.name || a.heading || '';
  var excerpt = a.excerpt || a.short || a.summary || '';
  var content = a.content || a.a || a.answer || a.text || a.body || '';
  if(content && typeof content === 'object'){
    content = content.jafari || content.hanafi || content.sistani
           || content[Object.keys(content)[0]] || '';
  }
  var tags = Array.isArray(a.tags) ? a.tags : [];
  var source = a.source || '';
  if(!title && content){
    title = String(content).split('\n')[0].slice(0,80);
  }
  if(!excerpt && content){
    var flat = String(content).replace(/\n/g,' ').trim();
    excerpt = flat.slice(0,120) + (flat.length>120?'…':'');
  }
  if(!title && !content) return null;
  return {
    id: String(id),
    title: String(title),
    excerpt: String(excerpt),
    content: String(content),
    tags: tags,
    source: String(source),
    catId: catId
  };
}

function extractArticles(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.articles)) return data.articles;
  if(Array.isArray(data.items)) return data.items;
  if(Array.isArray(data.questions)) return data.questions;
  if(Array.isArray(data.list)) return data.list;
  if(Array.isArray(data.data)) return data.data;
  if(Array.isArray(data.categories)){
    var out=[];
    data.categories.forEach(function(c){
      if(Array.isArray(c.articles)) out = out.concat(c.articles);
      else if(Array.isArray(c.questions)) out = out.concat(c.questions);
      else out = out.concat([c]);
    });
    return out;
  }
  if(data.q || data.title || data.content || data.a) return [data];
  return [];
}

function loadAllHealth(){
  var promises = HEALTH_FILES.map(function(cfg){
    return fetchJSON(BASE_PATH + cfg.file)
      .then(function(data){ return { cfg: cfg, raw: data }; })
      .catch(function(err){
        console.warn('⚠️ ' + cfg.file + ':', err.message);
        return null;
      });
  });

  return Promise.all(promises).then(function(results){
    var cats = [];
    results.forEach(function(r){
      if(!r) return;
      var arr = extractArticles(r.raw);
      if(!arr || arr.length === 0) return;
      var articles = arr
        .map(function(a, i){ return normalizeArticle(a, r.cfg.id, i); })
        .filter(Boolean);
      if(articles.length === 0) return;
      cats.push({
        id: r.cfg.id,
        title: r.cfg.title,
        color: r.cfg.color,
        svg: r.cfg.svg,
        articles: articles
      });
    });
    return { categories: cats };
  });
}

/* ═══ RENDER CHIPS ═══ */
function renderChips(){
  var wrap = $('chips');
  if(!allData || !allData.categories){ wrap.innerHTML = ''; return; }
  var total = allArticles.length;
  var html = '<button class="chip active" data-cat="all">' +
    '<span>' + escapeHtml(currentT.all) + '</span>' +
    '<span class="chip-count">' + faNum(total) + '</span>' +
  '</button>';
  allData.categories.forEach(function(cat){
    html += '<button class="chip" data-cat="' + escapeHtml(cat.id) + '">' +
      '<span>' + escapeHtml(cat.title) + '</span>' +
      '<span class="chip-count">' + faNum(cat.articles.length) + '</span>' +
    '</button>';
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      wrap.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      currentCat = chip.getAttribute('data-cat');
      renderArticles();
    });
  });
}

/* ═══ RENDER ARTICLES ═══ */
function renderArticles(){
  var grid = $('artGrid');
  var list = allArticles.slice();

  if(currentCat !== 'all'){
    list = list.filter(function(a){ return a.catId === currentCat; });
  }
  if(showOnlyBookmarks){
    var bms = getBookmarks();
    list = list.filter(function(a){ return bms.indexOf(a.id) > -1; });
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase().trim();
    list = list.filter(function(a){
      return a.title.toLowerCase().indexOf(q) > -1 ||
             a.excerpt.toLowerCase().indexOf(q) > -1 ||
             a.content.toLowerCase().indexOf(q) > -1 ||
             a.tags.some(function(t){ return String(t).toLowerCase().indexOf(q) > -1; });
    });
  }

  var cnt = $('filterCount');
  if(cnt) cnt.textContent = faNum(list.length) + ' ' + currentT.count;

  if(list.length === 0){
    grid.innerHTML = '<div class="empty">' +
      (showOnlyBookmarks ? escapeHtml(currentT.no_bookmark) : escapeHtml(currentT.no_result)) +
    '</div>';
    return;
  }

  var html = '';
  list.forEach(function(a){
    var bm = isBookmarked(a.id);
    var catInfo = catMap[a.catId] || {};
    var catTitle = catInfo.title || '';
    var catColor = catInfo.color || 'linear-gradient(135deg,#e11d48,#a855f7)';
    var catSvg = catInfo.svg || '';
    html += '<div class="art-card" data-id="' + escapeHtml(a.id) + '" role="button" tabindex="0" style="--card-accent:' + catColor + '">' +
      '<div class="art-card-icon" style="background:' + catColor + '">' + catSvg + '</div>' +
      '<div class="art-card-body">' +
        (catTitle ? '<span class="art-card-cat">' + escapeHtml(catTitle) + '</span>' : '') +
        '<div class="art-card-title">' + escapeHtml(a.title) + '</div>' +
        '<div class="art-card-excerpt">' + escapeHtml(a.excerpt) + '</div>' +
      '</div>' +
      '<button class="art-card-bookmark ' + (bm ? 'active' : '') + '" data-bm="' + escapeHtml(a.id) + '" type="button" aria-label="نشان‌گذاری">' +
        '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
      '</button>' +
    '</div>';
  });
  grid.innerHTML = html;

  grid.querySelectorAll('.art-card').forEach(function(card){
    card.addEventListener('click', function(e){
      if(e.target.closest('[data-bm]')) return;
      openArticle(card.getAttribute('data-id'));
    });
    card.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openArticle(card.getAttribute('data-id')); }
    });
  });

  grid.querySelectorAll('[data-bm]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = btn.getAttribute('data-bm');
      var now = toggleBookmark(id);
      btn.classList.toggle('active', now);
      showMsg(now ? currentT.bm_added : currentT.bm_removed);
      if(showOnlyBookmarks) renderArticles();
      if (window.bnAnalytics) window.bnAnalytics.track('health_bookmark', { id: id, added: now });
    });
  });
}

/* ═══ OPEN ARTICLE ═══ */
function openArticle(id){
  var art = null;
  for(var i=0; i<allArticles.length; i++){
    if(allArticles[i].id === id){ art = allArticles[i]; break; }
  }
  if(!art) return;
  currentArticle = art;

  var catInfo = catMap[art.catId] || {};
  $('modalBadge').textContent = catInfo.title || currentT.badge_article;
  $('modalTitle').textContent = art.title;
  $('modalContent').textContent = art.content || art.excerpt || '';

  var tagsEl = $('modalTags');
  if(art.tags && art.tags.length){
    tagsEl.innerHTML = art.tags.map(function(t){
      return '<span class="modal-tag">' + escapeHtml(t) + '</span>';
    }).join('');
    tagsEl.style.display = 'flex';
  } else { tagsEl.innerHTML = ''; tagsEl.style.display = 'none'; }

  var srcEl = $('modalSource');
  if(art.source){
    srcEl.style.display = 'flex';
    srcEl.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>' + escapeHtml(art.source) + '</span>';
  } else { srcEl.style.display = 'none'; }

  var bmBtn = $('modalBookmarkBtn');
  if(bmBtn) bmBtn.classList.toggle('active', isBookmarked(art.id));

  $('artModal').classList.add('show');

  if (window.bnAnalytics) window.bnAnalytics.track('health_article_open', { id: art.id, cat: art.catId });
}

function closeModal(){
  stopSpeech();
  $('artModal').classList.remove('show');
  currentArticle = null;
}

/* ═══ MODAL ACTIONS ═══ */
function setupModalActions(){
  var bar = document.querySelector('.action-bar');
  if(bar){
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('[data-art-act]');
      if(!btn || !currentArticle) return;
      var act = btn.getAttribute('data-art-act');
      var art = currentArticle;
      var fullText = (art.title ? art.title + '\n\n' : '') + (art.content || '') + (art.source ? '\n\n— ' + art.source : '');
      if(act === 'copy') copyText(fullText);
      else if(act === 'share') shareText(fullText + '\n\n— ' + currentT.page_title, currentT.page_title);
      else if(act === 'speak') speakText((art.title ? art.title + '. ' : '') + (art.content || ''), btn);
      else if(act === 'bookmark'){
        var now = toggleBookmark(art.id);
        btn.classList.toggle('active', now);
        showMsg(now ? currentT.bm_added : currentT.bm_removed);
        renderArticles();
      }
    });
  }
  var closeBtn = $('modalClose');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  var modal = $('artModal');
  if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('artModal').classList.contains('show')) closeModal();
  });
}

/* ═══ FILTERS ═══ */
function setupFilters(){
  var bmToggle = $('bmToggle');
  if(bmToggle){
    bmToggle.addEventListener('click', function(){
      showOnlyBookmarks = !showOnlyBookmarks;
      bmToggle.classList.toggle('active', showOnlyBookmarks);
      renderArticles();
    });
  }
  var si = $('searchInput');
  if(si){
    var timer = null;
    si.addEventListener('input', function(){
      clearTimeout(timer);
      timer = setTimeout(function(){
        searchQuery = si.value || '';
        renderArticles();
      }, 180);
    });
  }
}

/* ═══ INIT ═══ */
function init(){
  applyTheme();
  applyLang(getLang());
  setupFilters();
  setupModalActions();

  loadAllHealth().then(function(d){
    if(!d || !d.categories || d.categories.length === 0){
      $('artGrid').innerHTML =
        '<div class="empty">خطا در بارگذاری مقالات<br><br>' +
        'مسیر: <strong>data/medical/*.json</strong><br><br>' +
        '<span style="font-size:0.75rem;opacity:0.8;">توجه: باید صفحه را از طریق سرور (http) باز کنی</span>' +
        '</div>';
      return;
    }
    allData = d;
    catMap = {};
    allArticles = [];
    d.categories.forEach(function(cat){
      catMap[cat.id] = {
        title: cat.title,
        color: cat.color,
        svg: cat.svg
      };
      cat.articles.forEach(function(a){
        allArticles.push(a);
      });
    });
    renderChips();
    renderArticles();
    console.log('✅ سلامت بانوان آماده — ' + allArticles.length + ' مقاله در ' + d.categories.length + ' دسته');
  });

  window.addEventListener('storage', function(e){
    if(e.key === 'bn_lang') applyLang(e.newValue || DEFAULT_LANG);
    if(e.key === 'bn_theme') applyTheme();
  });
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else init();

})();
</script>
