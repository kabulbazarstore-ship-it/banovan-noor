<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#d97706" />
<title>علاقه‌مندی‌ها | بانوان نور</title>
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
:root{
  --bg-1:#fffbeb;--bg-2:#fef3c7;--bg-3:#fde68a;--bg-4:#fcd34d;
  --text:#78350f;--text-soft:#92400e;--text-card:#78350f;--text-muted:#a16207;
  --card:rgba(255,255,255,.85);--card-border:rgba(217,119,6,.22);
  --card-shadow:0 8px 22px rgba(180,83,9,.12);
  --icon-bg:rgba(255,255,255,.85);--icon-border:rgba(217,119,6,.25);--icon-color:#b45309;
  --nav-bg:rgba(255,255,255,.94);--nav-border:rgba(217,119,6,.2);
  --nav-color:#a16207;--nav-active:#b45309;
  --star:.2;
  --search-bg:rgba(255,255,255,.92);
  --chip-bg:rgba(255,255,255,.7);
  --chip-border:rgba(217,119,6,.25);
  --accent:#d97706;
  --accent-dark:#b45309;
  --gold-soft:rgba(217,119,6,.1);
}
body.dark{
  --bg-1:#451a03;--bg-2:#78350f;--bg-3:#92400e;--bg-4:#451a03;
  --text:#fff;--text-soft:#fde68a;--text-card:#fff;--text-muted:#fcd34d;
  --card:rgba(255,255,255,.08);--card-border:rgba(252,211,77,.3);
  --card-shadow:0 8px 22px rgba(0,0,0,.3);
  --icon-bg:rgba(255,255,255,.08);--icon-border:rgba(252,211,77,.3);--icon-color:#fde68a;
  --nav-bg:rgba(69,26,3,.94);--nav-border:rgba(252,211,77,.25);
  --nav-color:#fcd34d;--nav-active:#fde68a;
  --star:.7;
  --search-bg:rgba(255,255,255,.08);
  --chip-bg:rgba(255,255,255,.06);
  --chip-border:rgba(252,211,77,.3);
  --gold-soft:rgba(252,211,77,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%}
body{
  font-family:Tahoma,'Segoe UI',Arial,sans-serif;direction:rtl;font-size:17px;
  line-height:1.8;font-weight:600;color:var(--text);background-color:var(--bg-1);
  background-image:
    radial-gradient(ellipse 500px 400px at 20% 5%,rgba(251,191,36,.15) 0,transparent 60%),
    radial-gradient(ellipse 400px 350px at 85% 15%,rgba(252,211,77,.18) 0,transparent 65%),
    linear-gradient(160deg,var(--bg-1) 0,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%,var(--bg-4) 100%);
  background-attachment:fixed;min-height:100vh;padding:0 0 110px;position:relative;overflow-x:hidden;
  transition:background-color .4s,color .3s;
}
body::before{
  content:"";position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,var(--star)) 0,transparent 1.2%),
    radial-gradient(circle at 88% 6%,rgba(255,255,255,var(--star)) 0,transparent 1%),
    radial-gradient(circle at 30% 20%,rgba(253,230,138,var(--star)) 0,transparent 0.8%);
  pointer-events:none;z-index:0;
}
.app{max-width:520px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

.page-header{display:flex;align-items:center;gap:12px;padding:20px 0 16px}
.back-btn{
  width:44px;height:44px;border-radius:14px;background:var(--icon-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--icon-border);color:var(--icon-color);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex:0 0 44px;text-decoration:none;box-shadow:0 4px 12px rgba(180,83,9,.15);
}
.back-btn:active{transform:scale(.94)}
.back-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
.page-header h1{font-size:1.35rem;font-weight:900;color:var(--text);flex:1;text-align:center;padding-right:44px}

.hero{
  background:linear-gradient(135deg,#fbbf24 0,#d97706 100%);
  border-radius:20px;padding:22px;margin-bottom:16px;color:#fff;
  position:relative;overflow:hidden;
  box-shadow:0 12px 30px rgba(180,83,9,.35);
  display:flex;align-items:center;gap:14px;
}
.hero::before{
  content:"";position:absolute;top:-40px;right:-40px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);
  pointer-events:none;
}
.hero-icon{
  width:56px;height:56px;border-radius:16px;
  background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;flex:0 0 56px;
  backdrop-filter:blur(10px);
}
.hero-icon svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hero-text{flex:1}
.hero-title{font-size:1.1rem;font-weight:900;margin-bottom:5px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero-sub{font-size:.85rem;opacity:.95;font-weight:700;line-height:1.7}

/* TABS */
.tabs{
  display:flex;gap:6px;background:var(--chip-bg);
  border:1.5px solid var(--chip-border);border-radius:16px;
  padding:5px;margin-bottom:16px;
  backdrop-filter:blur(12px);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;min-width:fit-content;padding:11px 10px;border-radius:12px;border:0;
  background:transparent;color:var(--text-soft);
  font-family:inherit;font-size:.82rem;font-weight:800;
  cursor:pointer;transition:all .22s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.tab:active{transform:scale(.96)}
.tab.active{
  background:linear-gradient(135deg,#fbbf24,#d97706);
  color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.4);
}
.tab svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:0 0 15px}
.tab .tab-count{
  font-size:.65rem;background:rgba(255,255,255,.25);
  padding:1px 6px;border-radius:10px;font-weight:900;
  min-width:16px;text-align:center;
}
.tab.active .tab-count{background:rgba(255,255,255,.3)}

.search-wrap{position:relative;margin-bottom:14px}
.search-input{
  width:100%;padding:14px 48px 14px 18px;border-radius:16px;
  border:1.5px solid var(--card-border);background:var(--search-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);font-family:inherit;font-size:.95rem;font-weight:700;
  outline:none;transition:border-color .25s;
}
.search-input:focus{border-color:rgba(217,119,6,.7)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:none;stroke:var(--text-muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

.filter-count{
  font-size:.82rem;font-weight:800;color:var(--text-muted);
  margin:0 4px 14px;
}

/* ITEMS */
.fav-list{display:flex;flex-direction:column;gap:10px}
.fav-card{
  background:var(--card);backdrop-filter:blur(20px);
  border:1.5px solid var(--card-border);border-radius:16px;
  padding:14px 16px;cursor:pointer;transition:all .22s;
  display:flex;align-items:flex-start;gap:12px;
  box-shadow:var(--card-shadow);width:100%;text-align:right;
  font-family:inherit;position:relative;overflow:hidden;
}
.fav-card:active{transform:scale(.98)}
.fav-card:hover{border-color:rgba(217,119,6,.45)}
.fav-card::before{
  content:"";position:absolute;top:0;right:0;
  width:4px;height:100%;
  background:linear-gradient(180deg,#fbbf24,#d97706);
}
.fav-icon{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(217,119,6,.15));
  border:1px solid rgba(217,119,6,.2);
}
.fav-icon svg{
  width:20px;height:20px;fill:none;
  stroke:#b45309;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
body.dark .fav-icon svg{stroke:#fde68a}
.fav-body{flex:1;min-width:0;padding-left:32px}
.fav-cat{
  display:inline-block;font-size:.62rem;font-weight:900;
  padding:2px 8px;border-radius:10px;
  background:var(--gold-soft);color:var(--accent);
  margin-bottom:5px;
}
.fav-title{
  font-size:.94rem;font-weight:900;color:var(--text-card);
  line-height:1.5;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.fav-excerpt{
  font-size:.78rem;font-weight:700;color:var(--text-muted);
  line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.fav-remove{
  position:absolute;top:10px;left:10px;
  width:32px;height:32px;border-radius:10px;
  background:rgba(217,119,6,.1);border:0;
  color:#d97706;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .2s;
}
.fav-remove:hover{background:rgba(217,119,6,.2);transform:scale(1.08)}
.fav-remove:active{transform:scale(.9)}
.fav-remove svg{width:16px;height:16px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* EMPTY */
.empty-state{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);
}
.empty-state-icon{
  width:90px;height:90px;margin:0 auto 20px;
  border-radius:50%;background:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;
}
.empty-state-icon svg{
  width:44px;height:44px;fill:none;stroke:var(--accent);
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  opacity:.7;
}
.empty-state-title{
  font-size:1.08rem;font-weight:900;color:var(--text-card);
  margin-bottom:10px;
}
.empty-state-text{
  font-size:.9rem;font-weight:700;line-height:2;
  max-width:300px;margin:0 auto;
}

.loader{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);font-size:.95rem;font-weight:700;
}
.loader::before{
  content:"";display:block;width:32px;height:32px;
  border:3px solid rgba(217,119,6,.2);border-top-color:#d97706;
  border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;
  z-index:10000;padding:0;
}
.modal.show{display:flex;animation:mFade .3s ease}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.modal-box{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--bg-1);border-radius:28px 28px 0 0;
  padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));
  animation:mSlide .35s ease;
}
@keyframes mSlide{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:18px;padding-bottom:14px;
  border-bottom:1.5px solid var(--card-border);gap:12px;
}
.modal-head-text{flex:1;min-width:0}
.modal-badge{
  display:inline-block;font-size:.72rem;font-weight:900;
  padding:4px 12px;border-radius:20px;
  background:linear-gradient(135deg,#fbbf24,#d97706);
  color:#fff;margin-bottom:10px;box-shadow:0 4px 12px rgba(217,119,6,.35);
}
.modal-q{font-size:1.12rem;font-weight:900;color:var(--text);line-height:1.7}
.modal-close{
  width:44px;height:44px;border-radius:14px;
  background:var(--card);border:1px solid var(--card-border);
  color:var(--text-soft);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 44px;
}
.modal-close:active{transform:scale(.9)}
.modal-close svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.modal-content{
  background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(217,119,6,.06));
  border:1px solid var(--card-border);border-radius:18px;
  padding:18px;margin-top:6px;
}
.answer-text{
  font-size:1rem;line-height:2.2;color:var(--text-card);
  font-weight:700;white-space:pre-line;
}
.action-bar{
  display:flex;gap:4px;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--card-border);flex-wrap:wrap;
}
.act-btn{
  width:40px;height:40px;border-radius:11px;
  background:transparent;border:1px solid transparent;
  color:var(--text-muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;transition:all .18s;
}
.act-btn:hover{background:var(--icon-bg);border-color:var(--icon-border);color:var(--icon-color)}
.act-btn:active{transform:scale(.88)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act-btn.speaking{color:#b45309;background:rgba(217,119,6,.12);animation:pulse 1.1s infinite}
body.dark .act-btn.speaking{color:#fde68a;background:rgba(253,230,138,.15)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(24px);
  border-top:1px solid var(--nav-border);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;
  box-shadow:0 -8px 30px rgba(180,83,9,.15);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--nav-color);padding:8px 2px;font-size:.68rem;font-weight:800;
  text-decoration:none;cursor:pointer;border-radius:12px;position:relative;
}
.nav-item.active{color:var(--nav-active)}
.nav-item.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,#fbbf24,#d97706,#fde68a);
  box-shadow:0 0 12px rgba(217,119,6,.8);
}
.nav-item svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke-width:2.4}

.toast{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,#92400e,#d97706);color:#fff;
  padding:14px 26px;border-radius:30px;font-size:.95rem;font-weight:900;
  z-index:10002;opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:0 12px 30px rgba(217,119,6,.5);max-width:90vw;text-align:center;
  white-space:pre-line;line-height:1.7;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:380px){
  body{font-size:16px}
  .app{padding:0 12px}
  .page-header h1{font-size:1.2rem}
  .hero{padding:18px}
  .hero-icon{width:48px;height:48px;flex:0 0 48px}
  .fav-title{font-size:.88rem}
  .fav-excerpt{font-size:.72rem}
  .nav-item{font-size:.62rem}
  .nav-item svg{width:21px;height:21px}
  .tab{font-size:.75rem;padding:10px 8px}
}
</style>
</head>

<div class="modal" id="favModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-head-text">
        <span class="modal-badge" id="modalBadge">علاقه‌مندی</span>
        <div class="modal-q" id="modalTitle">—</div>
      </div>
      <button class="modal-close" id="modalClose" type="button" aria-label="بستن">

      <div class="answer-text" id="modalContent">—</div>

          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

          <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ═══════════════════════════════════════════════════════════
   منابع نشان‌شده‌ها
   ═══════════════════════════════════════════════════════════ */
var SOURCES = [
  {
    id: 'hamraz',
    title: 'همراز',
    icon: '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    keys: ['bn_hamraz_bookmarks', 'bn_fb_'],
    file: 'data/hamraz/questions.json',
    isHamraz: true,
    matchKey: 'id'
  },
  {
    id: 'health',
    title: 'سلامت',
    icon: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    keys: ['bn_health_bookmarks'],
    files: ['data/medical/menstruation.json','data/medical/pregnancy.json','data/medical/childbirth.json','data/medical/vaginal-health.json','data/medical/anal-health.json','data/medical/breast-health.json','data/medical/personal-hygiene.json','data/medical/nutrition.json','data/medical/general-health.json']
  },
  {
    id: 'ahkam',
    title: 'احکام',
    icon: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    keys: ['bn_ahkam_bookmarks'],
    files: ['data/fiqh/taharat.json','data/fiqh/namaz.json','data/fiqh/rooze.json','data/fiqh/khoms.json','data/fiqh/ezdevaj.json','data/fiqh/talaq.json','data/fiqh/hejab.json','data/fiqh/mali.json','data/fiqh/moteferrege.json']
  },
  {
    id: 'menstruation',
    title: 'قاعدگی',
    icon: '<svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>',
    keys: ['bn_menstruation_bookmarks'],
    files: ['data/medical/menstruation.json']
  },
  {
    id: 'pregnancy',
    title: 'بارداری',
    icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
    keys: ['bn_pregnancy_bookmarks'],
    files: ['data/medical/pregnancy.json']
  },
  {
    id: 'childbirth',
    title: 'زایمان',
    icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    keys: ['bn_childbirth_bookmarks'],
    files: ['data/medical/childbirth.json']
  },
  {
    id: 'duas',
    title: 'دعا و اعمال',
    icon: '<svg viewBox="0 0 24 24"><path d="M12 2v20M5 7l7-5 7 5M5 17l7 5 7-5"/></svg>',
    keys: ['bn_duas_bookmarks'],
    files: ['data/duas/duas.json','data/duas/amal.json']
  }
];

/* فایل‌های JSON یکتا برای fetch */
var uniqueFiles = {};
SOURCES.forEach(function(s){
  if(s.file) uniqueFiles[s.file] = true;
  if(s.files) s.files.forEach(function(f){ uniqueFiles[f] = true; });
});
var FILES_LIST = Object.keys(uniqueFiles);

/* ═══ HELPERS ═══ */
function $(id){ return document.getElementById(id); }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function faNum(n){ return String(n).replace(/\d/g,function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
function showMsg(msg,dur){
  dur=dur||2200;
  var t=$('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  var timer = setTimeout(function(){ t.classList.remove('show'); },dur);
}
function getTheme(){ try{ return localStorage.getItem('bn_theme')||'light'; }catch(e){ return 'light'; } }
function applyTheme(){
  if(getTheme()==='dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}

/* ═══ داده‌ها ═══ */
var itemsBySource = {};  // { sourceId: [ {id, title, content, catTitle, icon} ] }
var currentTab = 'all';
var searchQuery = '';
var currentItem = null;
var speechBtn = null;

/* ═══ BOOKMARKS خواندن ═══ */
function readBookmarks(){
  var result = {};  // { sourceId: [ids] }
  SOURCES.forEach(function(s){
    var all = [];
    s.keys.forEach(function(k){
      try{
        if(k.indexOf('_') > -1 && k.slice(-1) === '_'){
          // prefix مثل bn_fb_
          for(var i=0; i<localStorage.length; i++){
            var key = localStorage.key(i);
            if(key && key.indexOf(k) === 0){
              // این feedback هست، نه bookmark؛ صرف‌نظر
            }
          }
        } else {
          var raw = localStorage.getItem(k);
          if(raw){
            var arr = JSON.parse(raw);
            if(Array.isArray(arr)) all = all.concat(arr);
          }
        }
      }catch(e){}
    });
    result[s.id] = all;
  });
  return result;
}

/* ═══ LOAD FILES ═══ */
function fetchJSON(path){
  return fetch(path).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function extractArticles(data){
  if(!data) return [];
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.articles)) return data.articles;
  if(Array.isArray(data.doctors)) return data.doctors;
  if(Array.isArray(data.questions)) return data.questions;
  if(Array.isArray(data.items)) return data.items;
  if(Array.isArray(data.list)) return data.list;
  if(Array.isArray(data.data)) return data.data;
  if(Array.isArray(data.categories)){
    var out=[];
    data.categories.forEach(function(c){
      if(Array.isArray(c.articles)){
        c.articles.forEach(function(a){ a._catTitle = c.title; out.push(a); });
      } else if(Array.isArray(c.questions)){
        c.questions.forEach(function(a){ a._catTitle = c.title; out.push(a); });
      } else {
        out.push(c);
      }
    });
    return out;
  }
  if(data.q || data.title || data.content) return [data];
  return [];
}

function normalizeArticle(a){
  if(!a) return null;
  if(typeof a === 'string') a = { content: a };
  var id = a.id || '';
  if(!id) return null;
  var title = a.title || a.q || a.question || a.name || '';
  var content = a.content || a.a || a.answer || a.text || a.body || '';
  if(content && typeof content === 'object'){
    content = content.jafari || content.sistani || content[Object.keys(content)[0]] || '';
  }
  var excerpt = a.excerpt || '';
  if(!excerpt && content){
    var flat = String(content).replace(/\n/g,' ').trim();
    excerpt = flat.slice(0,120) + (flat.length>120?'…':'');
  }
  return {
    id: String(id),
    title: String(title),
    content: String(content),
    excerpt: String(excerpt),
    icon: a.icon || '',
    catTitle: a._catTitle || ''
  };
}

function loadAllData(){
  var promises = FILES_LIST.map(function(path){
    return fetchJSON(path)
      .then(function(data){ return { path: path, data: data }; })
      .catch(function(err){
        console.warn('⚠️ ' + path + ':', err.message);
        return null;
      });
  });
  return Promise.all(promises).then(function(results){
    var fileMap = {};
    results.forEach(function(r){
      if(!r) return;
      var arr = extractArticles(r.data);
      fileMap[r.path] = arr.map(normalizeArticle).filter(Boolean);
    });
    // توزیع بین منابع
    SOURCES.forEach(function(s){
      var items = [];
      if(s.file && fileMap[s.file]) items = items.concat(fileMap[s.file]);
      if(s.files){
        s.files.forEach(function(f){
          if(fileMap[f]) items = items.concat(fileMap[f]);
        });
      }
      itemsBySource[s.id] = items;
    });
    return itemsBySource;
  });
}

/* ═══ BUILD FAVORITE ITEMS ═══ */
function buildFavorites(){
  var bm = readBookmarks();
  var out = [];
  SOURCES.forEach(function(s){
    var ids = bm[s.id] || [];
    if(ids.length === 0) return;
    var sourceItems = itemsBySource[s.id] || [];
    ids.forEach(function(id){
      var found = null;
      for(var i=0; i<sourceItems.length; i++){
        if(sourceItems[i].id === String(id)){ found = sourceItems[i]; break; }
      }
      if(found){
        out.push({
          sourceId: s.id,
          sourceTitle: s.title,
          sourceIcon: s.icon,
          id: found.id,
          title: found.title,
          excerpt: found.excerpt,
          content: found.content,
          catTitle: found.catTitle || s.title
        });
      }
    });
  });
  return out;
}

/* ═══ RENDER TABS ═══ */
function renderTabs(){
  var wrap = $('tabs');
  if(!wrap) return;
  var allFavs = buildFavorites();
  var counts = {};
  allFavs.forEach(function(f){
    counts[f.sourceId] = (counts[f.sourceId] || 0) + 1;
  });

  var html = '<button class="tab active" data-tab="all">' +
    '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
    '<span>همه</span>' +
    '<span class="tab-count">' + faNum(allFavs.length) + '</span>' +
  '</button>';

  SOURCES.forEach(function(s){
    var count = counts[s.id] || 0;
    if(count === 0) return;
    html += '<button class="tab" data-tab="' + escapeHtml(s.id) + '">' +
      s.icon +
      '<span>' + escapeHtml(s.title) + '</span>' +
      '<span class="tab-count">' + faNum(count) + '</span>' +
    '</button>';
  });

  wrap.innerHTML = html;
  wrap.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      wrap.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentTab = tab.getAttribute('data-tab');
      renderFavorites();
    });
  });
}

/* ═══ RENDER FAVORITES ═══ */
function renderFavorites(){
  var list = $('favList');
  if(!list) return;

  var all = buildFavorites();

  if(currentTab !== 'all'){
    all = all.filter(function(f){ return f.sourceId === currentTab; });
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase().trim();
    all = all.filter(function(f){
      return (f.title || '').toLowerCase().indexOf(q) > -1 ||
             (f.excerpt || '').toLowerCase().indexOf(q) > -1 ||
             (f.content || '').toLowerCase().indexOf(q) > -1;
    });
  }

  var cnt = $('filterCount');
  if(cnt) cnt.textContent = faNum(all.length) + ' مورد';

  if(all.length === 0){
    var isEmpty = buildFavorites().length === 0;
    list.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">' +
          '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
        '</div>' +
        '<div class="empty-state-title">' +
          (isEmpty ? 'هنوز چیزی نشان نکرده‌ای' : 'موردی یافت نشد') +
        '</div>' +
        '<div class="empty-state-text">' +
          (isEmpty
            ? 'در بخش‌های مختلف اپ، روی ستاره ⭐ کنار مطالب بزن تا اینجا نمایش داده بشن'
            : 'کلمه دیگری امتحان کن یا فیلتر رو عوض کن') +
        '</div>' +
      '</div>';
    return;
  }

  var html = '';
  all.forEach(function(f){
    var iconHtml;
    if(f.sourceIcon && f.sourceIcon.indexOf('<svg') === 0){
      iconHtml = f.sourceIcon;
    } else {
      iconHtml = '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    }

    html += '<div class="fav-card" data-id="' + escapeHtml(f.id) + '" data-source="' + escapeHtml(f.sourceId) + '" role="button" tabindex="0">' +
      '<div class="fav-icon">' + iconHtml + '</div>' +
      '<div class="fav-body">' +
        '<span class="fav-cat">' + escapeHtml(f.catTitle || f.sourceTitle) + '</span>' +
        '<div class="fav-title">' + escapeHtml(f.title || 'بدون عنوان') + '</div>' +
        '<div class="fav-excerpt">' + escapeHtml(f.excerpt || '') + '</div>' +
      '</div>' +
      '<button class="fav-remove" data-remove="' + escapeHtml(f.id) + '" data-source="' + escapeHtml(f.sourceId) + '" type="button" aria-label="حذف">' +
        '<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' +
      '</button>' +
    '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.fav-card').forEach(function(card){
    card.addEventListener('click', function(e){
      if(e.target.closest('[data-remove]')) return;
      var id = card.getAttribute('data-id');
      var src = card.getAttribute('data-source');
      openItem(src, id);
    });
  });

  list.querySelectorAll('[data-remove]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = btn.getAttribute('data-remove');
      var src = btn.getAttribute('data-source');
      removeBookmark(src, id);
    });
  });
}

/* ═══ REMOVE BOOKMARK ═══ */
function removeBookmark(sourceId, itemId){
  var s = null;
  for(var i=0; i<SOURCES.length; i++){
    if(SOURCES[i].id === sourceId){ s = SOURCES[i]; break; }
  }
  if(!s) return;
  s.keys.forEach(function(k){
    try{
      var raw = localStorage.getItem(k);
      if(!raw) return;
      var arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return;
      var idx = arr.indexOf(itemId);
      if(idx > -1){
        arr.splice(idx, 1);
        localStorage.setItem(k, JSON.stringify(arr));
      }
    }catch(e){}
  });
  showMsg('از علاقه‌مندی‌ها حذف شد');
  renderTabs();
  renderFavorites();
}

/* ═══ OPEN ITEM ═══ */
function openItem(sourceId, itemId){
  var sourceItems = itemsBySource[sourceId] || [];
  var found = null;
  for(var i=0; i<sourceItems.length; i++){
    if(sourceItems[i].id === String(itemId)){ found = sourceItems[i]; break; }
  }
  if(!found) return;
  currentItem = found;

  // عنوان دسته
  var s = null;
  for(var j=0; j<SOURCES.length; j++){
    if(SOURCES[j].id === sourceId){ s = SOURCES[j]; break; }
  }
  $('modalBadge').textContent = (s && s.title) || 'علاقه‌مندی';
  $('modalTitle').textContent = found.title || '—';
  $('modalContent').textContent = found.content || found.excerpt || '—';

  $('favModal').classList.add('show');
}

function closeModal(){
  stopSpeech();
  $('favModal').classList.remove('show');
  currentItem = null;
}

/* ═══ COPY / SHARE / SPEAK ═══ */
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showMsg('متن کپی شد ✓'); }
  catch(e){ showMsg('...'); }
  document.body.removeChild(ta);
}
function copyText(text){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text)
      .then(function(){ showMsg('متن کپی شد ✓'); })
      .catch(function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function shareText(text,title){
  if(!text) return;
  if(navigator.share){
    navigator.share({title:title||'بانوان نور',text:text}).catch(function(){});
  } else { copyText(text); showMsg('متن کپی شد'); }
}
function speakText(text,btn){
  if(!text) return;
  if(!('speechSynthesis' in window)){ showMsg('خواندن صوتی پشتیبانی نمی‌شود'); return; }
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    if(speechBtn === btn){ speechBtn = null; return; }
  }
  var utt = new SpeechSynthesisUtterance(text);
  utt.lang='fa-IR'; utt.rate=0.95; utt.pitch=1;
  try{
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(voices[i].lang && voices[i].lang.toLowerCase().indexOf('fa')===0){ utt.voice=voices[i]; break; }
    }
  }catch(e){}
  if(btn){ btn.classList.add('speaking'); speechBtn = btn; }
  utt.onend = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  utt.onerror = function(){ if(btn) btn.classList.remove('speaking'); if(speechBtn===btn) speechBtn=null; };
  window.speechSynthesis.speak(utt);
}
function stopSpeech(){
  try{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    if(speechBtn) speechBtn.classList.remove('speaking');
    speechBtn = null;
  }catch(e){}
}

/* ═══ MODAL ACTIONS ═══ */
function setupModalActions(){
  var bar = document.querySelector('#favModal .action-bar');
  if(bar){
    bar.addEventListener('click', function(e){
      var btn = e.target.closest('[data-fav-act]');
      if(!btn || !currentItem) return;
      var act = btn.getAttribute('data-fav-act');
      var fullText = (currentItem.title ? currentItem.title + '\n\n' : '') + (currentItem.content || '');
      if(act === 'copy') copyText(fullText);
      else if(act === 'share') shareText(fullText + '\n\n— بانوان نور', 'بانوان نور');
      else if(act === 'speak') speakText((currentItem.title ? currentItem.title + '. ' : '') + (currentItem.content || ''), btn);
    });
  }
  var closeBtn = $('modalClose');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  var modal = $('favModal');
  if(modal) modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && $('favModal').classList.contains('show')) closeModal();
  });
}

/* ═══ SEARCH ═══ */
function setupSearch(){
  var si = $('searchInput');
  if(!si) return;
  var timer = null;
  si.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      searchQuery = si.value || '';
      renderFavorites();
    }, 180);
  });
}

/* ═══ INIT ═══ */
function init(){
  applyTheme();
  setupSearch();
  setupModalActions();

  loadAllData().then(function(){
    renderTabs();
    renderFavorites();
    var count = buildFavorites().length;
    console.log('⭐ علاقه‌مندی‌ها آماده — ' + count + ' مورد');
  });

  window.addEventListener('storage', function(e){
    if(e.key === 'bn_theme') applyTheme();
    if(e.key && e.key.indexOf('bn_') === 0 && e.key.indexOf('bookmark') > -1){
      renderTabs();
      renderFavorites();
    }
  });

  try{
    if('speechSynthesis' in window) window.speechSynthesis.getVoices();
  }catch(e){}
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else init();

})();
</script>
